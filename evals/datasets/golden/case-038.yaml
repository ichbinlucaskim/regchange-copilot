expected_outcome: INSUFFICIENT_EVIDENCE
suggested_action: |
  **이관 후 종결.** 규율 대상이 정보통신망을 통한 콘텐츠 유통이며, 은행의 정보보호 규정은
  자산 보호와 개인정보 처리를 다룰 뿐 게시물 유통을 다루지 않는다. 은행이 게시판을
  운영하는 범위에서 관련이 있을 수 있으나 그 판단의 근거가 이 코퍼스에 없다.
  소관 후보는 디지털사업부와 준법감시부이며, 해당 부서 규정을 확인한 뒤 종결한다.

decoys:
  - doc_id: ISP-POL-001
    article_spec: 제9조 (임직원의 의무)
    content_spec: |
      임직원이 정책과 하위 규정을 준수하고, 업무상 알게 된 정보를 정당한 권한 없이 이용하거나
      외부에 제공하지 않으며, 위배 사실을 지체 없이 알린다는 조항. "누구든지 …하여서는
      아니 된다"와 금지 문형이 같다.
    why_not: |
      금지 규범이라는 형태가 같아 끌려온다. 그러나 사내 조항은 **임직원의 정보 유출 금지**
      이고 개정은 **누구든지에게 적용되는 불법 콘텐츠 유통 금지**다. 수범자 범위와 대상
      정보가 모두 다르다.

  - doc_id: ISP-GUIDE-003
    article_spec: 제37조 (마케팅 활용 제한)
    content_spec: |
      「정보통신망 이용촉진 및 정보보호 등에 관한 법률」 제50조에 따라 마케팅 목적 이용에
      별도 동의를 받고, 수신 거부 시 5영업일 내 발송 대상에서 제외한다는 조항.
      사내 코퍼스에서 정보통신망법을 조 단위로 인용하는 자리 중 하나다.
    why_not: |
      **법령명이 같다는 이유로 끌려오는 자리다.** 인용된 조문은 제50조이고 개정된 조문은
      제44조의7이다. 같은 법률의 다른 장이며 규율 대상도 광고 전송과 불법 콘텐츠로 다르다.

  - doc_id: ISP-PROC-002
    article_spec: 제8조 (대외 통지)
    content_spec: |
      사고 발생 시 대외 커뮤니케이션을 감독당국 보고와 고객 안내로 구분하고, 안내문 문안을
      홍보부가 작성해 정보보호부장의 확인을 받는다는 조항.
    why_not: |
      "정보의 유통"과 "공표"가 인접해 보인다. 이 조항은 case-014 에서도 함정이었고
      case-001·008 에서는 정답이었다 — **같은 문단이 개정에 따라 정답과 함정을 오간다.**
      이번 개정은 사고 통지와 무관하다.

