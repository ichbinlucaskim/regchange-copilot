notes: |
  case-014 와 원천(MST=282481)이 같고 정답도 같지만 **개정 유형이 다르다.** 014 는
  16개 조문의 신설이라 변경량이 크고, 038 은 기존 조문에서 낱말 몇 개가 바뀌었다.
  변경량이 다른데 정답이 같다는 것은 **변경 크기가 영향 여부를 예측하지 못한다**는 뜻이다.

  제2호의 축소("사실이나 거짓의 사실" → "거짓의 사실")는 **금지 범위를 좁히는 개정**이다.
  방향이 완화인 개정도 EMPTY 가 될 수 있다는 것을 이 케이스가 확인한다 —
  case-024(완화이지만 IMPACT)와 대조된다.
