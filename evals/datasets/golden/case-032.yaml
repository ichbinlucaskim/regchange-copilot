decoys:
  - doc_id: ISP-GUIDE-003
    article_spec: 제17조 (개인정보의 안전성 확보조치)
    content_spec: |
      「개인정보 보호법」 제29조에 따라 **관리적ㆍ기술적ㆍ물리적 조치**를 세 호로 나누어
      열거하는 조항. 세 낱말이 조문 제목과 같은 순서만 다를 뿐 그대로 들어 있고,
      각 호에 접근권한 제한·접속기록 보관·암호화·출입통제가 열거된다.
    why_not: |
      **사내 코퍼스에서 "물리적ㆍ기술적ㆍ관리적"이라는 세 낱말이 함께 나오는 유일한
      조항이다.** 어휘 유사도로는 최상위가 되어야 정상이다. 그러나 개정 조문의 수범자는
      **본인확인기관**이고 은행은 본인확인기관이 아니다. 조치의 내용도 법 제23조의3에 따른
      본인확인업무에 한정된다.

  - doc_id: ISP-PROC-001
    article_spec: 제13조 (비밀번호 규칙)
    content_spec: |
      비밀번호를 두 종류 이상 조합해 10자리 이상으로 설정하고, 90일마다 변경하며, 5회 연속
      실패 시 자동 잠금한다는 조항. 조 번호가 개정 조문과 같다.
    why_not: |
      조 번호가 같고 "기술적 조치"라는 상위 개념이 겹친다. 그러나 비밀번호 규칙은
      은행 계정의 기술 기준이고 개정은 본인확인기관의 고시 주체를 바꿨다.
      **B-1 은 이 조항을 잡지 않는다** — 조 번호가 같은 조가 아니라 그 번호를 인용한
      문단을 찾기 때문이다.

  - doc_id: ISP-GUIDE-002
    article_spec: 제13조 (정보자산 식별)
    content_spec: |
      각 부서장이 소관 정보자산 목록을 작성해 제출하고, 연 1회 이상 갱신하며, 변동 시 30일
      이내에 반영한다는 조항. 조 번호가 같다.
    why_not: |
      조 번호가 같을 뿐 주제가 겹치지 않는다. 이쪽도 B-1 이 잡는 자리가 아니다.

