notes: |
  **예측을 여기 적어 둔다 — 측정 전에 적어야 예측이다.**

  B-1 은 이 케이스를 2건 잡는다(실측) — ISP-GUIDE-002#5 의 "제13조에 따른 정보자산
  목록", ISP-GUIDE-003#29 의 "제13조에 따른 목적 외 이용". 둘 다 **사내 문서가 자기
  문서의 다른 조를 번호로 인용한 자리**이며 개정 법령과 무관하다. B-1 자신은 무엇 때문에
  걸렸는지 구별하지 못한다.

  우리 하이브리드 검색은 **다른 이유로** 걸릴 것이다 — 조문 제목
  "본인확인기관의 물리적ㆍ기술적ㆍ관리적 조치"와 제2항의
  "분실ㆍ도난ㆍ유출ㆍ위조ㆍ변조 또는 훼손되지"가 사내 보안 문서 어휘와 정면으로
  겹치기 때문이다.

  **예측: 검색이 ISP-GUIDE-002 계열(관리지침)의 기술적 보호조치 장과 ISP-GUIDE-003
  제17조를 상위로 올린다.** 그리고 최종 판정은 NO_IMPACT 여야 한다 — 수범자가 은행이
  아니기 때문이다.

  즉 이 케이스는 **검색은 걸리고 판정은 걸러야 하는** 자리다.
  `docs/16-baseline-comparison.md` 가 "LLM 의 기여는 「찾기」가 아니라 「고르기」와
  「모른다고 말하기」"라고 적은 것이 사실이라면 여기서 그 기여가 보여야 한다.
  **틀리면 그것도 발견이다** — 예측이 빗나간 방향을 §6-3 에 그대로 적는다.
