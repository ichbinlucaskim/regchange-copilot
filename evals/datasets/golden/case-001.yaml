# 침해사고 신고 기한이 "즉시"에서 "24시간 이내"로 바뀌고, 이용자 통지 의무가 신설됐다.
# 수치가 명시적으로 바뀐 유일한 사례이며 EASY 매칭의 기준선이다.
id: case-001
title: 침해사고 신고 기한 명문화(즉시 → 24시간)와 이용자 통지 의무 신설

source:
  law_id: "000030"
  law_name: 정보통신망 이용촉진 및 정보보호 등에 관한 법률
  mst: "285199"
  promulgation_date: "2026-03-31"
  promulgation_no: "21500"
  revision_kind: 일부개정
  effective_date: "2026-10-01"
  article_path: 제48조의3
  change_type: MODIFIED
  before: |
    ① 정보통신서비스 제공자는 침해사고가 발생하면 즉시 그 사실을 과학기술정보통신부장관이나
    한국인터넷진흥원에 신고하여야 한다. 이 경우 정보통신서비스 제공자가 이미 다른 법률에 따른
    침해사고 통지 또는 신고를 했으면 전단에 따른 신고를 한 것으로 본다.
    <개정 2009.4.22, 2013.3.23, 2017.7.26, 2022.6.10>
    ④ 제1항에 따른 신고의 시기, 방법 및 절차 등에 관하여 필요한 사항은 대통령령으로 정한다.
    <신설 2024.2.13>
  after: |
    ① 정보통신서비스 제공자는 침해사고가 발생하면 그 침해사고의 발생 사실을 알게 된 때부터
    24시간 이내에 침해사고의 발생 일시 및 대응 현황 등 대통령령으로 정하는 사항을
    과학기술정보통신부장관이나 한국인터넷진흥원에 신고하여야 한다. 이 경우 정보통신서비스
    제공자가 이미 다른 법률에 따른 침해사고 통지 또는 신고를 했으면 전단에 따른 신고를 한
    것으로 본다. <개정 2009.4.22, 2013.3.23, 2017.7.26, 2022.6.10, 2026.3.31>
    ④ 정보통신서비스 제공자는 대통령령으로 정하는 침해사고가 발생하면 지체 없이 그 사실을
    해당 이용자에게 통지하여야 한다. 이 경우 정보통신서비스 제공자가 이미 다른 법률에 따른
    침해사고 통지를 하였으면 전단에 따른 통지를 한 것으로 본다. <신설 2026.3.31>
    ⑤ 제1항에 따른 신고의 방법 및 절차와 제4항에 따른 통지의 대상, 시기, 방법 및 절차 등에
    관하여 필요한 사항은 대통령령으로 정한다. <신설 2024.2.13, 2026.3.31>
  summary: |
    신고 기한이 "즉시"에서 "발생 사실을 알게 된 때부터 24시간 이내"로 명문화되고,
    신고 시 제출할 사항(발생 일시·대응 현황)이 추가됐다. 이용자에 대한 통지 의무(④)가
    신설되면서 기존 ④(위임 규정)는 ⑤로 밀렸다.
  evidence:
    after_snapshot: law/MST-285199
    before_snapshot: law/MST-283843
    note: |
      before는 같은 법령의 직전 버전(2026-03-10 공포, 시행 2026-09-11)에서 가져왔다.
      efYd 소급 조회가 아니라 MST 두 개를 각각 조회한 결과다 (law-api-spec.md §3.2).

expected_outcome: IMPACT

expected_impacts:
  - doc_id: ISP-PROC-002
    article_spec: 제7조 (침해사고 신고)
    difficulty: EASY
    content_spec: |
      "침해사고를 인지한 즉시 과학기술정보통신부장관 또는 한국인터넷진흥원에 신고한다"는
      취지의 조항. 법령 어휘("침해사고", "신고", "즉시")를 거의 그대로 쓰고,
      머리에 "「정보통신망 이용촉진 및 정보보호 등에 관한 법률」 제48조의3에 따라"라는
      명시적 법령 인용을 둔다. 신고 시 기재사항은 열거하지 않는다.
    why: |
      법령 인용이 명시돼 있고 어휘가 일치하며, 바뀐 수치("즉시" → "24시간 이내")가
      조항 본문에 그대로 들어 있다. 이 케이스를 못 잡으면 나머지는 볼 필요가 없다.

  - doc_id: ISP-PROC-002
    article_spec: 제8조 (대외 통지)
    difficulty: MEDIUM
    content_spec: |
      사고 발생 시 대외 커뮤니케이션 절차. "감독당국 보고"와 "고객 안내"를 구분해
      기술하되, 어휘를 법령과 다르게 쓴다 — "이용자 통지"가 아니라 "고객 안내",
      "침해사고"가 아니라 "보안사고". 안내 여부는 홍보부와 협의해 정한다고만 쓰고
      의무로 규정하지 않는다. 법령 인용 없음.
    why: |
      신설된 ④(이용자 통지 의무)가 대응한다. "이용자 통지"와 "고객 안내"라는 어휘
      불일치를 넘어야 하고, 기존 조항이 재량("협의해 정한다")인데 법령이 의무가 된
      변화를 짚어야 한다.

  - doc_id: ISP-GUIDE-002
    article_spec: 제35조 (침해사고 예방점검 및 보고체계)
    difficulty: MEDIUM
    content_spec: |
      침해사고 보고체계를 다루되 **사내 보고**에 초점을 둔다 — "정보보호부장은 사고
      인지 후 2시간 이내에 정보보호 최고책임자에게 보고한다". 대외 신고는
      "관련 절차서에 따른다"고만 언급한다.
    why: |
      사내 보고 시한(2시간)과 법정 신고 시한(24시간)의 정합성 검토가 필요하다.
      직접 대응은 아니지만 시한 체계가 얽혀 있어 함께 검토돼야 한다.

decoys:
  - doc_id: ISP-PROC-001
    article_spec: 제21조 (이상행위 탐지 시 조치)
    content_spec: |
      비인가 접근 시도를 탐지하면 "즉시" 해당 계정을 차단하고 관리자에게 통보한다는
      조항. "즉시"라는 같은 부사를 쓰고 "탐지·통보"라는 인접 어휘를 쓴다.
    why_not: |
      "즉시"라는 표현이 겹치지만 대상이 계정 차단이라는 내부 기술 조치이며,
      감독당국 신고와 무관하다. 개정된 것은 대외 신고 기한이다.

  - doc_id: ISP-PROC-001
    article_spec: 제18조 (접속기록의 보관)
    content_spec: |
      접속기록을 2년간 보관한다는 조항. 구체적 기간이 명시돼 있다.
    why_not: |
      기간이 명시된 조항이라 "기한이 바뀐 개정"에 끌려오기 쉽다. 그러나 이 개정은
      보관기간을 건드리지 않았다. 수치가 있다는 것만으로 매칭하면 걸린다.

expected_departments: [정보보호부]
expected_risk: HIGH
notes: |
  expected_risk를 HIGH로 둔 근거: (1) 기한이 재량적 표현에서 확정 수치로 바뀌어
  기존 절차로는 위반 여부가 판정 가능해졌고, (2) 이용자 통지가 재량에서 의무가 됐으며,
  (3) 시행일(2026-10-01)까지 절차서 개정과 훈련이 필요하다.

  이 케이스가 골든셋의 기준선이다. EASY 대상(ISP-PROC-002 제7조)은 법령 인용·어휘·
  수치가 모두 일치하므로, 검색이 이것을 놓치면 지표를 볼 것이 없다.
