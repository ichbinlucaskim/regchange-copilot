expected_outcome: IMPACT

expected_impacts:
  - doc_id: ISP-GUIDE-002
    article_spec: 제19조 (정보보호 관리체계 인증)
    difficulty: MEDIUM
    content_spec: |
      정보보호 관리체계 인증을 취득·갱신한다는 조항. 제2항이 "인증 취득 대상 여부는 은행이
      주요정보통신서비스 제공자에 해당하는 경우를 기준으로 판단한다"는 **한 문장짜리 판단
      기준**을 둔다. 법령 인용은 제47조이며 시행령은 인용하지 않는다.
    why: |
      개정된 시행령 제49조가 법 제47조제2항제1호의 대상자를 정의한다. 사내 조항의 판단
      기준이 그 정의를 가리키므로, 정의가 열거식으로 바뀌면 판단 기준의 문언과 근거가 함께
      재검토돼야 한다. **사내 조항은 법률만 인용하고 시행령을 인용하지 않아** 개정 사실이
      문서에서 보이지 않는다.

  - doc_id: ISP-POL-001
    article_spec: 제15조 (인증 및 외부평가)
    difficulty: MEDIUM
    content_spec: |
      "필요한 인증을 취득하고 유지한다"는 정책 최상위 한 문장. 어떤 인증이 필요한지는
      지침에 위임한다.
    why: |
      "필요한 인증"의 판단 근거가 바뀌는 개정이다. 정책 계층의 위임 구조를 따라 올라가야
      잡히는 항목이며, 문단 유사도만으로는 잡히지 않는다 — R-22 가 지목한 자리다.

decoys:
  - doc_id: ISP-GUIDE-002
    article_spec: 제21조 (인증 범위의 변경)
    content_spec: |
      인증 범위에 포함된 정보시스템 목록 관리와 신설·폐기 시 사전 통보를 정하는 조항.
      제목에 "범위"가 들어 있어 개정 조문의 제목("인증 대상자의 범위")과 문자열이 겹친다.
    why_not: |
      제목의 "범위"가 정면으로 겹치는 것이 이 함정의 핵심이다. 그러나 개정이 정한 범위는
      **누가 인증을 받아야 하는가**이고 이 조항의 범위는 **어느 시스템이 인증에 포함되는가**다.
      제목 유사도로 매칭하면 반드시 걸린다.

  - doc_id: ISP-GUIDE-002
    article_spec: 제20조 (인증 사후관리)
    content_spec: |
      매년 1회 사후심사, 심사자료 제출, 지적사항 60일 이내 조치를 정하는 조항.
    why_not: |
      "인증"이라는 어휘를 공유하지만 개정은 대상자 정의만 건드렸고 사후관리 절차는
      바뀌지 않았다. 같은 개정에서 사후관리를 건드린 것은 case-004(법률 제47조)이며
      이 케이스가 아니다.

expected_departments: [정보보호부]
expected_risk: LOW
notes: |
  expected_risk 를 LOW 로 둔 근거: 개정이 넣은 제2호(이동통신 재판매사업자)와 제1호가 더한
  요건(전기통신회선설비 설치ㆍ보유)은 모두 통신사업자를 겨냥한 것이고, 은행이 그 요건에
  해당한다고 볼 근거가 개정문에 없다. **영향은 "대상 여부를 다시 확인해야 한다"까지이고
  의무의 내용이 바뀐 것은 아니다.**

  그럼에도 IMPACT 로 둔 이유: 사내 조항이 대상 여부를 **한 문장으로 못박아** 두었고 그
  문장의 근거가 재정의됐다. 근거가 바뀌었는데 문장을 그대로 두면, 다음 심사에서 그 문장이
  무엇을 근거로 쓰였는지 설명할 수 없다. **의무가 안 바뀌는 것과 문서를 안 고쳐도 되는
  것은 다르다.**

  **원천 279313 에서 IMPACT 는 이 한 건뿐이다.** 같은 개정의 제36조의7·8(정보보호
  최고책임자 지정신고)은 검토했으나 케이스로 만들지 않았다 — 사유는
  `evals/datasets/golden/README.md` §3.1 에 적었다.
