  before: |
    제28조의7(적용범위) 제28조의2 또는 제28조의3에 따라 처리된 가명정보는 제20조, 제20조의2,
    제27조, 제34조제1항, 제35조, 제35조의2, 제36조 및 제37조를 적용하지 아니한다.
  after: |
    제28조의7(적용범위) 제28조의2 또는 제28조의3에 따라 처리된 가명정보는 제20조, 제20조의2,
    제27조, 제34조제1항ㆍ제2항, 제35조, 제35조의2, 제36조 및 제37조를 적용하지 아니한다.
  summary: |
    가명정보에 적용하지 않는 조문 목록에서 "제34조제1항"이 "제34조제1항ㆍ제2항"으로 넓어졌다.
    같은 개정으로 제34조에 신설된 "유출 가능성" 단계의 통지 의무(case-008)가 가명정보에는
    적용되지 않는다는 뜻이다. 제34조제3항(감독당국 신고)은 목록에 없으므로 계속 적용된다.
  evidence:
    after_snapshot: law/MST-283839
    before_snapshot: oldandnew/MST-283839
    note: |
      before 는 신구법 대비표의 구조문목록에서 옮겼다. 제34조제2항이 같은 개정에서 신설된
      항이라는 것은 case-008 의 원천(같은 MST, 제34조)에서 확인된다.

expected_outcome: IMPACT

expected_impacts:
  - doc_id: ISP-GUIDE-003
    article_spec: 제16조 (가명정보 처리)
    difficulty: MEDIUM
    content_spec: |
      「개인정보 보호법」 제28조의2에 따라 가명정보를 처리할 때 목적과 방법을 문서로 남기고,
      재식별 시 즉시 중지·파기하며, 추가 정보를 분리 보관한다는 조항. 법령 인용이
      제28조의2 까지만 있고 제28조의7(적용범위)은 인용하지 않는다. 유출 시 처리는 언급하지
      않는다.
    why: |
      사내에서 가명정보를 다루는 유일한 조항이다. 가명정보에 어느 의무가 적용되지 않는지가
      바뀌었으므로, 이 조항이 유출 대응과 어떻게 이어지는지를 명시해야 한다.
      **적용 제외 목록이 늘어난 것을 문서가 알 수 있는 경로가 지금 없다.**

  - doc_id: ISP-GUIDE-003
    article_spec: 제26조 (개인정보 유출 시 조치)
    difficulty: MEDIUM
    content_spec: |
      유출 사실 확인 시 보고·대책 마련, 「개인정보 보호법」 제34조제3항에 따른 보호위원회
      신고, 정보주체 통지 절차의 ISP-PROC-002 위임을 정하는 조항. 조문 단위 인용
      (제34조제3항)이 본문에 있다.
    why: |
      이 조항이 인용하는 제34조가 개정의 대상이다. 신고(제3항)는 가명정보에도 계속
      적용되고 통지(제1항·제2항)는 적용되지 않으므로, **같은 사고에서 신고는 하고 통지는
      하지 않는 경우**가 생긴다. 그 구별이 조항에 없다.

  - doc_id: ISP-PROC-002
    article_spec: 제11조 (개인정보 유출 통지)
    difficulty: MEDIUM
    content_spec: |
      「개인정보 보호법」 제34조제1항에 따라 정보주체에게 알릴 사항 5호를 열거하는 조항.
      머리에 조·항 단위 인용("제34조제1항")이 명시돼 있다. 가명정보에 대한 예외는 없다.
    why: |
      **인용된 항 번호가 정확히 개정 대상이다.** 개정 전 목록이 "제34조제1항"이었고 사내
      조항도 "제34조제1항"을 인용하므로 문자열이 일치한다. 가명정보 예외를 절차서에
      반영하지 않으면 하지 않아도 되는 통지를 하게 된다.

decoys:
  - doc_id: ISP-GUIDE-003
    article_spec: 제24조 (분리보관)
    content_spec: |
      법령에 따라 보존해야 하는 개인정보를 다른 개인정보와 분리 보관하고, 접근자를 부서별
      1명 이하로 지정한다는 조항. "분리"라는 어휘를 쓴다.
    why_not: |
      가명정보 조항(제16조제3항)이 "추가 정보를 분리하여 보관"이라고 쓰기 때문에 "분리"
      어휘로 끌려온다. 그러나 이 조항의 분리보관은 법정 보존 대상 개인정보에 관한 것이고
      개정은 가명정보의 적용 제외 범위를 다룬다.

  - doc_id: ISP-GUIDE-003
    article_spec: 제27조 (유출 규모 산정)
    content_spec: |
      유출 규모를 항목별 정보주체 수로 산정하고 중복을 하나로 계산하며 추정치를 쓰지 않는다는
      조항. "유출" 어휘가 제목에 있다.
    why_not: |
      "유출"이 제목에 있어 걸리기 쉽다. 그러나 규모 산정은 제34조의 통지 대상 판단 이전
      단계이고, 개정은 가명정보에 통지 조항 자체를 적용하지 않는다고 정했다. 산정 방법은
      바뀌지 않았다.

expected_departments: [정보보호부]
expected_risk: MEDIUM
notes: |
  **이 케이스가 어려운 이유는 개정문에 의무가 없기 때문이다.** 바뀐 것은 조·항 번호 목록
  한 줄이고, 그 목록이 가리키는 제34조제2항이 무엇인지는 **다른 조문**을 읽어야 안다.
  게다가 방향이 반대다 — 의무가 생긴 것이 아니라 **면제가 늘었다.** 면제도 문서에 반영해야
  하며, 반영하지 않으면 하지 않아도 되는 통지를 계속하게 된다.

  case-008 과 짝이다. 008 은 제34조제2항이 **생긴 것**을, 022 는 그것이 가명정보에는
  **걸리지 않는 것**을 다룬다. 두 케이스를 같이 넣은 이유는 "신설된 의무를 찾는 것"과
  "그 의무의 적용 범위를 좁히는 개정을 찾는 것"이 다른 능력이기 때문이다.
