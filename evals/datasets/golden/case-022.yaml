# 가명정보에 적용하지 않는 조문 목록에 "제34조제2항"이 붙었다. 같은 개정이 신설한
# 「유출 가능성」 통지 의무(case-008)가 가명정보에는 걸리지 않는다는 뜻이다.
id: case-022
title: 가명정보 적용 제외 범위에 "유출 가능성" 단계 통지 의무 추가

