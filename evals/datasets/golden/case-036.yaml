  before: |
    제2조의4(금융회사의 피해 방지 책임 등) ① 금융회사는 전기통신금융사기 피해 방지를 위하여
    이용자가 다음 각 호의 어느 하나에 해당하는 행위를 하는 경우에는 대통령령으로 정하는 바에
    따라 본인임을 확인하는 조치(이하 "본인확인조치"라 한다)를 하여야 한다. 다만, 법인인
    이용자가 본인확인조치를 희망하지 아니하거나 이용자가 국외에 체류하는 등의 사유로
    본인확인조치를 하기 어려운 경우로서 대통령령으로 정하는 경우에 해당하면 그러하지 아니하다.
    1. 해당 금융회사에 대출을 신청하는 경우
    2. 해당 금융회사와 체결한 계약에 따라 가입한 저축성 예금ㆍ적금ㆍ부금 또는 그 밖에
    대통령령으로 정하는 금융상품을 해지하는 경우
    ② 금융회사는 제1항을 위반하여 본인확인조치를 하지 않음으로써 이용자에게 손해가 발생한
    경우에는 그 손해를 배상할 책임을 진다.
  after: |
