expected_outcome: INSUFFICIENT_EVIDENCE
suggested_action: |
  **이관 후 종결.** 본인확인조치는 대출 신청·금융상품 해지 시의 창구 절차이며 사내
  정보보호 규정이 다루는 대상이 아니다. 소관은 여신·수신 업무 부서와 금융사기 대응
  부서이고 그 규정은 이 코퍼스에 없다.

decoys:
  - doc_id: ISP-POL-001
    article_spec: 제5조 (경영진의 책임)
    content_spec: |
      경영진이 정보보호 및 개인정보 보호의 중요성을 인식하고 정보보호 활동에 필요한 자원을
      지원한다는 한 문장짜리 정책 조항. 제목이 "책임"으로 끝난다.
    why_not: |
      제목의 "책임"이 개정 조문의 "피해 방지 책임 등"과 겹친다. 그러나 이 조항은 정보보호
      자원 배분에 관한 것이고 개정은 금융사기 피해에 대한 손해배상 책임이다.
      **이 조항은 case-010 에서 정답이었으므로** 문서-조항 쌍을 외운 구현이 특히 걸린다.

  - doc_id: ISP-POL-001
    article_spec: 제18조 (위반 시 조치)
    content_spec: |
      정책 위반 임직원에 대한 인사상 책임, 인사부장 통보, 손해 발생 시 책임 범위를 내규로
      정한다는 조항. "위반", "손해", "책임"이 한 조문에 모여 있다.
    why_not: |
      "제1항을 위반하여 … 손해가 발생한 경우에는 그 손해를 배상할 책임을 진다"와 어휘가
      거의 그대로 겹친다. 그러나 사내 조항은 **임직원의 내부 책임**이고 개정은 **은행이
      이용자에게 지는 대외 책임**이다. 책임의 방향이 반대다.

  - doc_id: ISP-GUIDE-003
    article_spec: 제10조 (동의 획득)
    content_spec: |
      동의를 받을 때 목적·항목·보유기간·거부 시 불이익을 구분해 알리고, 항목별 선택이
      가능하게 하며, 동의 기록을 5년간 보존한다는 조항. "확인", "이용자"와 인접한 어휘를 쓴다.
    why_not: |
      "본인확인조치"가 본인확인·동의 계열 조항을 끌어당긴다. 그러나 개정의 본인확인은
      사기 피해 방지를 위한 신원 확인이고 이 조항은 개인정보 수집 동의다.

expected_departments: []
expected_risk: LOW
notes: |
  **책임 어휘가 겹치는 것이 이 케이스의 함정이다.** 사내 코퍼스에서 "책임"이 제목에 있는
  조항은 ISP-POL-001 제5조·제18조와 제6조·제7조(책임자)이며, 넷 다 정보보호 책임이다.
  개정의 책임은 금융사기 피해에 대한 민사 배상 책임이고 근거 법률도 다르다.

  035 와 같은 개정·같은 성격이지만 걸리는 어휘 계열이 다르다 — 035 는 절차 구조,
  036 은 책임 어휘다.
