# 사내에 문서(절차서)는 있으나 그것을 대외 제출·점검받는 의무가 새로 생겼다.
id: case-006
title: 침해사고 관리·대응 매뉴얼 작성·제출 의무 신설

source:
  law_id: "000030"
  law_name: 정보통신망 이용촉진 및 정보보호 등에 관한 법률
  mst: "285199"
  promulgation_date: "2026-03-31"
  promulgation_no: "21500"
  revision_kind: 일부개정
  effective_date: "2026-10-01"
  article_path: 제48조의9
  change_type: ADDED
  before: null
  after: |
    제48조의9(침해사고 관리ㆍ대응 매뉴얼)
    ① 과학기술정보통신부장관은 침해사고의 예방 및 피해 확산 방지를 위하여 침해사고 관리ㆍ대응
    매뉴얼 표준안을 마련하여 보급하여야 한다.
    ② 과학기술정보통신부장관은 제1항에 따른 표준안 마련 및 보급에 관한 업무의 전부 또는 일부를
    한국인터넷진흥원에 위탁할 수 있다.
    ③ 정보통신서비스 제공자 등 정보통신망을 운영하는 자로서 대통령령으로 정하는 자(이하 이
    조에서 "정보통신서비스제공자등"이라 한다)는 제1항의 표준안에 따라 해당 정보통신서비스의
    규모 및 특성에 적합한 침해사고 관리ㆍ대응 매뉴얼을 작성하여 과학기술정보통신부장관과
    한국인터넷진흥원에 제출하여야 한다. 이를 새로이 작성하거나 변경한 때에도 또한 같다.
    ④ 과학기술정보통신부장관은 제3항에 따른 침해사고 관리ㆍ대응 매뉴얼의 작성 및 운용 실태를
    정기적으로 또는 수시로 점검하여야 하며, 그 결과에 따라 이를 시정 또는 보완하기 위하여
    정보통신서비스제공자등에게 필요한 조치를 명할 수 있다. 이 경우 정보통신서비스제공자등은
    그 명령을 따라야 한다.
    ⑤ 그 밖에 침해사고 관리ㆍ대응 매뉴얼의 작성ㆍ운용 및 제출ㆍ점검 등에 필요한 사항은
    대통령령으로 정한다.
  summary: |
    감독기관이 배포하는 표준안에 따라 침해사고 관리·대응 매뉴얼을 작성해 과기정통부장관과
    한국인터넷진흥원에 **제출**해야 하고, 변경 시에도 제출해야 한다. 작성·운용 실태가
    점검 대상이 되고 시정명령에 따를 의무가 생겼다.
  evidence:
    after_snapshot: law/MST-285199
    note: 본조신설이므로 before가 없는 것이 정상이다.

expected_outcome: IMPACT

expected_impacts:
  - doc_id: ISP-PROC-002
    article_spec: 제4조 (침해사고의 정의 및 등급)
    difficulty: MEDIUM
    content_spec: |
      침해사고를 3등급으로 분류하고 등급별 대응 체계를 정한 조항. 이 절차서 전체가
      사실상 사내 침해사고 대응 매뉴얼에 해당하지만, 문서 어디에도 "매뉴얼"이라는
      낱말을 쓰지 않고 "절차서"라고만 부른다. 대외 제출에 관한 조항은 **없다.**
    why: |
      법령이 요구하는 "침해사고 관리·대응 매뉴얼"의 실체가 이 절차서다. 어휘가 전혀
      겹치지 않으므로(매뉴얼 / 절차서) 명칭이 아니라 내용으로 대응 관계를 찾아야 한다.

  - doc_id: ISP-PROC-002
    article_spec: 제19조 (대응 절차의 점검 및 훈련)
    difficulty: MEDIUM
    content_spec: |
      연 1회 이상 침해사고 대응 훈련을 실시하고 절차서를 검토·갱신한다는 조항.
      갱신 결과의 사내 승인 절차만 규정하고 **대외 제출은 없다.**
    why: |
      ③ 후단("새로이 작성하거나 변경한 때에도 또한 같다")이 이 조항의 갱신 절차에
      제출 단계를 추가하도록 만든다. 갱신 때마다 제출이라는 반복 의무가 생기는 것이
      운영상 가장 큰 변화다.

decoys:
  - doc_id: ISP-GUIDE-002
    article_spec: 제35조 (침해사고 예방점검 및 보고체계)
    content_spec: |
      case-001에서 MEDIUM 정답으로 쓰인 조항. 침해사고 사내 보고체계를 다룬다.
    why_not: |
      "침해사고"라는 어휘가 겹치고 case-001에서 정답이었으므로 끌려오기 쉽다.
      그러나 이 개정은 사내 보고체계가 아니라 매뉴얼 문서의 작성·제출·점검을 규율한다.
      **같은 개정 법률의 다른 조문끼리도 대응 문단이 달라야 한다**는 것을 시험한다.

  - doc_id: ISP-PROC-001
    article_spec: 제9조 (계정 발급 및 회수)
    content_spec: |
      계정 발급·회수 절차를 단계별로 기술한 조항. 문서 성격이 "매뉴얼"에 가까운
      상세 절차이며 "작성", "변경", "승인" 같은 어휘가 반복된다.
    why_not: |
      절차 문서라는 형식적 유사성뿐이며 침해사고와 무관하다.
      문서의 형식(절차/매뉴얼)으로 매칭하면 걸린다.

expected_departments: [정보보호부]
expected_risk: MEDIUM
notes: |
  이 케이스의 핵심은 **어휘가 하나도 겹치지 않는 대응 관계**다. 법령은 "매뉴얼"이라 하고
  사내 문서는 "절차서"라고 한다. 명칭 유사도로는 절대 찾을 수 없고, 문서가 규율하는
  대상(침해사고 발생 시 무엇을 어떻게 하는가)이 같다는 것으로만 연결된다.

  expected_risk MEDIUM: 문서 자체는 이미 있으므로 신규 작성 부담은 없다. 다만 제출·점검·
  시정명령 이행이라는 대외 절차가 새로 생겼고, 갱신할 때마다 제출해야 하므로 운영 부담이
  지속된다.
