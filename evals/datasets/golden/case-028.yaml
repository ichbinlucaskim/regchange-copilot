decoys:
  - doc_id: ISP-GUIDE-003
    article_spec: 제31조 (정보주체의 권리 보장)
    content_spec: |
      열람·정정·삭제·처리정지 요구를 10일 이내에 처리하고, 제4항에서 "개인정보의 전송 요구에
      관하여는 관련 절차에 따라 처리한다"고 미뤄 두는 조항.
    why_not: |
      **이 조항은 case-025 의 EASY 정답이다.** 같은 조문 경로(시행령 제42조의2)의 개정인데
      025 에서는 정답이고 028 에서는 함정이다. 갈리는 지점은 조문 경로가 아니라
      `제개정구분명`과 개정 내용이다 — 025 는 일부개정으로 의무자 기준이 바뀌었고,
      028 은 타법개정으로 부처 이름만 바뀌었다.

  - doc_id: ISP-GUIDE-002
    article_spec: 제31조 (암호화 적용 기준)
    content_spec: |
      암호 알고리즘 목록과 키 길이, 외부 구간 전송 암호화, 외부 기관 연동 시 사전 협의를
      정하는 조항. "전송"이라는 어휘가 반복된다.
    why_not: |
      "전송"이 겹치고 조 번호(제31조)까지 위 함정과 같아 두 문서가 함께 끌려온다. 개정은
      에너지정보전송자에 대한 고시 주체의 이름만 바꿨고 은행은 에너지정보전송자가 아니다.

  - doc_id: ISP-GUIDE-002
    article_spec: 제42조 (문서 관리)
    content_spec: |
      지침과 절차서의 제·개정 이력을 앞머리에 기록하고, 연 1회 이상 검토하며, 폐지된 문서를
      5년간 보존한다는 조항. 사내 코퍼스에서 조 번호가 "제42조"인 유일한 조항이다.
    why_not: |
      **조 번호 문자열 매칭(B-1)이 걸리는 자리다.** 개정 조문이 제42조의2이므로 "제42조"
      토큰이 이 조항과 일치한다. 사내 문서가 그 법령을 인용해서가 아니라 자기 조 번호가
      우연히 같아서 걸린 것이며, 그 성격이 `INTERNAL_REFERENCE` 다.

