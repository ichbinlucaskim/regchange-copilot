notes: |
  **(나) 유형의 두 번째 대조쌍이다.** 첫 번째는 정보통신망법 제45조의3(case-002 IMPACT /
  case-003 NO_IMPACT)이고, 이것은 개인정보 보호법 시행령 제42조의2(case-025 IMPACT /
  case-028 NO_IMPACT)다.

  첫 번째와 다른 점이 하나 있다. 003 과 002 는 **21일 간격**이지만 028 과 025 는
  **4개월 반 간격**(2025-10-01 → 2026-02-19)이고, 028 이 **먼저**다. 즉 이 쌍은
  "같은 조문이 짧은 간격에 두 번 바뀐다"가 아니라 "같은 조문의 이력을 따라가면 타법개정과
  실질개정이 번갈아 나온다"를 보여 준다. 12개월 전수에서 조문 이벤트의 56.2%가
  타법개정이라는 실측(`docs/domain-selection/amendment-frequency.md` D-2)이 조문 하나의
  이력에서도 그대로 나타난다.
