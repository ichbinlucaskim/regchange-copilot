expected_outcome: INSUFFICIENT_EVIDENCE
suggested_action: |
  **이관 후 종결.** 이 조문은 금융회사 사이의 사기 계좌 정보 공유 체계를 정하며, 신용정보법
  제32조·제33조의 적용을 **배제**한다. 사내 개인정보 제공 조항(ISP-GUIDE-003 제28조·제29조)은
  개인정보 보호법과 신용정보법을 근거로 서 있으므로, 그 근거가 배제되는 경로에는 적용되지
  않는다. 소관은 금융사기 대응 부서이며 그 규정은 이 코퍼스에 없다.

decoys:
  - doc_id: ISP-GUIDE-003
    article_spec: 제29조 (제공 기록 관리)
    content_spec: |
      목적 외 이용과 제3자 제공 내역을 제공 대장에 기록하고, 제공 일시·제공받는 자·항목·
      목적·법적 근거를 기재하며, 대장을 5년간 보존한다는 조항. "제공"이 제목과 본문에
      반복된다.
    why_not: |
      "제공"과 "공유"가 정면으로 겹치고, 개정 조문이 「신용정보의 이용 및 보호에 관한 법률」을
      인용하는 것도 이 조항 계열(제12조·제36조)과 이어져 보인다. 그러나 개정은 그 법률의
      적용을 **배제**하는 특례이며, 사내 제공 대장의 근거가 되는 조항이 아니다.

  - doc_id: ISP-GUIDE-003
    article_spec: 제28조 (개인정보의 제3자 제공)
    content_spec: |
      제3자 제공 시 동의를 받고, 동의 없이 제공할 수 있는 경우에는 개인정보 보호책임자의
      승인을 받으며, 제공 항목을 최소한으로 한정한다는 조항.
    why_not: |
      "동의 없이 제공"이라는 구조가 개정의 "…에도 불구하고 … 공유하여야 한다"와 닮았다.
      그러나 사내 조항의 근거는 개인정보 보호법 제17조·제18조이고, 개정 특례는 금융실명법·
      신용정보법·전자금융거래법의 비밀보장 규정을 배제한다. 배제되는 법률 목록에
      개인정보 보호법은 없다.

  - doc_id: ISP-PROC-001
    article_spec: 제18조 (접속기록의 보관)
    content_spec: |
      접속기록을 2년간 보관하고 접속 계정·일시·접속지·수행 업무를 포함하며 별도 저장소에
      보관한다는 조항. "자료", "기록", "보관" 어휘가 있다.
    why_not: |
      "필요한 자료를 요청ㆍ제공"이 기록 보관 조항을 끌어당긴다. 그러나 개정의 자료는
      금융거래 계좌자료이고 이 조항의 기록은 시스템 접속기록이다.

expected_departments: []
expected_risk: LOW
notes: |
  **이 케이스의 판정 근거는 「배제되는 법률 목록」에 있다.** 개정 조문이 신용정보법 제32조·
  제33조의 적용을 배제하므로, 그 법률을 근거로 선 사내 조항은 이 경로에 적용되지 않는다.
  어휘("제공", "공유", "신용정보")는 최대로 겹치는데 **법적 근거는 오히려 끊어져 있다.**

  035·036 과 함께 같은 원천에서 셋을 뽑았고, 셋 다 사내 어휘와 겹치는 계열이 다르다.
  037 이 셋 중 어휘 유사도가 가장 높을 것으로 본다 — 「제공」과 「신용정보법」이 동시에
  걸리기 때문이다.
