  before: |
    제23조의3(본인확인기관의 지정 등) ① 방송통신위원회는 다음 각 호의 사항을 심사하여
    대체수단의 개발ㆍ제공ㆍ관리 업무(이하 "본인확인업무"라 한다)를 안전하고 신뢰성 있게
    수행할 능력이 있다고 인정되는 자를 본인확인기관으로 지정할 수 있다.
    ② 본인확인기관이 본인확인업무의 전부 또는 일부를 휴지하고자 하는 때에는 휴지기간을 정하여
    휴지하고자 하는 날의 30일 전까지 이를 이용자에게 통보하고 방송통신위원회에 신고하여야
    한다. 이 경우 휴지기간은 6개월을 초과할 수 없다.
    ③ 본인확인기관이 본인확인업무를 폐지하고자 하는 때에는 폐지하고자 하는 날의 60일 전까지
    이를 이용자에게 통보하고 방송통신위원회에 신고하여야 한다.
  after: |
    제23조의3(본인확인기관의 지정 등) ① 방송미디어통신위원회는 다음 각 호의 사항을 심사하여
    대체수단의 개발ㆍ제공ㆍ관리 업무(이하 "본인확인업무"라 한다)를 안전하고 신뢰성 있게
    수행할 능력이 있다고 인정되는 자를 본인확인기관으로 지정할 수 있다.
    ② 본인확인기관이 본인확인업무의 전부 또는 일부를 휴지하고자 하는 때에는 휴지기간을 정하여
    휴지하고자 하는 날의 30일 전까지 이를 이용자에게 통보하고 방송미디어통신위원회에
    신고하여야 한다. 이 경우 휴지기간은 6개월을 초과할 수 없다.
    ③ 본인확인기관이 본인확인업무를 폐지하고자 하는 때에는 폐지하고자 하는 날의 60일 전까지
    이를 이용자에게 통보하고 방송미디어통신위원회에 신고하여야 한다.
  summary: |
    「정부조직법」 개정에 따른 타법개정이다. "방송통신위원회"가 "방송미디어통신위원회"로
    바뀐 것이 전부이며, 지정 요건·통보 기한(30일·60일)·휴지 기간 상한(6개월)은 그대로다.
