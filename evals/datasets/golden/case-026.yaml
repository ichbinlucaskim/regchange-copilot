expected_outcome: NO_IMPACT

decoys:
  - doc_id: ISP-PROC-001
    article_spec: 제9조 (계정 발급 및 회수)
    content_spec: |
      계정 발급·변경·회수의 단계를 정하는 조항. 회수 단계에서 "정지일부터 30일이 지난 후
      계정 등록을 취소한다"는 30일 기준이 있고, 신청·승인·통보의 단계 구조가 개정 조문의
      "통보하고 신고하여야 한다"와 형태가 닮았다.
    why_not: |
      "30일"이라는 수치와 "통보"라는 어휘가 겹친다. 그러나 개정 조문의 30일은 본인확인기관이
      **이용자에게** 휴지를 알리는 기한이고, 사내 30일은 계정 정지 후 등록 취소까지의
      유예다. 수치가 같다는 것은 근거가 아니다.

  - doc_id: ISP-GUIDE-002
    article_spec: 제6조 (정보보호 최고책임자의 지정)
    content_spec: |
      정보보호 최고책임자의 지정을 인사 발령으로 하고, 지정·변경 사실을 기록해 5년간
      보존하며, 공석 시 30일 이내에 후임 지정 절차를 개시한다는 조항. "지정"이 제목에 있다.
    why_not: |
      제목에 "지정"이 있고 개정 조문의 제목도 "지정 등"이라 제목 유사도가 높다. 그러나
      개정이 다루는 지정은 **감독기관이 사업자를 본인확인기관으로 지정하는 것**이고
      사내 조항은 은행이 임직원을 책임자로 지정하는 것이다. 주체와 객체가 모두 다르다.

  - doc_id: ISP-GUIDE-003
    article_spec: 제5조 (개인정보 보호책임자의 지정)
    content_spec: |
      임원 중에서 개인정보 보호책임자를 지정하고, 정보보호부장 기안 → 준법감시부장 검토 →
      대표이사 승인의 결재선을 정하며, 성명·연락처를 처리방침에 공개한다는 조항.
    why_not: |
      "지정" 어휘가 다시 겹친다. 이 조항은 case-007·case-010 에서 정답이었으므로
      **문서-조항 쌍을 외운 구현이 특히 걸리기 쉽다.** 근거 법령이 개인정보 보호법이고
      개정은 정보통신망법이다.

expected_departments: []
expected_risk: LOW
notes: |
  타법개정 일반형이다. 은행은 본인확인기관이 아니므로 이 조문의 수범자가 아니고,
  바뀐 것은 감독기관의 이름뿐이다. **수범자도 아니고 내용도 안 바뀐 이중의 「영향 없음」**이다.

  같은 공포번호(제21066호)로 정보통신망법의 여러 조문이 함께 바뀌었고, 그중 사내 어휘와
  가장 세게 겹치는 것이 case-027(제22조의2 접근권한)이다. 두 건을 함께 넣은 이유는
  **같은 타법개정 안에서도 걸리는 세기가 다르다**는 것을 보기 위해서다.
