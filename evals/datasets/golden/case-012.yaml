  before: 'TODO(verify): 개정 전 텍스트 미확인. 아래 evidence·notes 참조'
  after: |
    제42조의5(전송 요구의 방법 등)
    ② 본인대상정보전송자는 정보주체가 법 제38조제1항에 따른 대리인을 통해 본인대상정보전송자에게
    본인전송요구를 하는 경우로서 대리인이 제42조의6제3항제1호나목에 따라 사전에 협의한 방식으로
    개인정보를 전송하도록 본인전송요구를 하는 경우 정당한 사유 없이 거절해서는 안 된다.
    <신설 2026.2.19>
    ⑥ … 이 경우 본인대상정보전송자, 제3자대상정보전송자, 개인정보관리 전문기관 및 일반수신자는
    전송 요구 변경 및 철회의 방법ㆍ절차가 전송 요구 당시의 방법ㆍ절차보다 어렵지 않도록 해야
    한다. <개정 2026.2.19>

    제42조의6(개인정보 전송의 기한 및 방법 등)
    ③ 정보전송자는 전송의 안전성 및 신뢰성이 보장될 수 있도록 다음 각 호의 구분에 따른 방식으로
    개인정보를 전송해야 한다. <개정 2026.2.19>
      1. 본인대상정보전송자: 다음 각 목의 요건을 모두 충족하는 방식
        가. 정보 전송 시 안전한 암호 알고리즘으로 암호화하여 전송하는 방식일 것
        나. 정보주체가 법 제38조제1항에 따라 본인전송요구를 하게 한 대리인이 자동화된 도구를
            이용하는 경우에는 개인정보의 안전성 확보를 위하여 본인대상정보전송자와 해당 대리인이
            사전에 협의한 방식일 것
  summary: |
    대리인이 사전 협의된 방식으로 본인전송요구를 하는 경우 정당한 사유 없이 거절할 수 없게
    됐고(제42조의5②), 전송 방식 요건에 대리인의 자동화 도구 사용 시 사전 협의 방식 요건이
    추가됐다(제42조의6③제1호 나목). 전송 요구의 변경·철회 절차를 요구 당시보다 어렵게
    만들 수 없다는 제한이 명시됐다.
