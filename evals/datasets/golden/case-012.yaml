expected_outcome: IMPACT

expected_impacts:
  - doc_id: ISP-GUIDE-003
    article_spec: 제31조 (정보주체의 권리 보장)
    difficulty: MEDIUM
    content_spec: |
      열람·정정·삭제·처리정지 요구의 접수와 처리 기한을 정한 조항. 전송요구를 한 줄로만
      언급하고 "관련 절차에 따라 처리한다"고 넘긴다. **대리인을 통한 요구의 처리 기준과
      거절 사유는 없다.**
    why: |
      제42조의5②의 거절 금지 의무가 직접 대응한다. 사내 규정이 대리인 경유 요구를
      다루지 않아 거절 판단 기준 자체가 없다.

  - doc_id: ISP-GUIDE-002
    article_spec: 제31조 (암호화 적용 기준)
    difficulty: MEDIUM
    content_spec: |
      저장·전송 시 적용할 암호 알고리즘과 키 길이 기준을 정한 조항. **"안전한 암호
      알고리즘"의 사내 정의와 허용 목록을 담는다.** 대리인이 쓰는 자동화 도구와의
      협의 방식은 다루지 않는다.
    why: |
      제42조의6③제1호 가목의 "안전한 암호 알고리즘"이 이 조항의 허용 목록과 연결되고,
      나목의 "사전에 협의한 방식"은 외부 도구와의 연동 기준을 새로 요구한다.
      **case-009에서 decoy였던 조항이 여기서는 정답이다.**

decoys:
  - doc_id: ISP-GUIDE-002
    article_spec: 제23조 (로그 및 접속기록 관리)
    content_spec: |
      시스템 로그의 수집·전송·보관 절차. "전송"이라는 어휘가 반복되고 전송 구간 보호를
      다룬다.
    why_not: |
      여기서 "전송"은 로그를 수집 서버로 보내는 내부 동작이고, 개정의 "전송"은 정보주체의
      요구에 따라 개인정보를 제3자에게 이전하는 것이다. **같은 낱말의 완전히 다른 용법이며
      이 골든셋에서 가장 표면 유사도가 높은 함정이다.**

  - doc_id: ISP-GUIDE-003
    article_spec: 제22조 (개인정보의 파기)
    content_spec: |
      보유기간 경과 시 파기 절차. 전송요구 철회와 인접 개념으로 오인되기 쉽다.
    why_not: |
      전송 요구의 철회는 전송을 중단하는 것이지 보유 정보를 파기하는 것이 아니다.

expected_departments: [정보보호부, 디지털사업부]
