notes: |
  시행령 개정을 다루는 유일한 케이스다. 시행령은 법률보다 구체적이어서 기술 요건이
  사내 기준(암호 알고리즘 허용 목록 등)과 직접 맞물린다 — 그 연결을 시험한다.

  ISP-GUIDE-002 제31조를 case-009에서는 decoy, 여기서는 정답으로 배치했다.
  ISP-POL-001 제15조(case-004 decoy / case-005 정답)와 같은 구조이며,
  문서-조항 쌍을 외우는 방식을 두 번 막는다.

  before 미확인이 이 케이스의 채점에 미치는 영향: 제42조의5②는 신설이라 무관하고,
  제42조의6③은 "무엇이 추가됐는가"를 `<개정 2026.2.19>` 표기와 나목의 존재로 판정한다.
  개정 전 문구 대조가 필요한 지표에서는 제외한다.
