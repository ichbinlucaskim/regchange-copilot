expected_outcome: IMPACT

expected_impacts:
  - doc_id: ISP-GUIDE-003
    article_spec: 제16조 (가명정보 처리)
    difficulty: MEDIUM
    content_spec: |
      가명정보 처리 시 목적과 가명처리 방법을 문서로 남기고, 재식별 정보가 생성되면 즉시
      중지·파기하며, 추가 정보를 분리 보관하고 접근권한을 별도 관리한다는 조항.
      **결합("정보집합물의 결합")은 다루지 않는다.** 근거 법령으로 개인정보 보호법
      제28조의2 만 인용하고 신용정보법은 인용하지 않는다.
    why: |
      사내에서 가명·결합 계열을 다루는 유일한 조항이다. 개정은 결합 절차의 준수사항을
      일부 면제했는데, 그 면제가 사내의 어느 통제를 풀어도 되는지가 문서에 없다.
      **완화 개정도 반영 대상이다** — 면제 범위를 모르면 하지 않아도 되는 통제를 계속하거나,
      반대로 풀면 안 되는 것을 푼다.

decoys:
  - doc_id: ISP-GUIDE-003
    article_spec: 제13조 (목적 외 이용 제한)
    content_spec: |
      「개인정보 보호법」 제18조에 따라 수집 목적을 벗어난 이용은 사전에 개인정보
      보호책임자의 승인을 받고, 신청서에 목적·항목·기간·법적 근거를 기재한다는 조항.
      "재사용"과 인접한 "목적 외 이용" 어휘를 쓴다.
    why_not: |
      개정문의 "재사용"이 이 조항의 "목적 외 이용"을 끌어당긴다. 그러나 개정이 말하는
      재사용은 **같은 결합 목적으로 동일 정보집합물을 다시 결합하는 것**이고, 목적 외 이용은
      목적 자체가 달라지는 경우다. 방향이 반대다.

  - doc_id: ISP-GUIDE-002
    article_spec: 제43조 (예외 승인)
    content_spec: |
      지침 기준을 준수할 수 없는 경우 사유와 보완 대책을 기재해 예외 승인을 신청하고,
      유효기간은 6개월을 넘지 못한다는 조항. "적용하지 않는다"와 인접한 "예외" 어휘를 쓴다.
    why_not: |
      개정문의 "적용하지 않는다"가 예외 승인 조항을 끌어당긴다. 그러나 이것은 법령이 정한
      **법정 면제**이고 사내 예외 승인은 사내 기준을 못 지킬 때의 절차다. 법정 면제를
      사내 예외 승인 대상으로 다루면 이중으로 통제하게 된다.

expected_departments: [정보보호부]
expected_risk: LOW
notes: |
  **이 확장분에서 근거가 가장 얇은 IMPACT 다.** 두 가지를 함께 적어 둔다.

  (1) 은행이 결합의뢰기관으로서 정보집합물 결합을 실제로 하는지는 개정문으로 확정되지
  않는다. 하지 않는다면 이 케이스의 정답은 「영향 없음」이 되어야 한다.
  (2) 면제 대상 조건이 **금융위원회 고시에 위임**돼 있어 지금은 무엇이 면제되는지 알 수 없다.

  그럼에도 IMPACT 로 둔 이유는 사내 조항이 결합 자체를 다루지 않아 **면제를 반영할 자리가
  없다**는 것이 확인 가능한 사실이기 때문이다. 판정이 갈릴 수 있는 케이스이므로,
  README §4.6 의 경계 판정과 같이 **오답으로 세지 말고 별도로 집계**하고 사람 판정과
  대조한다.
