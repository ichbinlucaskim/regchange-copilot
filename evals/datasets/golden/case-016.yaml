expected_impacts:
  - doc_id: ISP-PROC-002
    article_spec: 제14조 (증거 보전)
    difficulty: MEDIUM
    content_spec: |
      격리한 시스템의 메모리·디스크 이미지를 확보하고 해시값과 함께 접근통제된 저장소에
      보관한다는 조항. 보존기간을 "사고 종료일부터 3년"으로 정하되 "관계 기관의 조사가
      진행 중인 경우에는 그 조사가 끝날 때까지" 보존한다는 단서를 둔다. 법령 인용은 없고
      어휘도 "증거 보전"이지 "자료 보전"이 아니다.
    why: |
      개정 ⑤항의 접속기록 보전 명령이 직접 대응한다. 사내 조항은 보전의 방아쇠를
      "관계 기관의 조사가 진행 중"으로 잡는데, 개정은 조사 이전 단계인 "발생 여부 확인"에도
      보전 명령을 낼 수 있게 했다. 명령이 오는 시점이 사내 조항이 상정한 시점보다 앞선다.

  - doc_id: ISP-PROC-002
    article_spec: 제16조 (사고 원인 분석 및 보고)
    difficulty: MEDIUM
    content_spec: |
      분석 담당자가 사고 종료일부터 15일 이내에 원인 분석 보고서를 작성한다는 조항.
      보고서에 침입 경로·피해 범위·대응 경과·확인된 취약점을 포함한다. 전제가 "사고가
      종료됐다"이며, 사고 여부가 확정되지 않은 단계는 다루지 않는다.
    why: |
      개정 ①항이 원인 분석 의무의 착수 시점을 "발생하면"에서 "발생 의심 정황"으로 앞당겼다.
      사내 절차는 사고 확정 이후만 규정하므로, 사고로 확정되지 않은 정황 단계에서 분석·기록
      의무가 생긴 것을 담을 곳이 없다.

  - doc_id: ISP-PROC-001
    article_spec: 제18조 (접속기록의 보관)
    difficulty: MEDIUM
    content_spec: |
      정보시스템의 접속기록을 2년간 보관한다는 조항. 접속기록에 접속 계정·일시·접속지
      정보·수행 업무를 포함하고, 위조·변조되지 않도록 별도 저장소에 보관한다.
      보관기간 경과 후의 처리는 정하지 않는다.
    why: |
      보전 명령의 대상이 "정보통신망의 접속기록 등"으로 명시돼 있다. 사내 보관기간(2년)이
      지나 삭제된 접속기록은 명령이 와도 낼 수 없으므로, 보전 명령과 보관기간의 정합성을
      검토해야 한다. 이 조항은 case-001 에서는 함정이었다 — 같은 문단이 개정에 따라
      정답도 되고 함정도 된다.

decoys:
  - doc_id: ISP-PROC-001
    article_spec: 제19조 (접속기록 점검)
    content_spec: |
      권한 관리자가 월 1회 접속기록을 점검하여 업무시간 외 접속·장기 미사용 계정 접속·
      대량 조회 여부를 확인한다는 조항. "접속기록"이라는 어휘를 그대로 쓴다.
    why_not: |
      같은 "접속기록" 어휘를 쓰지만 이 조항이 정하는 것은 정기 점검 주기이며, 개정이 건드린
      것은 감독당국의 보전 명령 근거다. 점검과 보전은 다른 행위다.

  - doc_id: ISP-GUIDE-002
    article_spec: 제26조 (침입탐지)
    content_spec: |
      침입탐지·차단 설비를 운영하고 24시간 감시 체계를 유지하며, 중요도가 높은 탐지
      이벤트를 즉시 통보한다는 조항. "탐지", "이상 징후" 어휘를 쓴다.
    why_not: |
      "의심할 만한 정황"이라는 개정 문구가 탐지 조항을 끌어당긴다. 그러나 개정이 정한 것은
      정황이 있을 때 **원인 분석과 자료 보전 의무가 발생한다**는 것이고, 이 조항은 탐지 설비의
      운영 기준이다. 정황을 만들어 내는 쪽과 정황 이후의 의무는 다른 층이다.

expected_departments: [정보보호부]
expected_risk: HIGH
notes: |
  expected_risk 를 HIGH 로 둔 근거: 자료 제출이 "요구"에서 "명"으로 바뀌어 불응 시
  제48조의7(이행강제금)이 붙는다. 같은 개정에서 신설된 조항이므로 개정문 안에서 확인된다.

  이 케이스는 **경계가 시간축에 있다.** 사내 절차서는 "사고 확인 → 격리 → 증거 보전"의
  순서를 전제하는데, 개정은 사고로 확인되기 **전** 단계에 의무를 걸었다. 어휘는 거의 겹치지
  않으므로(법령 "자료 보전" ↔ 사내 "증거 보전") 어휘 유사도만으로는 잡히지 않는다.
