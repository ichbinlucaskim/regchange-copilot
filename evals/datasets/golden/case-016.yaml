# 침해사고 "발생"에서 "발생 의심 정황"으로 조사 착수 요건이 넓어지고, 접속기록 보전 명령의
# 근거가 확대됐다. 사내 절차서는 "사고를 확인한" 뒤에만 작동한다 — 그 간극이 정답이다.
