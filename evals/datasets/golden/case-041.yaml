notes: |
  **정답을 가르는 것은 어휘가 아니라 수범자다.** "정보보호 수준", "개인정보", "평가/점검"이
  모두 겹치는데 은행은 공공기관이 아니므로 적용되지 않는다.

  case-015(전자금융거래법, 소관 법령이나 개정 부분 무관)와 같은 유형이지만 사유가 한
  겹 다르다. 015 는 **조문의 주제**가 정보보호가 아니었고, 041 은 **주제는 개인정보인데
  수범자가 은행이 아니다.** 두 건을 함께 두어 EMPTY_PART_UNRELATED 가 한 가지 사유로
  좁혀지지 않게 했다.
