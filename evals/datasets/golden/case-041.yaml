expected_outcome: INSUFFICIENT_EVIDENCE
suggested_action: |
  **이관 후 종결.** 개정된 두 조문은 모두 공공기관에 적용되는 규정이며 은행은 공공기관이
  아니다. 다만 은행이 지방자치단체 출자·출연기관과 개인정보 처리를 위탁·수탁하는 관계가
  있다면 상대방의 지위가 바뀌므로, 위탁 계약 상대방 목록을 확인한 뒤 종결한다.
  그 목록은 이 코퍼스에 없다.

decoys:
  - doc_id: ISP-GUIDE-002
    article_spec: 제38조 (정보보호 수준 자체점검)
    content_spec: |
      정보보호부장이 반기 1회 이상 은행의 정보보호 수준을 자체점검하고, 항목별 이행 여부를
      확인하며, 결과를 20일 이내에 정보보호 최고책임자에게 보고하고 미흡 항목을 개선과제로
      등록한다는 조항.
    why_not: |
      **"정보보호 수준"과 "개인정보 보호수준 평가"는 낱말 하나 차이다.** 제도의 이름이
      거의 같아 표면 유사도가 최고인 자리다. 그러나 개정의 보호수준 평가는 보호위원회가
      **공공기관을 대상으로** 실시하는 법정 평가이고, 사내 조항은 은행의 자체점검이다.
      평가 주체·대상·근거가 모두 다르다.

  - doc_id: ISP-GUIDE-003
    article_spec: 제34조 (자체 점검)
    content_spec: |
      개인정보 보호책임자가 반기 1회 이상 지침 이행 여부를 자체 점검하고, 안전성 확보조치와
      파기 이행 여부를 포함하며, 결과를 20일 이내에 대표이사에게 보고한다는 조항.
    why_not: |
      위와 같은 이유로 걸린다. "개인정보"와 "점검"이 함께 있어 개정 조문의 제목과 두 낱말이
      겹친다. 그러나 이 조항도 은행 내부 점검이며 공공기관 평가 제도와 무관하다.

  - doc_id: ISP-GUIDE-002
    article_spec: 제16조 (협력업체 관리)
    content_spec: |
      협력업체에 대한 연 1회 이상 정보보호 수준 점검, 시정 요구와 30일 내 확인, 계약서
      포함 사항을 정하는 조항. "정보보호 수준"이라는 표현을 다시 쓴다.
    why_not: |
      "정보보호 수준"이 세 번째로 겹치는 자리다. 개정이 공공기관의 범위를 넓혔으므로
      협력업체 중 공공기관이 있으면 관련이 있어 보이지만, 개정은 그 기관이 **평가를 받는
      지위**를 정할 뿐 은행의 점검 의무를 바꾸지 않는다.

expected_departments: []
