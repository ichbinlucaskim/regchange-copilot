# EMPTY 2/3 — 감시 대상 법령의 대규모 개정인데 규율 영역 자체가 우리 문서 밖이다.
id: case-014
title: 불법정보ㆍ허위조작정보 유통 규제와 분쟁조정 제도 신설 — 규율 영역이 다름

