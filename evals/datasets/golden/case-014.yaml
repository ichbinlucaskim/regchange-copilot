    제44조의7(불법정보 및 허위조작정보의 유통금지 등), 제44조의10(손해배상),
    제64조의5, 제66조(비밀유지 등), 제70조ㆍ제73조(벌칙), 제76조(과태료)
  summary: |
    정보통신망을 통해 유통되는 불법정보·허위조작정보에 대한 신고·조치 체계, 자율적 운영정책
    수립·공표, 투명성센터, 분쟁조정부와 조정 절차, 유통에 대한 과징금 제도가 신설됐다.
    조문 26건 중 16건이 본조신설이며 이 12개월 구간에서 정보통신망법 최대 규모 개정이다.
