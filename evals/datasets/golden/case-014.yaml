    신설된 조문의 제목만 옮긴다 (본문은 스냅샷 참조).

    제44조의11(가중 손해배상 청구 남용에 대한 특칙)
    제44조의12(불법정보와 허위조작정보의 신고와 조치, 자율적인 운영정책 등)
