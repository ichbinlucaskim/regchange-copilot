expected_risk: LOW
notes: |
  **EMPTY 2/3 — "영역 자체가 무관하다".**

  case-013과 EMPTY인 이유가 다르다. case-013은 우리에게 걸리는 새 의무가 있는데 담을
  조항이 없는 경우이고, 이 케이스는 **애초에 우리 정보보호 규정이 다루는 영역이 아니다.**
  그래서 suggested_action도 다르다 — case-013은 신설 검토, 여기는 이관 후 종결이다.
  두 EMPTY를 같은 출력으로 처리하면 담당자가 잘못된 작업을 하게 된다.

  이 케이스가 어려운 이유: **감시 대상 법령의 최대 규모 개정이고(조문 26건, 신설 16건)
  사내 문서 여러 곳이 같은 법률을 인용하고 있다.** 규모와 법령명 일치가 동시에 압력으로
  작용하므로, "큰 개정이니 무언가 영향이 있을 것"이라는 방향으로 답을 만들어내기 쉽다.
  기획서 4.4절의 손실함수상 여기서 답을 만드는 것이 놓치는 것보다 비싸다.

  expected_risk LOW: 우리 규정 체계에 대한 위험이 없다는 뜻이며, 은행 전체에 대한
  위험 판단이 아니다. 그 판단은 이관받는 부서가 한다.

  2-B 지시: 다섯 문서 어디에도 불법정보·허위조작정보 유통 관리, 게시물 모니터링,
  콘텐츠 신고 처리, 분쟁조정 대응에 관한 조항을 두지 않는다. 이 공백은 자연스럽다 —
  은행의 정보보호 규정이 플랫폼 콘텐츠 규제를 다루지 않는 것은 정상이다.
