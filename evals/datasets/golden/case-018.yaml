# 정보보호 관리체계 인증에 "차등적용" 근거가 생겼다. 규모·파급력이 큰 자에게는 인증기준과
# 절차를 강화해 적용할 수 있다. 사내 지침은 "인증을 취득하고 갱신한다"만 정한다.
