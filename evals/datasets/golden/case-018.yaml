expected_outcome: IMPACT

expected_impacts:
  - doc_id: ISP-GUIDE-002
    article_spec: 제19조 (정보보호 관리체계 인증)
    difficulty: EASY
    content_spec: |
      「정보통신망 이용촉진 및 정보보호 등에 관한 법률」 제47조에 따라 정보보호 관리체계
      인증을 취득하고 유효기간 내에 갱신한다는 조항. 머리에 명시적 법령 인용이 있고,
      "인증 취득 대상 여부는 은행이 주요정보통신서비스 제공자에 해당하는 경우를 기준으로
      판단한다"는 판단 기준을 둔다. 인증기준의 수준이 달라질 수 있다는 언급은 없다.
    why: |
      법령 인용(제47조)이 명시돼 있고 개정 조문이 그 제47조의 인증기준·절차를 대상으로 한다.
      사내 조항은 대상 여부만 판단하고 **적용되는 기준의 수준**은 다루지 않으므로,
      강화 적용 대상이 되는지와 그때 무엇이 달라지는지를 담을 자리가 없다.

  - doc_id: ISP-GUIDE-002
    article_spec: 제20조 (인증 사후관리)
    difficulty: MEDIUM
    content_spec: |
      인증 취득 후 매년 1회 사후심사를 받고, 심사자료를 인증기관이 정한 기한까지 제출하며,
      지적사항을 60일 이내에 조치한다는 조항. 심사 주기와 조치 기한이 수치로 고정돼 있다.
    why: |
      "인증기준 및 절차 등을 강화하여 적용"의 절차에는 사후심사 주기와 제출 기한이 포함된다.
      사내 조항이 주기를 수치로 고정해 두었으므로, 강화 적용을 받으면 그 수치가 맞지 않게
      된다. 개정문에 수치가 없으므로 수치 매칭으로는 잡히지 않는다.

  - doc_id: ISP-POL-001
    article_spec: 제15조 (인증 및 외부평가)
    difficulty: MEDIUM
    content_spec: |
      정보보호 수준을 객관적으로 검증하기 위하여 필요한 인증을 취득하고 유지한다는 정책
      최상위 한 문장. 어떤 인증인지, 기준이 무엇인지는 지침에 위임한다.
    why: |
      "필요한 인증"의 범위와 수준이 바뀌는 개정이므로 정책 계층의 검토 대상이다. 이 조항은
      case-005 에서는 정답, case-004 에서는 함정이었다 — 세 번째 등장이며 다시 정답이다.

decoys:
  - doc_id: ISP-GUIDE-002
    article_spec: 제21조 (인증 범위의 변경)
    content_spec: |
      인증 범위에 포함된 정보시스템 목록을 정보보호부장이 관리하고, 범위에 속하는 시스템을
      신설·폐기할 때 사전에 통보한다는 조항. "인증"과 "범위"를 함께 쓴다.
    why_not: |
      "범위"라는 같은 단어를 쓰지만 축이 다르다. 이 조항의 범위는 **어느 시스템이 인증
      대상인가**이고, 개정이 정한 것은 **누구에게 어느 수준의 기준을 적용하는가**다.
      case-019(시행령 제49조, 인증 대상자의 범위)와 함께 보면 세 가지 "범위"가 구별된다.

  - doc_id: ISP-GUIDE-002
    article_spec: 제38조 (정보보호 수준 자체점검)
    content_spec: |
      반기 1회 이상 정보보호 수준을 자체점검하고 결과를 20일 이내에 보고한다는 조항.
      "정보보호 수준"이라는 어휘를 쓴다.
    why_not: |
      개정문의 "정보의 규모와 사회적 파급력"이 수준 평가 조항을 끌어당긴다. 그러나 이 조항은
      사내 자체점검이고 개정은 외부 인증제도의 적용 강도를 정한다. 점검 주체가 다르다.

expected_departments: [정보보호부]
expected_risk: MEDIUM
notes: |
  expected_risk 를 MEDIUM 으로 둔 근거: 강화 적용 대상이 **대통령령에 위임**돼 있어 시행령이
  나오기 전에는 은행이 대상인지 확정되지 않는다. 대상이면 영향이 크지만 현시점의 조치는
  "대상 여부 확인과 시행령 모니터링"이다. **위임 미확정을 "영향 없음"으로 접지 않는다.**

  이 케이스는 EASY 대상(ISP-GUIDE-002 제19조)을 포함한다. 법령 인용 "제47조"가 사내 조항
  본문에 그대로 있고 개정 조문이 그 제47조를 인용하기 때문이다. 다만 **개정된 조문 번호는
  제47조의7이라 조 번호 문자열 매칭으로는 이어지지 않는다** — 인용의 연결은 조 번호가 아니라
  본문을 읽어야 나온다.
