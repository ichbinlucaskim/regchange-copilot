# 신설 조문 한 개. 정책 계층에만 대응 문단이 있고 지침·절차에는 없다.
id: case-010
title: 사업주 또는 대표자의 최종 책임 조항 신설

source:
  law_id: "011357"
  law_name: 개인정보 보호법
  mst: "283839"
  promulgation_date: "2026-03-10"
  promulgation_no: "21445"
  revision_kind: 일부개정
  effective_date: "2026-09-11"
  article_path: 제30조의3
  change_type: ADDED
  before: null
  after: |
    제30조의3(사업주 또는 대표자의 책임) 개인정보처리자의 사업주 또는 대표자는 개인정보의
    안전한 처리 및 정보주체의 권리 보호에 대한 최종적인 책임자로서 개인정보 보호에 필요한
    전문 인력과 충분한 예산의 지원 등 총괄적인 관리 조치를 실효성 있게 하여야 한다.
  summary: |
    개인정보 보호의 최종 책임 주체가 사업주 또는 대표자임을 명문화하고, 그 책임의 내용으로
    전문 인력과 예산 지원을 포함한 총괄적 관리 조치를 실효성 있게 할 것을 규정했다.
  evidence:
    after_snapshot: law/MST-283839
    note: 본조신설이므로 before가 없는 것이 정상이다.

expected_outcome: IMPACT

expected_impacts:
  - doc_id: ISP-POL-001
    article_spec: 제5조 (경영진의 책임)
    difficulty: MEDIUM
    content_spec: |
      "경영진은 정보보호 및 개인정보 보호의 중요성을 인식하고 필요한 자원을 지원한다"는
      선언적 조항. **"지원한다"까지만 쓰고 책임의 귀속 주체를 특정하지 않으며**
      "최종 책임"이라는 표현도, 인력·예산을 명시한 부분도 없다. 법령 인용 없음.
    why: |
      신설 조문이 요구하는 "최종적인 책임자"의 지정과 그 책임 내용(전문 인력·예산 지원)이
      이 선언 조항에 대응한다. 정책 계층이라 어휘가 추상적이고("경영진" / "사업주 또는
      대표자") 인용도 없어 매칭이 어렵다.

  - doc_id: ISP-GUIDE-003
    article_spec: 제5조 (개인정보 보호책임자의 지정)
    difficulty: MEDIUM
    content_spec: |
      case-007에서도 쓰이는 조항. 개인정보 보호책임자를 임원 중에서 지정하고 대표이사
      승인을 받는다고 규정한다. **대표자 자신의 책임에 관한 규정은 없다.**
    why: |
      법령이 책임을 보호책임자가 아니라 사업주·대표자에게 최종적으로 귀속시켰으므로,
      책임 배분을 다루는 이 조항에 상위 책임 규정을 추가할 필요가 생긴다.
      case-007과 같은 조항이 다른 개정에도 걸리는 자리다.

decoys:
  - doc_id: ISP-GUIDE-002
    article_spec: 제11조 (정보보호 예산 편성)
    content_spec: |
      정보보호 예산을 IT 예산의 일정 비율 이상으로 편성한다는 조항.
      "예산"이라는 어휘가 신설 조문과 그대로 겹친다.
    why_not: |
      신설 조문은 **개인정보 보호**를 위한 예산 지원 책임을 대표자에게 귀속시킨 것이고,
      이 조항은 **정보보호** 예산의 규모 기준이다. 근거 법령도 대상도 다르다.
      case-002에서도 같은 조항이 경계선상 decoy로 쓰인다 — 반복 등장하는 함정이다.

  - doc_id: ISP-POL-001
    article_spec: 제18조 (위반 시 조치)
    content_spec: |
      정책 위반 시 인사 조치와 책임 추궁 절차를 정한 조항. "책임"이라는 어휘가 반복된다.
    why_not: |
      "책임"이 임직원 위반에 대한 사후 제재를 뜻하며, 신설 조문의 "최종적인 책임자"는
      사전적·조직적 책임 귀속이다. 같은 낱말의 다른 용법이다.

expected_departments: [정보보호부, 경영지원부]
expected_risk: MEDIUM
notes: |
  expected_risk MEDIUM: 새로운 절차나 대외 제출 의무가 아니라 책임 귀속의 명문화다.
  다만 인력·예산 지원이 대표자 책임으로 규정되면 정보보호 예산 편성 근거가 정책 문서에
  반영돼야 하고, 그것은 경영지원부와의 협의를 요한다.

  이 케이스는 **정책 계층 전용 매칭**을 시험한다. 지침·절차에는 대응 문단이 사실상 없고
  정책 문서(ISP-POL-001)에만 있다. 구체적 절차 문서에서 매칭이 잘 되는 구현이
  추상 계층에서도 동작하는지 확인하는 자리다.

  case-007의 ④ 제3호("사업주 또는 대표자 및 이사회에 대한 보고")와 짝을 이룬다.
  한쪽은 보고 의무, 한쪽은 책임 귀속이며 같은 개정에서 함께 나왔다.
