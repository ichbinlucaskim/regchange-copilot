decoys:
  - doc_id: ISP-GUIDE-002
    article_spec: 제19조 (정보보호 관리체계 인증)
    content_spec: |
      「정보통신망 이용촉진 및 정보보호 등에 관한 법률」 제47조에 따라 정보보호 관리체계
      인증을 취득하고 갱신한다는 조항. 명시적 법령 인용이 있고 "정보보호 관리체계 인증"이라는
      문자열이 그대로 있다.
    why_not: |
      **삭제된 제6호·제7호에 "정보보호 관리체계 인증"이라는 문자열이 그대로 들어 있어**
      개정 전 텍스트와 문자 유사도가 매우 높다. 그러나 삭제된 것은 **감독기관이 그 지정기준을
      정기적으로 재검토할 의무**이고, 인증제도 자체도 은행의 인증 취득 의무도 그대로다.
      이 조항은 case-018·case-019 에서 정답이었으므로 특히 걸리기 쉽다.

  - doc_id: ISP-GUIDE-002
    article_spec: 제42조 (문서 관리)
    content_spec: |
      지침의 제·개정 이력 기록, 연 1회 이상 검토, 폐지 문서 5년 보존을 정하는 조항.
      "검토"와 주기가 함께 나온다.
    why_not: |
      개정 조문이 "3년마다 타당성을 검토"라고 하여 주기적 검토 조항을 끌어당긴다. 그러나
      개정의 검토 주체는 과학기술정보통신부장관이고 대상은 시행령 규정 자체다.
      은행의 문서 검토와는 주체·대상이 모두 다르다.

  - doc_id: ISP-POL-001
    article_spec: 제17조 (정책의 검토 및 개정)
    content_spec: |
      정보보호부장이 연 1회 이상 정책을 검토하고, 법령이 개정되면 정기 검토 시기와 관계없이
      개정 필요성을 검토하며, 개정은 정보보호 최고책임자의 승인으로 확정한다는 조항.
    why_not: |
      "법령이 개정되거나 … 개정 필요성을 검토한다"는 문장이 있어 **개정 사실 자체를 다루는
      조항**으로 보인다. 그러나 이 조항은 어떤 개정에도 걸리는 절차 규정이므로 매번 정답으로
      세면 정밀도가 무너진다. 개정이 실제로 바꾼 내용과의 접점이 있어야 정답이다.

