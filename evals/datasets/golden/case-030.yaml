notes: |
  **이 케이스는 삭제를 다룬다.** 조문에서 문자열이 사라졌고, 사라진 문자열이 사내 문서의
  핵심 어휘("정보보호 관리체계 인증")와 정확히 같다. 개정 전후 텍스트를 유사도로 비교하면
  가장 크게 움직인 자리이므로 **변경 크기로 중요도를 재는 구현이 정면으로 걸린다.**

  실제로는 규제 재검토 대상 목록의 정리이며, 은행에 걸리는 의무는 하나도 바뀌지 않았다.
  같은 시행령의 직전 개정(case-019, 인증 대상자 범위)이 IMPACT 였던 것과 대조된다 —
  **같은 법령, 인접한 시점, 겹치는 어휘, 갈리는 정답.**
