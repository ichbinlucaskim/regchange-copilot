decoys:
  - doc_id: ISP-GUIDE-002
    article_spec: 제12조 (정보보호 교육 및 훈련)
    content_spec: |
      부서장이 소속 임직원에게 연 1회 2시간 이상 교육을 이수시키고, 신규 입사자는 1개월
      이내에, 개발·운영 담당자는 연 2회 이상 기술 교육을 이수하며, 이수 현황을 3년간
      보존한다는 조항.
    why_not: |
      조 번호가 같을 뿐이다. 개정 조문은 승인 심사기준의 고시 주체를 정하고 이 조항은
      교육 이수 기준이다. 접점이 없다. **다만 B-1 이 잡는 것은 이 조항이 아니라**
      ISP-PROC-002 제20조(사고 사례 관리)이며, 그 본문이 "「정보보호 관리지침」
      (ISP-GUIDE-002) 제12조에 따른 교육 자료"라고 이 조항을 **인용**하기 때문이다.
      인용된 조가 아니라 인용한 문단이 걸린다.

  - doc_id: ISP-PROC-001
    article_spec: 제7조 (권한 부여 기준)
    content_spec: |
      권한 관리자가 직무별 권한 부여 기준표에 따라 권한을 설정하고, 기준표는 관리 부서장이
      작성해 정보보호부장이 확인하며, 기준표에 없는 권한은 예외 승인을 받는다는 조항.
      "기준"과 "승인"이 함께 나온다.
    why_not: |
      "심사기준", "승인"이라는 어휘가 겹친다. 그러나 개정의 승인은 **감독기관이 사업자에게
      주는 승인**이고 사내의 승인은 권한 부여 결재다.

  - doc_id: ISP-PROC-001
    article_spec: 제24조 (외부 심사 대응)
    content_spec: |
      외부 심사 통보 시 5영업일 이내 담당자 지정, 요구 자료 목록 확인, 심사 개시 3영업일
      전 제출, 현장 방문 시 배석자 배정을 정하는 조항. "심사"가 제목에 있다.
    why_not: |
      "심사"라는 어휘가 제목에서 겹친다. 그러나 개정 조문이 말하는 심사는 본인확인업무
      승인 심사이고, 은행은 그 심사의 대상이 아니다.

