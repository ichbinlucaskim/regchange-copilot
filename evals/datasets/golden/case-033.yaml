notes: |
  **작성 시점에는 이 케이스가 B-1 이 가장 많이 걸리는 자리일 것으로 봤다** — 조 번호
  "제12조"가 사내 다섯 문서 전부에 있기 때문이다. 실측은 2건이었다. B-1 은 조 번호를
  문단 본문에서 찾으므로 **그 번호를 가진 조가 아니라 그 번호를 인용한 문단**이 걸린다.
  예측이 틀린 경위는 case-031 의 `notes` 에 네 건을 묶어 적었다.

  걸린 2건(ISP-PROC-001#6, ISP-PROC-002#20)은 둘 다 사내 상호참조이며 정답은 0건이므로,
  이 케이스는 B-1 의 정밀도를 깎는다. 031(4건)·034(1건)과 비교하면 **걸린 건수는 다르고
  정답은 모두 같다.** 걸린 건수가 판정 난이도를 예측하는지는 §6-3 의 `b1_match_kind`별
  집계에서 본다.
