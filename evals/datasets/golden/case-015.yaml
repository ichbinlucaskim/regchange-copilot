      `efYd` 소급 조회(MST=280277, efYd=20261216)가 `LAW_MESSAGE`로 실패했다
      (`law-api-spec.md` §3.2). 다만 이 케이스의 정답은 개정 전후 문구 대조가 아니라
      **개정 범위가 정보보호 의무를 포함하지 않는다**는 사실에 근거하며, 그 사실은
      개정 조문 15건의 조문 제목 전수로 확정된다(위 목록, 캐시 기준).

expected_outcome: INSUFFICIENT_EVIDENCE

expected_impacts: []

suggested_action: |
  사내 정보보호 규정 체계에는 대응 조항이 없다. 전자금융업 자금 보호(선불충전금 별도관리,
  정산자금 외부관리)는 전자금융 사업부서와 재무부의 소관이며 정보보호부 소관 규정의
  개정 사유가 아니다. **이관 대상으로 보고하고 종결한다.**

  참고 사실로 함께 보고할 것: 이 개정은 전자금융거래법 제21조(안전성의 확보의무)와
  제21조의2(정보보호최고책임자 지정)를 건드리지 않았다. 정보보호부 관점에서 이 법률의
  12개월 개정 실적은 **정보보호 의무 변경 0건**이다.

decoys:
  - doc_id: ISP-POL-001
    article_spec: 제2조 (적용범위)
    content_spec: |
      정책의 적용 대상을 정하며 「전자금융거래법」을 근거 법령으로 명시적으로 나열한다.
      문서 머리의 `parent_laws` 메타데이터에도 전자금융거래법이 들어 있다.
    why_not: |
      **전자금융거래법을 인용하는 사내 최상위 조항이므로 법령명 경로로 반드시 끌려온다.**
      그러나 근거 법령으로 나열돼 있다는 것과 이번 개정 내용이 이 정책에 영향을 준다는 것은
      다르다. 개정된 조문은 자금 보호이고 이 정책이 다루는 것은 정보보호다.

  - doc_id: ISP-GUIDE-002
    article_spec: 제23조 (로그 및 접속기록 관리)
    content_spec: |
      로그를 원본과 분리된 별도 저장소에 보관하고 임의 삭제·변조를 방지한다는 조항.
      "별도 보관", "분리", "임의로 사용할 수 없다"는 취지의 표현을 쓴다.
    why_not: |
      **"별도관리", "다른 목적으로 사용하여서는 아니 된다"와 표현이 거의 겹친다.**
      그러나 개정문의 별도관리는 이용자 자금을 신탁·예치로 격리하는 것이고, 이 조항은
      로그 데이터를 별도 저장소에 두는 것이다. 이 골든셋에서 문자 유사도가 가장 높은
      함정이며, 임베딩 검색이 특히 취약할 자리다.

  - doc_id: ISP-PROC-001
    article_spec: 제9조 (계정 발급 및 회수)
    content_spec: |
      계정 발급 시 승인 절차와 퇴직·전보 시 회수 절차. "허가", "등록", "취소"라는
      어휘를 절차 맥락에서 쓴다.
    why_not: |
      개정 조문에 제28조(허가와 등록), 제43조(허가와 등록의 취소)가 포함돼 어휘가
      겹치지만, 그것은 전자금융업 영위 자격이고 이 조항은 시스템 계정이다.

expected_departments: []
expected_risk: LOW
notes: |
  **EMPTY 3/3 — "우리 소관 법령이지만 개정 부분이 정보보호 의무가 아니다".**

  세 EMPTY가 각각 다른 이유로 EMPTY다.

  | 케이스 | 법령 | 왜 EMPTY인가 | suggested_action |
  |---|---|---|---|
  | case-013 | 신용정보법 | 새 의무가 우리에게 걸리는데 담을 조항이 없다 | 신규 조항 신설 검토 |
  | case-014 | 정보통신망법 | 규율 영역이 우리 문서 밖이다 | 이관 후 종결 |
  | case-015 | 전자금융거래법 | 우리 소관 법령이나 개정 부분이 정보보호가 아니다 | 이관 후 종결 |

  case-015가 특히 중요한 이유: **전자금융거래법은 은행 정보보호부가 가장 강하게 소관을
  주장하는 법률이다.** ISP-POL-001의 근거 법령이고 감시 대상 코퍼스의 중심이다.
  그런데 12개월 실적상 이 법률의 유일한 자체 개정이 정보보호와 무관했다. 법령 단위 소관
  판단으로 영향을 결정하면 이 케이스에서 반드시 틀린다 — **소관은 법령 단위가 아니라
  조문 단위로 판정되어야 한다.**

  2-B 지시: 다섯 문서 어디에도 선불충전금·정산자금·이용자 자금 별도관리·신탁·예치에
  관한 조항을 두지 않는다. ISP-POL-001 제2조의 근거 법령 목록에는 전자금융거래법을
  반드시 포함시킨다 — 그 포함이 이 케이스의 함정을 성립시킨다.
