# EMPTY 3/3 — 우리 소관 법령의 실질 개정인데 정보보호 의무가 아니라 자금 보호 의무다.
id: case-015
title: 선불충전금ㆍ정산대상금액 보호 제도 정비 — 정보보호 의무가 아님

