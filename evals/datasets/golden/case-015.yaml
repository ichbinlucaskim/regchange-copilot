  change_type: MODIFIED
  before: 'TODO(verify): 개정 전 텍스트 미확인. 아래 evidence·notes 참조'
  after: |
    제25조의2(선불충전금의 보호)
    ① 선불업자는 선불충전금의 100분의 50 이상에 해당하는 금액으로서 대통령령으로 정하는
    금액을 선불충전금관리기관을 통하여 신탁ㆍ예치ㆍ지급보증보험 중 하나의 방법으로 관리(이하
    "별도관리")하고, 선불전자지급수단을 이용한 전자지급거래 외의 다른 목적으로 사용하여서는
    아니 된다. <개정 2025.12.16>
    ⑤ 누구든지 제1항에 따라 별도관리하는 선불충전금을 상계 또는 압류하여서는 아니 된다.
    ⑦ 선불충전금관리기관은 선불업자가 허가·등록 취소, 해산 결의, 파산선고 등에 해당하게 된
    경우 별도관리하는 선불충전금을 이용자의 청구에 따라 우선하여 지급하여야 한다.

    제36조의3(전자지급결제대행업자의 행위규칙)
    ① 전자지급결제대행업자는 전자지급결제대행 계약에서 정한 기한 내에 수수한 대가를
    정산하여 지급하여야 한다. …

    제42조의2(이용자 등의 보호)
    ① 금융위원회는 선불업자가 제25조의2에 따른 선불충전금 별도관리의 기준을 충족하지 못하거나
    전자지급결제대행업자가 제25조의4에 따른 정산대상금액 외부관리의 기준을 충족하지 못하는 등
    이용자 등의 이익을 크게 해칠 우려가 있다고 인정되는 때에는 … 시정을 명하거나 … 요구할 수
    있다.
    ② 전자금융업자는 이용자 등을 보호하기 위하여 필요한 사항으로서 대통령령으로 정하는 사항을
    금융위원회가 정하는 바에 따라 공시하여야 한다.

    함께 개정된 조문: 제2조(정의), 제3조(적용범위), 제25조의4(정산대상금액의 보호),
    제25조의5(정산대상금액 보호조치의 고지의무), 제28조ㆍ제30조ㆍ제32조ㆍ제33조의3(허가·등록·자본금),
    제42조(회계처리 구분 및 건전경영지도), 제43조(허가와 등록의 취소 등),
    제49조(벌칙), 제51조(과태료)
  summary: |
    선불충전금 별도관리(신탁·예치·지급보증보험) 기준, 정산대상금액 외부관리, 보호조치
    고지의무, 전자지급결제대행업자의 정산 기한 준수 의무, 이용자 보호를 위한 시정명령과
    공시 의무가 정비·신설됐다. **개정 15개 조문 중 정보보호 의무를 다룬 것은 하나도 없다.**
  evidence:
    after_snapshot: tests/fixtures/law_api/law_010199_mst280277.xml
    before_snapshot: null
