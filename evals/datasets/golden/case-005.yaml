# 신설 조문 두 개. 사내에 "비슷하지만 다른" 기구와 활동이 이미 있어 부분 대응이 된다.
id: case-005
title: 정보보호위원회 설치 의무와 정보보호수준 평가 제도 신설

source:
  law_id: "000030"
  law_name: 정보통신망 이용촉진 및 정보보호 등에 관한 법률
  mst: "285199"
  promulgation_date: "2026-03-31"
  promulgation_no: "21500"
  revision_kind: 일부개정
  effective_date: "2026-10-01"
  article_path: 제45조의4, 제45조의5
  change_type: ADDED
  before: null
  after: |
    제45조의4(정보보호위원회)
    ① 자산총액, 매출액 등이 대통령령으로 정하는 기준에 해당하는 정보통신서비스 제공자는
    정보보호에 관한 사항을 심의하기 위하여 정보보호위원회(이하 "정보보호위원회"라 한다)를
    설치ㆍ운영하여야 한다.
    ② 정보보호위원회의 위원장은 정보보호 최고책임자가 된다.
    ③ 그 밖에 정보보호위원회의 구성 및 운영 등에 필요한 사항은 대통령령으로 정한다.

    제45조의5(정보보호수준 평가)
    ① 과학기술정보통신부장관은 제45조제1항 각 호의 어느 하나에 해당하는 자 중 사업의 종류,
    매출액 규모, 이용자의 수 등이 대통령령으로 정하는 기준에 해당하는 자(이하 "대상자"라
    한다)에 대하여 매년 이 법에 따른 의무의 준수 여부 등 정보통신망의 안정성 및 정보의
    신뢰성 수준을 평가(이하 "정보보호수준 평가"라 한다)하여야 한다.
    ② 과학기술정보통신부장관은 정보보호수준 평가의 결과를 인터넷 홈페이지 등을 통하여
    공개할 수 있다.
    ③ 과학기술정보통신부장관은 정보보호수준 평가에 필요한 경우 대상자에게 관련 자료의
    제출을 요구할 수 있다.
    ④ 과학기술정보통신부장관은 정보보호수준 평가 결과 정보보호수준이 미흡하거나 개선이
    필요하다고 인정되는 대상자에 대하여 정보보호를 위하여 필요하다고 인정하면 개선을 권고할
    수 있다. 이 경우 권고를 받은 대상자는 이를 이행하기 위하여 성실하게 노력하여야 하며,
    그 조치 결과를 과학기술정보통신부장관에게 제출하여야 한다.
    ⑤ 그 밖에 제1항부터 제3항까지에 따른 평가 기준ㆍ방법ㆍ절차, 자료제출의 범위 및 평가
    결과의 공개 등에 필요한 사항은 대통령령으로 정한다.
  summary: |
    정보보호 최고책임자를 위원장으로 하는 정보보호위원회 설치·운영이 의무화되고,
    과기정통부장관이 매년 실시하는 정보보호수준 평가와 그 결과 공개·개선권고·조치결과
    제출 제도가 신설됐다.
  evidence:
    after_snapshot: law/MST-285199
    note: 본조신설이므로 before가 없는 것이 정상이다.

expected_outcome: IMPACT

expected_impacts:
  - doc_id: ISP-GUIDE-002
    article_spec: 제8조 (정보보호협의회의 구성 및 운영)
    difficulty: MEDIUM
    content_spec: |
      정보보호 관련 사항을 협의하는 사내 기구를 규정한다. **이름을 "정보보호협의회"로 쓰고**
      위원장을 "정보보호부장"으로 정한다. 분기 1회 개최하며, 심의가 아니라 "협의·조정"
      기구로 성격을 규정한다. 법령 인용 없음.
    why: |
      제45조의4가 요구하는 "정보보호위원회"에 대응하는 사내 기구가 이미 있으나 세 가지가
      어긋난다 — 명칭(위원회/협의회), 위원장(정보보호 최고책임자/정보보호부장),
      성격(심의/협의). 어휘가 다르고 부분적으로만 일치하는 전형적 MEDIUM이다.

  - doc_id: ISP-GUIDE-002
    article_spec: 제38조 (정보보호 수준 자체점검)
    difficulty: MEDIUM
    content_spec: |
      반기 1회 자체적으로 정보보호 수준을 점검하고 결과를 정보보호 최고책임자에게 보고한다는
      조항. **대외 제출·공개에 관한 내용은 없다.** "자체점검"이라는 어휘를 쓴다.
    why: |
      제45조의5의 "정보보호수준 평가"와 대상이 같으나 주체가 다르다(사내 자체 / 감독기관).
      결과 공개와 조치결과 제출 의무가 신설돼 기존 자체점검 절차와 연결이 필요하다.

  - doc_id: ISP-POL-001
    article_spec: 제8조 (정보보호 조직)
    difficulty: MEDIUM
    content_spec: |
      "은행은 정보보호 업무를 수행하는 전담 조직을 두고, 필요한 경우 관련 부서가 참여하는
      협의체를 운영할 수 있다"는 조항. **"운영할 수 있다"는 임의 규정**이다.
    why: |
      법령이 설치를 의무화했으므로 임의 규정("할 수 있다")을 의무 규정으로 바꾸는 개정이
      필요하다. 정책 계층이라 어휘가 추상적이다.

  - doc_id: ISP-POL-001
    article_spec: 제15조 (인증 및 외부평가)
    difficulty: MEDIUM
    content_spec: |
      case-004에서 decoy로 쓰인 바로 그 조항 — "필요한 인증을 취득하고 유지한다"는 선언.
    why: |
      정보보호수준 평가는 신청이 아니라 감독기관이 실시하는 평가이며, "외부평가"라는
      이 조항의 제목 범위에 새로 들어온다. case-004에서는 개정 내용이 인증 절차라 이
      추상 조항에 걸릴 것이 없었지만, 여기서는 평가 제도 자체가 신설돼 근거 조항이 필요하다.

decoys:
  - doc_id: ISP-PROC-001
    article_spec: 제14조 (권한 검토 주기)
    content_spec: |
      접근권한 적정성을 반기 1회 검토한다는 조항. "반기 1회"라는 주기 표현이
      ISP-GUIDE-002 제38조와 같다.
    why_not: |
      주기 표현이 겹칠 뿐 정보보호 수준 평가와 무관한 접근권한 검토다.
      주기 어휘로 매칭하면 걸린다.

expected_departments: [정보보호부]
expected_risk: MEDIUM
notes: |
  이 케이스의 요점은 **"부분적으로 이미 있다"**는 상태를 정확히 보고하는가이다.
  정보보호협의회가 있으니 영향 없음으로 보면 틀리고, 아무것도 없다고 보아
  INSUFFICIENT_EVIDENCE로 보내도 틀린다. 있는 것과 요구되는 것의 차이를 짚어야 한다.

  EMPTY 시나리오(case-013~015)와의 경계를 시험하는 자리이기도 하다. 신설 조문이라고
  해서 자동으로 EMPTY가 아니다 — 대응 문단이 있으면 IMPACT다.
