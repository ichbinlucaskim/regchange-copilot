expected_outcome: IMPACT

expected_impacts:
  - doc_id: ISP-GUIDE-002
    article_spec: 제19조 (정보보호 관리체계 인증)
    difficulty: EASY
    content_spec: |
      "「정보통신망 이용촉진 및 정보보호 등에 관한 법률」 제47조에 따라 정보보호 관리체계
      인증을 취득하고 유효기간 내에 갱신한다"는 조항. 인증 대상 여부의 판단 기준을
      "주요정보통신서비스 제공자에 해당하는 경우"라고만 쓴다.
    why: |
      법령 인용이 명시적이고 어휘가 일치한다. ②의 대상 기준 재편이 이 조항의 판단 기준
      문구에 직접 걸린다.

  - doc_id: ISP-GUIDE-002
    article_spec: 제20조 (인증 사후관리)
    difficulty: MEDIUM
    content_spec: |
      "인증 취득 후 매년 1회 사후심사를 받으며, 심사자료는 서면으로 제출한다"는 조항.
      **서면 제출만** 규정하고 현장심사 수검 절차는 없다. 법령 인용 없음.
    why: |
      ⑧의 "현장심사와 서면심사의 방법을 병행"이 직접 대응한다. 사내 규정이 서면만
      상정하고 있어 결손이 드러난다. "사후심사"와 "사후관리"라는 어휘 차이가 있다.

  - doc_id: ISP-PROC-001
    article_spec: 제24조 (외부 심사 대응)
    difficulty: MEDIUM
    content_spec: |
      감독당국·인증기관의 외부 심사 시 자료 제출과 담당자 배정 절차. "심사원의 현장
      방문 시"라는 표현을 쓰되 정보보호 관리체계 인증을 명시하지 않고 "외부 심사"로
      통칭한다.
    why: |
      현장심사가 의무화되면 이 절차서의 현장 수검 절차가 실제로 적용된다.
      "인증"이라는 어휘가 없어 매칭이 어렵다.

decoys:
  - doc_id: ISP-POL-001
    article_spec: 제15조 (인증 및 외부평가)
    content_spec: |
      "은행은 정보보호 수준을 객관적으로 검증하기 위해 필요한 인증을 취득하고 유지한다"는
      한 문장짜리 선언. 어떤 인증인지 특정하지 않는다.
    why_not: |
      "인증"이라는 어휘가 겹치지만 대상을 특정하지 않은 선언적 조항이라 개정으로 고칠
      내용이 없다. 정책 계층의 추상 조항을 모두 끌어오면 기안 대상이 무의미하게 늘어난다.
      **다만 case-005에서는 같은 조항이 정답 쪽에 있다** — 조항이 아니라 개정 내용이
      영향을 결정한다는 것을 시험한다.

  - doc_id: ISP-GUIDE-003
    article_spec: 제17조 (개인정보의 안전성 확보조치)
    content_spec: |
      개인정보 처리시스템의 관리적·기술적·물리적 안전조치를 열거한 조항.
      "관리적ㆍ기술적ㆍ물리적"이라는 법령과 동일한 3분류 어휘를 쓴다.
    why_not: |
      제47조 제1항·제4항에도 "관리적ㆍ기술적ㆍ물리적 보호조치"라는 같은 표현이 나오지만,
      이 개정은 그 부분을 건드리지 않았다. 개정되지 않은 항의 어휘로 매칭하면 걸린다.

expected_departments: [정보보호부, IT운영부]
expected_risk: MEDIUM
notes: |
  HARD 시나리오(3개 문서). expected_risk를 MEDIUM으로 둔 근거: 인증 취득 자체는 이미
  하고 있고 바뀐 것은 대상 판단 기준·심사 방법·취소 사유이므로, 신규 의무 발생이 아니라
  기존 절차의 정비다. 다만 ⑩ 제4호(관계 법령 중대 위반 시 취소)는 인증 상실 위험을
  다른 법령 준수 상태와 연결하므로 낮게 볼 수 없다.

  ISP-POL-001 제15조를 여기서는 decoy, case-005에서는 정답으로 배치했다. 같은 조항이
  개정 내용에 따라 갈리는 구조를 일부러 만들었다 — 문서-조항 단위로 답을 외우는 방식이
  통하지 않게 한다.
