decoys:
  - doc_id: ISP-PROC-001
    article_spec: 제19조 (접속기록 점검)
    content_spec: |
      권한 관리자가 월 1회 접속기록을 점검하여 업무시간 외 접속·장기 미사용 계정 접속·
      대량 조회 여부를 확인하고 결과를 제출한다는 조항. 조 번호가 개정 조문과 같다.
    why_not: |
      조 번호가 같고 ISP-GUIDE-003 제19조도 같은 제목이라 **같은 조 번호가 두 문서에서
      같은 주제를 다루는 드문 자리**다. 사람이 조 번호로 훑으면 "두 문서가 함께 걸렸으니
      근거가 세다"고 읽기 쉽다. 그러나 개정 조문은 국내대리인 지정 대상자의 범위이며
      접속기록과 무관하고, **B-1 도 이 조항을 잡지 않는다**(실측).

  - doc_id: ISP-GUIDE-002
    article_spec: 제19조 (정보보호 관리체계 인증)
    content_spec: |
      제47조에 따른 인증 취득·갱신과 "인증 취득 대상 여부는 은행이 주요정보통신서비스
      제공자에 해당하는 경우를 기준으로 판단한다"는 대상 판단 기준을 두는 조항.
    why_not: |
      **"대상자의 범위"라는 제목과 "대상 여부를 판단한다"는 본문이 개념적으로 겹친다.**
      개정 조문도 매출액·이용자 수로 대상을 정하고 사내 조항도 대상 여부를 판단한다.
      그러나 하나는 국내대리인 지정 대상이고 하나는 인증 취득 대상이다. 이 조항은
      case-018·019 에서 정답이었으므로 특히 걸리기 쉽다.

  - doc_id: ISP-GUIDE-003
    article_spec: 제19조 (접속기록 점검)
    content_spec: |
      정보보호부장이 개인정보 처리시스템의 접속기록을 월 1회 이상 점검하고, 다운로드 급증·
      업무시간 외 접속·대량 조회를 확인하며, 이상 시 ISP-PROC-001 에 따라 조치한다는 조항.
    why_not: |
      위와 같이 조 번호가 같다. 두 문서가 같은 조 번호에서 같은 주제를 다루므로 사람의
      눈에는 근거가 두 배로 보인다. **B-1 은 둘 다 잡지 않는다** — 실측에서 걸린 유일한
      자리는 ISP-PROC-002 제20조이며, 그 본문의 "제19조의 훈련"이라는 사내 상호참조
      때문이다.

