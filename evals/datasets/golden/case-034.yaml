notes: |
  국내대리인 제도는 **국내에 주소·영업소가 없는 정보통신서비스 제공자**를 위한 것이므로
  국내 은행은 수범자가 아니다. 개정 내용도 고시 주체의 명칭뿐이다.

  031~034 네 건은 **같은 개정, 같은 정답, 다른 걸림 수**(실측 4 / 2 / 2 / 1)다.
  034 가 가장 적게 걸린다 — 사내 문서에서 "제19조"를 **인용한** 문단이 하나뿐이기
  때문이다. 조 번호 "제19조"를 **가진** 조는 네 곳인데도 그렇다.

  그런데 034 는 사람의 눈으로는 가장 그럴듯한 케이스다. 조 번호가 같은 조가 넷이고
  그중 둘이 같은 제목("접속기록 점검")이며, 조문 제목의 "대상자의 범위"도 사내
  ISP-GUIDE-002 제19조의 "대상 여부를 판단한다"와 닮았다.
  **B-1 이 가장 적게 잡는 자리가 사람에게는 가장 그럴듯하다** — 문자열 베이스라인과
  의미 검색이 서로 다른 곳에서 틀린다는 뜻이며, §6-3 의 B-1 대조가 볼 지점이다.
