notes: |
  case-003과 함께 (가) 시나리오를 이룬다. 공포번호 제21445호 하나가 세 법령을 건드렸고
  시행일이 셋 다 2026-09-11이다.

  | 법령 | 구분 | 조문 | 정답 |
  |---|---|---|---|
  | 개인정보 보호법 | 일부개정 | 19개 조문 | IMPACT (case-007 등) |
  | 정보통신망법 | 타법개정 | 제45조의3 1개 | NO_IMPACT (case-003) |
  | 신용정보법 | 타법개정 | 제20조 1개 | NO_IMPACT (case-011) |

  셋을 같은 날 함께 입력하면 "같은 공포번호이니 같은 취급"이라는 지름길이 통하지 않는다.
  `제개정구분명`이 유일한 구분 근거이며 `변경사유`로는 갈리지 않는다
  (`docs/domain-selection/amendment-frequency.md` D-3 — 타법개정 조문도 `조문변경`으로 온다).

  **before가 미확인인 채로 남는 유일한 NO_IMPACT 케이스다.** 채점 시 before를 근거로 쓰는
  지표에서는 이 케이스를 제외하고, `제개정구분명` 기반 판정만 채점한다.
  before를 확보하면 이 notes와 `source.before`를 갱신한다.
