decoys:
  - doc_id: ISP-GUIDE-003
    article_spec: 제12조 (개인정보 처리 기록의 보존)
    content_spec: |
      개인정보 처리 기록을 3년간 보존한다는 조항. **「신용정보의 이용 및 보호에 관한 법률」
      제20조를 명시적으로 인용한다.**
    why_not: |
      **조문 경로가 정확히 일치하고 명시적 인용까지 걸려 있는데도 영향이 없다.**
      제20조 제2항(기록 3년 보존)은 이번 개정 대상이 아니며, 바뀐 것은 제4항의 인용 표기다.
      조문 단위로만 보면 반드시 걸리고, 항 단위로 보아야 걸리지 않는다.

  - doc_id: ISP-GUIDE-003
    article_spec: 제6조 (개인정보 보호책임자의 업무)
    content_spec: |
      case-007의 EASY 정답 조항. 「개인정보 보호법」 제31조를 인용해 업무를 열거한다.
    why_not: |
      개정문에 "「개인정보 보호법」 제31조제4항"이라는 문자열이 등장하므로 그 문자열로
      검색하면 걸린다. 그러나 이 개정은 신용정보법이 개인정보 보호법을 인용하는 표기를
      고친 것이고, 개인정보 보호법 제31조 자체의 변화는 case-007이 다룬다.
      **case-003과 같은 구조의 함정이며, 두 케이스가 같은 방식으로 틀리는지 확인한다.**

