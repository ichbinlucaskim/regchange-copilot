  before: 'TODO(verify): 개정 전 텍스트 미확인. 아래 evidence·notes 참조'
  after: |
    ④ 제3항에 따른 신용정보관리ㆍ보호인은 다음 각 호의 업무를 수행한다.
    <신설 2015.3.11, 2020.2.4, 2023.3.14, 2026.3.10>
      1. 개인신용정보의 경우에는 다음 각 목의 업무
        가. 「개인정보 보호법」 제31조제4항제1호 및 같은 항 제4호부터 제7호까지에 따른 업무
        나. 임직원 및 전속 모집인 등의 신용정보보호 관련 법령 및 규정 준수 여부 점검
        다. 그 밖에 신용정보의 관리 및 보호를 위하여 대통령령으로 정하는 업무
  summary: |
    신용정보관리·보호인의 업무를 정의하면서 인용하는 「개인정보 보호법」 제31조의 항·호
    번호가 갱신됐다. 같은 날 같은 공포번호(제21445호)로 개인정보 보호법 제31조에 제3항이
    신설되어 이후 항 번호가 밀린 데 따른 것이다(case-007). 신용정보법이 부과하는 의무의
    내용은 바뀌지 않았다.
  evidence:
    after_snapshot: law/MST-283841
    before_snapshot: null
    unverified: |
      **개정 전 텍스트를 확보하지 못했다.** `efYd` 소급 조회(MST=285955, efYd=20260812)가
      `LAW_MESSAGE`("일치하는 법령이 없습니다")로 실패했고, 이전 버전의 MST를 얻는 경로가
      아직 확인되지 않았다 (`docs/api-exploration/law-api-spec.md` §3.2 · §8,
      실패 기록: `data/golden-sources-collection.json`).

      확인된 사실은 두 가지다. (1) 제20조 ④의 `<신설 …>` 표기에 `2026.3.10`이 붙어 있어
      이번 공포로 이 항이 변경됐다. (2) 현행 텍스트가 「개인정보 보호법」 제31조**제4항**을
      인용하는데, 그 제4항은 case-007의 개정으로 **이번에 새로 생긴 번호**다(개정 전에는
      같은 내용이 제3항이었다). 따라서 개정 전 인용이 제31조제3항이었다고 **추정**되나
      원문 대조 전까지 확정하지 않는다.

