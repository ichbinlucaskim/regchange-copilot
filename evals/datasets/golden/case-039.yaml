expected_outcome: INSUFFICIENT_EVIDENCE
suggested_action: |
  **별표 1 확인 후 재판정.** 두 요건 중 이용자 수 요건은 은행이 충족할 개연성이 높으나,
  서비스 요건은 별표 1에 무엇이 열거돼 있는지를 봐야 판정할 수 있다. 별표는 이 시스템의
  분석 대상이 아니므로(ADR-004) **여기서 판정을 만들지 않는다.**

  담당자에게 넘기는 것은 두 가지다.
  1. 별표 1 원문 확인 — 은행이 제공하는 서비스가 열거돼 있는가
  2. 해당한다면, 대규모 정보통신서비스 제공자에게 걸리는 의무(법 제44조의11 이하)를 담을
     사내 조항이 없으므로 **신규 조항 신설 검토**가 필요하다

decoys:
  - doc_id: ISP-GUIDE-002
    article_spec: 제19조 (정보보호 관리체계 인증)
    content_spec: |
      제47조에 따른 인증 취득·갱신 조항. 제2항이 "인증 취득 대상 여부는 은행이
      주요정보통신서비스 제공자에 해당하는 경우를 기준으로 판단한다"는 대상 판단 기준을 둔다.
    why_not: |
      **"…제공자에 해당하는 경우를 기준으로 판단한다"는 문장이 개정 조문과 같은 형태다.**
      사내 코퍼스에서 "정보통신서비스 제공자"라는 법령 어휘가 나오는 유일한 자리이기도 하다.
      그러나 개정이 정의한 것은 **대규모 정보통신서비스 제공자**이고 사내 조항이 판단하는
      것은 **주요정보통신서비스 제공자**다. 두 지위는 근거 조문도 딸려 오는 의무도 다르다.

  - doc_id: ISP-GUIDE-002
    article_spec: 제3조 (용어의 정의)
    content_spec: |
      "정보자산", "중요정보", "정보보호 담당 조직"을 정의하고 정하지 않은 용어는 정책과
      법령에 따른다는 조항. 개정 조문과 마찬가지로 정의 조항이다.
    why_not: |
      정의 조항끼리의 형태 유사다. 이 조항이 정의하는 것은 사내 자산 등급 체계이고 개정이
      정의한 것은 법령상 사업자 지위다.

  - doc_id: ISP-GUIDE-002
    article_spec: 제41조 (정보보호 공시)
    content_spec: |
      은행이 정보보호 공시 대상에 해당하는 경우 공시 자료를 기한까지 제출하고, 수치는 예산
      집행 실적과 전담 인력 현황을 근거로 한다는 조항. "대상에 해당하는 경우"라는 조건부
      구조를 쓴다.
    why_not: |
      "대상에 해당하는 경우"라는 조건부 문형이 겹치고, 정보보호 공시도 규모 기준으로 대상이
      정해지는 제도라 개념적으로 가깝다. 그러나 근거 법령이 다르고 개정은 공시를 건드리지
      않았다.

expected_departments: []
expected_risk: MEDIUM
notes: |
  **이 케이스는 ADR-004(별표를 억지로 분석하지 않는다)를 정면으로 시험한다.**

  적용 여부가 **별표 1 하나에 걸려 있고**, 그 별표를 우리는 분석하지 않는다. 여기서
  모델이 할 수 있는 잘못은 두 가지다.
  - "은행은 정보통신서비스 제공자가 아니므로 영향 없음" — 근거 없이 단정한 것이다
  - "이용자 100만 명 이상이므로 해당함, IMPACT" — 요건의 절반만 보고 단정한 것이다

  옳은 답은 **"별표를 봐야 알 수 있다"를 그대로 말하는 것**이다. expected_risk 를 MEDIUM 으로
  둔 것은 해당할 경우의 영향이 작지 않기 때문이며, LOW 로 낮추면 "확인할 필요 없음"으로
  읽힌다.

  013 과 같은 EMPTY_NEW_PROVISION 이지만 사유의 층이 다르다. 013 은 **의무가 걸리는 것이
  확실한데 담을 조항이 없어서**이고, 039 는 **의무가 걸리는지 자체가 미확정**이다.
  두 건을 함께 두어 "신규 조항 신설 검토"가 나오는 조건을 좁힌다.
