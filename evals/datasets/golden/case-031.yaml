decoys:
  - doc_id: ISP-GUIDE-002
    article_spec: 제34조 (변경관리)
    content_spec: |
      정보시스템의 변경을 변경관리 대장에 등록하고 승인 후 시행하며, 정보보호 관련 사항이
      포함되면 정보보호부장의 검토를 거치고, 긴급 변경은 5영업일 이내에 사후 등록한다는 조항.
    why_not: |
      조 번호가 같다는 것 외에 아무 관련이 없다. **다만 B-1 이 걸린 자리는 이 조항이
      아니다** — 실측에서 걸린 것은 ISP-GUIDE-002 제25조(방화벽 정책)이며, 그 본문의
      "제34조에 따른 변경관리 절차"라는 **사내 상호참조** 때문이다. 조 번호가 같은 조와
      조 번호를 인용한 문단은 다르며, B-1 이 찾는 것은 후자다.

  - doc_id: ISP-GUIDE-003
    article_spec: 제34조 (자체 점검)
    content_spec: |
      개인정보 보호책임자가 반기 1회 이상 지침 이행 여부를 자체 점검하고, 안전성 확보조치와
      파기 이행 여부를 포함하며, 결과를 20일 이내에 대표이사에게 보고한다는 조항.
    why_not: |
      위와 같다. 이쪽도 B-1 이 걸린 자리는 이 조항이 아니라 ISP-GUIDE-003 제35조
      (개선조치)의 "제34조의 점검에서 미흡으로 판정된 항목"이다. 개정 조문이 다루는
      불법정보 처리제한명령 요청과는 주체·대상·행위가 모두 다르다.

  - doc_id: ISP-PROC-002
    article_spec: 제9조 (감독당국 보고 창구)
    content_spec: |
      감독당국에 대한 보고 창구를 정보보호부로 일원화하고, 직접 문의를 받은 부서는 답변 전에
      대외 담당자에게 통보하며, 보고 문서 사본을 사고 기록부에 첨부한다는 조항.
    why_not: |
      "관계 중앙행정기관", "요청", "서면"이라는 어휘가 감독당국 대응 조항을 끌어당긴다.
      그러나 개정 조문은 **행정기관 사이의 요청 절차**이고 은행은 그 절차의 당사자가 아니다.

