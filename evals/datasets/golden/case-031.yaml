notes: |
  **이 케이스군(031~034)의 목적은 B-1 베이스라인의 오탐 성격을 재는 것이다.**
  `docs/16-baseline-comparison.md` 는 B-1 이 재현율은 높고 정밀도가 낮다는 것을 실측했고
  (decoy 11건), 그 오탐이 어떤 성격인지는 케이스가 `b1_match_kind` 로 기록한다.

  네 건 모두 같은 개정(기관명 치환)이고 정답도 같지만 **B-1 이 걸린 건수가 다르다** —
  실측으로 031=4, 032=2, 033=2, 034=1 이다.

  **작성 시점의 예측이 틀렸고, 그 사실을 지우지 않는다.** 처음에는 "조 번호가 같은 사내
  조가 몇 개인가"로 예측해 031=2·032=5·033=5·034=4 를 적었다. B-1 은 조 번호를
  **문단 본문에서** 찾으므로 걸리는 것은 그 번호를 가진 조가 아니라 그 번호를
  **인용한** 문단이다. 예측과 실측이 정반대 방향으로 어긋났다 — 가장 적을 것으로 본
  031 이 가장 많다.

  이 케이스에서 걸린 4건은 성격이 둘로 갈린다.
  - 사내 상호참조 2건 — ISP-GUIDE-002#25("제34조에 따른 변경관리"),
    ISP-GUIDE-003#35("제34조의 점검")
  - **다른 법령 인용 2건** — ISP-GUIDE-003#26·ISP-PROC-002#11 의
    "「개인정보 보호법」 제34조제3항·제1항". 개정된 것은 정보통신망법 시행령 제34조다.

  둘 다 `INTERNAL_REFERENCE` 로 적었다. 후자를 `OTHER_LAW_CITATION` 으로 세면
  **B-1 이 정답을 맞힌 경우와 구별되지 않기 때문**이며, 그 근거는
  `tests/unit/test_golden_dataset.py` 의 `VALID_B1_MATCH_KINDS` docstring 에 있다.
