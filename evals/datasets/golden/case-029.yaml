decoys:
  - doc_id: ISP-GUIDE-002
    article_spec: 제24조 (네트워크 분리)
    content_spec: |
      「전자금융거래법」 제21조에 따른 안전성 확보를 위하여 내부 업무망과 인터넷망을
      분리한다는 조항. 사내 코퍼스에서 전자금융거래법을 조 단위로 인용하는 자리 중 하나다.
    why_not: |
      **원천이 전자금융거래법 계열이라는 이유만으로 이 조항이 끌려온다.** ISP-POL-001 이
      전자금융거래법을 근거 법령으로 명시하고 있어 소관 주장이 가장 강한 자리다.
      그러나 개정된 조문은 선불충전금의 우선지급 절차이고 망분리와 무관하다.
      **소관은 법령 단위가 아니라 조문 단위로 판정한다** — case-015 가 세운 기준이다.

  - doc_id: ISP-GUIDE-003
    article_spec: 제32조 (처리방침의 공개)
    content_spec: |
      개인정보 처리방침을 홈페이지 첫 화면에서 확인할 수 있도록 공개하고, 변경 시 시행일
      7일 전까지 공지하며, 이전 처리방침을 열람할 수 있도록 유지한다는 조항.
      "홈페이지", "공개", "공지" 어휘가 개정문의 "홈페이지에 게시"와 겹친다.
    why_not: |
      "인터넷 홈페이지에 게시"라는 표현이 정면으로 겹친다. 그러나 개정문의 게시는 선불업자가
      **채권소멸 사유 발생을 이용자에게 알리는** 공고이고, 이 조항은 개인정보 처리방침의
      공개다. 게시한다는 행위가 같을 뿐 대상이 다르다.

  - doc_id: ISP-GUIDE-002
    article_spec: 제23조 (로그 및 접속기록 관리)
    content_spec: |
      로그를 별도 저장소에 보관하고 정보보호 점검 외의 목적으로 사용하지 않는다는 조항.
      "별도 저장소 보관, 임의 사용 금지"라는 표현을 쓴다.
    why_not: |
      선불충전금의 **별도관리** 어휘와 문자 유사도가 높다 — README §4.5 가 case-015 에 심어
      둔 함정과 같은 자리다. 이 개정은 별도관리 조항 자체를 건드리지 않았고 인용 법률만
      바꿨으므로 그때보다도 근거가 약하다.

