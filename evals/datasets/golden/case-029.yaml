notes: |
  **이 케이스의 함정은 법령 이름에 있다.** 전자금융거래법은 정보보호부가 소관을 가장 강하게
  주장하는 법률이고 ISP-POL-001 의 첫 번째 근거 법령이다. 그런데 개정된 조문은 선불업자의
  채권소멸 공고 절차이며 정보보호와 무관하다.

  case-015(전자금융거래법 본법, INSUFFICIENT_EVIDENCE)와 정답이 다른 이유를 적어 둔다.
  015 는 개정 범위 전체가 정보보호와 무관해 **담당자가 무엇을 해야 할지 판단할 근거가
  없어서** 이관 대상이었다. 029 는 **타법개정으로 인용 문자열만 바뀐 것이 확정적**이므로
  "영향 없음"으로 종결할 수 있다. 「모른다」와 「없다」의 구별이 여기서도 유지된다.
