decoys:
  - doc_id: ISP-PROC-001
    article_spec: 제14조 (권한 검토 주기)
    content_spec: |
      각 부서장이 반기 1회 소속 직원의 접근권한 적정성을 검토하고, 불필요한 권한은 10영업일
      이내에 회수를 신청하며, 검토 결과를 정보보호부장에게 제출한다는 조항.
      "접근권한"과 "검토"가 함께 있다.
    why_not: |
      개정 조문의 "접근권한의 설정이 … 이루어졌는지 여부에 대하여 실태조사"와 이 조항의
      "접근권한의 적정성을 검토"는 문장 구조까지 닮았다. 그러나 개정의 접근권한은
      **이용자 단말의 앱 권한**(정보통신망법 제22조의2)이고 사내의 접근권한은 **정보시스템
      계정 권한**이다. 같은 단어가 다른 것을 가리킨다.

  - doc_id: ISP-POL-001
    article_spec: 제11조 (접근권한 관리 원칙)
    content_spec: |
      접근권한을 직무에 필요한 최소한으로 부여하고, 정기적으로 적정성을 검토하며, 직무 변경·
      종료 시 지체 없이 조정·회수한다는 정책 최상위 조항. 제목이 "접근권한"으로 시작한다.
    why_not: |
      제목이 개정 조문의 핵심 어휘와 정면으로 겹친다. 정책 계층까지 끌어올려 매칭하면
      반드시 걸린다. 그러나 개정은 실태조사 주체의 명칭만 바꿨고 접근권한의 내용은
      건드리지 않았다. **어휘가 겹치는 것과 대상이 겹치는 것은 다르다.**

  - doc_id: ISP-PROC-001
    article_spec: 제23조 (내부 점검)
    content_spec: |
      정보보호부장이 반기 1회 절차서 이행 여부를 점검하고, 신청·승인 이력과 권한 검토
      실시 여부, 계정 회수 이행 여부를 대상으로 하며, 미흡 사항을 개선과제로 등록한다는 조항.
    why_not: |
      "실태조사"가 "점검"을 끌어당긴다. 그러나 개정의 실태조사는 **감독기관이 사업자를**
      조사하는 것이고 이 조항은 은행이 자기 이행을 점검하는 것이다.
      외부 조사 대응은 제24조(외부 심사 대응)에 따로 있으며 그쪽도 개정 대상이 아니다.

