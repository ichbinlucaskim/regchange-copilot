notes: |
  **이 케이스가 case-026 보다 어렵다.** 026 은 "본인확인기관"이라는 어휘가 사내 문서에
  없어 표면 유사도가 낮지만, 027 은 "접근권한"이 사내 코퍼스에서 가장 자주 나오는 어휘다
  (ISP-PROC-001 전체가 접근통제 절차서다). 어휘 밀도가 높은데 정답은 「영향 없음」이다.

  둘을 같은 원천(MST=277377)에서 뽑은 이유가 그것이다. 원천이 같고 개정 성격이 같은데
  검색이 걸리는 세기는 다르다 — 그 차이가 **정밀도가 어휘에 얼마나 끌려다니는가**를 잰다.
