  after: |
    제13조의4(전기통신금융사기 정보의 공유 등) ① 금융회사, 전기통신사업자, 수사기관, 그 밖에
    대통령령으로 정하는 자(이하 "사기정보제공기관"이라 한다)는 전기통신금융사기의 예방 및
    피해 확산 방지를 위하여 전기통신금융사기에 관한 정보로서 다음 각 호의 정보를 전기통신금융사기
    정보공유분석기관(이하 "정보공유분석기관"이라 한다)에 정보주체의 동의를 받지 아니하고
    제공할 수 있다.
    ④ 정보공유분석기관 및 사기정보이용기관은 … 제공받은 정보를 정보주체의 동의를 받지
    아니하고 처리할 수 있다. 이 경우 정보공유분석기관 및 대통령령으로 정하는 사기정보이용기관은
    해당 업무를 수행하기 위하여 불가피한 경우에는 「개인정보 보호법」 제24조에 따른
    고유식별정보(같은 법 제24조의2에 따른 주민등록번호를 포함한다)를 제공받아 처리할 수 있다.
    ⑤ 정보공유분석기관은 전기통신금융사기에 관한 정보의 처리에 관하여 해당 정보가 분실ㆍ도난ㆍ
    유출ㆍ위조ㆍ변조ㆍ훼손되지 아니하고 해당 정보를 처리하는 정보처리시스템에 대한 제3자의
    불법적인 접근 또는 그 밖의 위험에 대하여 안전성을 확보할 수 있도록 대통령령으로 정하는
    바에 따라 기술적ㆍ물리적ㆍ관리적 대책을 수립ㆍ시행하여야 한다.
    ⑥ 사기정보제공기관, 사기정보이용기관 및 정보공유분석기관이 제1항부터 제4항까지에 따라
    정보를 처리하는 경우에는 다음 각 호를 적용하지 아니한다.
    1. 「금융실명거래 및 비밀보장에 관한 법률」 제4조 및 제4조의2
    2. 「신용정보의 이용 및 보호에 관한 법률」 제32조, 제35조 및 제38조
    ⑦ 사기정보제공기관, 사기정보이용기관 및 정보공유분석기관은 제1항부터 제4항까지에 따라
    정보를 처리하는 경우에는 다음 각 호의 사항을 준수하여야 한다.
    1. 해당 정보를 전기통신금융사기를 예방하고 피해 확산을 방지하기 위한 목적 외의 목적으로
    이용하지 아니할 것
    2. 제공받은 정보가 제공받은 날부터 5년의 범위에서 대통령령으로 정하는 기간이 경과한 때에는
    대통령령으로 정하는 바에 따라 해당 정보를 파기 또는 삭제할 것
    3. 정보주체가 대통령령으로 정하는 바에 따라 정보를 제공하거나 제공받은 사실을 조회할 수
    있도록 할 것
  summary: |
    본조신설. 금융회사를 포함한 사기정보제공기관이 정보주체 동의 없이 사기 관련 정보를
    정보공유분석기관에 제공할 수 있게 됐고(①), 제공받은 기관은 동의 없이 처리할 수 있으며
    고유식별정보·주민등록번호까지 처리할 수 있다(④). 금융실명법과 신용정보법의 비밀보장
    규정은 적용되지 않고(⑥), 목적 외 이용 금지·5년 범위 파기·제공사실 조회 제공이
    준수사항으로 붙는다(⑦).
