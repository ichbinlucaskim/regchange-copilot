# 정답 문단이 하나도 없고 함정만 걸리는 유일한 케이스다. 은행이 수범자에 들어가는데도
# 정답이 「모른다」인 이유는, 이 의무를 담는 사내 규정이 이 코퍼스 밖에 있기 때문이다.
