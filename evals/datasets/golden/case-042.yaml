expected_outcome: INSUFFICIENT_EVIDENCE
suggested_action: |
  **이관 후 소관 확인.** 은행은 "금융회사"로서 사기정보제공기관에 해당하므로 이 의무의
  수범자다. 그러나 이 조문이 만드는 것은 **전기통신금융사기 대응을 위한 정보공유 체계**이며,
  ⑥항이 신용정보법 제32조·제35조·제38조의 적용을 배제하므로 사내 개인정보 처리지침의
  제공 조항들이 근거로 서지 못한다. 소관은 금융사기 대응 부서이며 그 규정은 이 코퍼스에
  없다. **⑦항의 준수사항(목적 외 이용 금지·파기·조회 제공)이 사내 어느 규정에 담기는지를
  소관 부서와 함께 확인한 뒤 재판정한다.**

decoys:
  - doc_id: ISP-GUIDE-003
    article_spec: 제29조 (제공 기록 관리)
    content_spec: |
      목적 외 이용과 제3자 제공 내역을 제공 대장에 기록하고, 제공 일시·제공받는 자·제공
      항목·제공 목적·법적 근거를 기재하며, 대장을 제공일부터 5년간 보존한다는 조항.
    why_not: |
      **⑦항 세 호가 이 조항의 세 요소와 하나씩 대응하는 것처럼 읽힌다** — 목적 외 이용
      금지(제1호), 5년(제2호), 제공사실 조회(제3호). 숫자 "5년"까지 같다. 그러나 사내
      조항의 5년은 **대장의 보존기간**이고 개정의 5년은 **제공받은 정보의 파기 기한**이다.
      방향이 반대다(보존 ↔ 파기). 그리고 근거인 신용정보법 조항이 ⑥항에서 배제된다.

  - doc_id: ISP-PROC-001
    article_spec: 제18조 (접속기록의 보관)
    content_spec: |
      정보시스템의 접속기록을 2년간 보관하고, 접속 계정·일시·접속지·수행 업무를 포함하며,
      위조·변조되지 않도록 별도 저장소에 보관하고 접근을 통제한다는 조항.
    why_not: |
      "기록", "보관", "위조ㆍ변조", "접근 통제"가 ⑤항의 안전성 확보 문구와 겹친다.
      그러나 ⑤항의 수범자는 **정보공유분석기관**이지 정보를 제공하는 금융회사가 아니다.
      의무 주체를 잘못 읽으면 은행 조항이 걸린다.

  - doc_id: ISP-GUIDE-003
    article_spec: 제13조 (목적 외 이용 제한)
    content_spec: |
      「개인정보 보호법」 제18조에 따라 수집 목적을 벗어난 이용은 사전에 개인정보 보호책임자의
      승인을 받고, 신청서에 목적·항목·기간·법적 근거를 기재하며, 승인 내역을 제29조에 따라
      기록·관리한다는 조항.
    why_not: |
      ⑦항 제1호("목적 외의 목적으로 이용하지 아니할 것")와 제목이 정면으로 겹친다.
      그러나 사내 조항은 **승인을 받으면 목적 외 이용이 가능하다**는 절차이고, 개정은
      **목적 외 이용을 금지**한다. 승인으로 풀 수 있는 것과 아예 금지된 것은 다르다.

  - doc_id: ISP-GUIDE-003
    article_spec: 제20조 (개인정보 암호화)
    content_spec: |
      암호 알고리즘과 키 길이를 ISP-GUIDE-002 제31조에 위임하고, 고유식별정보와 비밀번호는
      예외 없이 암호화하여 저장한다는 조항.
    why_not: |
      ④항이 "고유식별정보(주민등록번호를 포함한다)"를 명시하므로 고유식별정보 조항이
      끌려온다. 그러나 개정은 그 정보를 **동의 없이 처리할 수 있는 근거**를 만들었을 뿐
      저장 시 암호화 기준을 바꾸지 않았다.

expected_departments: []
expected_risk: MEDIUM
notes: |
  **골든셋에서 DECOY_ONLY 유형은 이 한 건뿐이다.** 유형별 정확도 표에서 이 유형의 칸은
  **n=1 이므로 「판정 불가」로 읽어야 한다** — 맞히면 1.0000, 틀리면 0.0000 이 되는데
  둘 다 아무것도 뜻하지 않는다. 집계할 때 이 칸에는 비율이 아니라 **맞음/틀림과 n=1** 을
  적는다.

  1건뿐인 이유는 재료가 없어서다. "정답 문단은 없는데 그럴듯한 함정은 여럿 걸리는"
  조문을 만들려면 **은행이 수범자이면서 사내 정보보호 규정 밖에 있는 의무**여야 하는데,
  12개월 전수에서 그 조건을 만족한 것이 이 조문뿐이었다.

  expected_risk 를 MEDIUM 으로 둔 것은 은행이 수범자이기 때문이다. LOW 로 낮추면
  "확인할 필요 없음"으로 읽히고, 그것은 틀렸다 — 확인해야 하는데 **우리 문서로는 확인할
  수 없다**는 것이 이 케이스의 정답이다.
