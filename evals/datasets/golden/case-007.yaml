      4. 개인정보 처리 및 보호의 실태와 관행에 대한 정기적인 조사 및 개선
      5. 개인정보 처리와 관련한 불만의 처리 및 피해 구제
      6. 개인정보 유출 및 오용ㆍ남용 방지를 위한 내부통제시스템의 구축
      7. 개인정보 보호 교육 계획의 수립 및 시행
      8. 개인정보파일의 보호 및 관리ㆍ감독
      9. 그 밖에 개인정보의 적절한 처리 및 보호를 위하여 대통령령으로 정한 업무
    ⑤ 개인정보 보호책임자는 제4항 각 호의 업무를 수행함에 있어서 … <개정 2023.3.14, 2026.3.10>
  summary: |
    ③이 신설되어 일정 기준 이상 개인정보처리자는 개인정보 보호책임자의 지정·변경·해제에
    이사회 의결과 보호위원회 신고를 거쳐야 한다. 업무 목록(기존 ③ → ④)에 "전문 인력의
    관리 및 예산의 확보"와 "사업주 또는 대표자 및 이사회에 대한 보고"가 앞순위로 추가되며
    7개에서 9개로 늘고 순서가 재편됐다. 항 신설로 이후 항 번호가 한 칸씩 밀렸다.
