  after: |
    ① 개인정보처리자는 개인정보의 처리 및 보호에 관한 업무를 총괄해서 담당할 개인정보
    보호책임자를 지정하여야 한다. 다만, … <개정 2023.3.14, 2026.3.10>
    ③ 매출액, 개인정보의 보유 규모 등을 고려하여 대통령령으로 정하는 기준에 해당하는
    개인정보처리자는 다음 각 호의 사항을 준수하여야 한다. <신설 2026.3.10>
      1. 개인정보 보호책임자를 지정하거나 그 지정을 변경 또는 해제할 때에는 이사회(법인인
