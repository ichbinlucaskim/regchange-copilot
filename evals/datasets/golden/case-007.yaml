expected_outcome: IMPACT

expected_impacts:
  - doc_id: ISP-GUIDE-003
    article_spec: 제6조 (개인정보 보호책임자의 업무)
    difficulty: EASY
    content_spec: |
      개정 전 법령의 7개 호를 거의 그대로 옮겨 열거하고 "「개인정보 보호법」 제31조제3항에
      따라"라는 명시적 인용을 둔다.
    why: |
      어휘·순서·인용이 모두 일치한다. 추가된 2개 호(인력·예산, 이사회 보고)의 결손과
      **인용 항 번호가 제3항에서 제4항으로 바뀐 것**을 함께 잡아야 한다.

  - doc_id: ISP-GUIDE-003
    article_spec: 제5조 (개인정보 보호책임자의 지정)
    difficulty: MEDIUM
    content_spec: |
      개인정보 보호책임자를 임원 중에서 지정하고 지정 시 대표이사 승인을 받는다는 조항.
      **이사회 의결과 보호위원회 신고에 관한 내용은 없다.** 변경·해제 절차도 없다.
    why: |
      신설된 ③이 직접 대응한다. 사내 절차가 "대표이사 승인"인데 법령은 "이사회 의결"을
      요구하므로 결재선 자체가 바뀐다. 어휘가 부분적으로만 겹친다(승인/의결).

  - doc_id: ISP-POL-001
    article_spec: 제7조 (개인정보 보호책임자)
    difficulty: MEDIUM
    content_spec: |
      "은행은 개인정보 보호에 관한 업무를 총괄하는 책임자를 지정한다"는 한 문장.
      법령 인용 없음.
    why: |
      ①의 "처리에 관한 업무를 총괄해서 책임질" → "처리 및 보호에 관한 업무를 총괄해서
      담당할" 변경이 이 선언 조항의 문구와 맞물린다. 정책 계층이라 매칭이 어렵다.

decoys:
  - doc_id: ISP-GUIDE-002
    article_spec: 제7조 (정보보호 최고책임자의 업무)
    content_spec: |
      case-002의 EASY 정답 조항. 정보보호 최고책임자 업무를 열거한다.
    why_not: |
      두 책임자는 겸직이 가능하고(정보통신망법 제45조의3제4항제2호 라목) 업무 목록의
      형태가 비슷해 혼동되기 쉽다. 그러나 이 개정은 「개인정보 보호법」의 개인정보
      보호책임자를 규율하며 정보보호 최고책임자의 업무를 바꾸지 않았다.
      **case-002와 정확히 반대 방향의 함정이다.**

  - doc_id: ISP-GUIDE-003
    article_spec: 제12조 (개인정보 처리 기록의 보존)
    content_spec: |
      개인정보 처리 기록을 3년간 보존한다는 조항. 「신용정보의 이용 및 보호에 관한 법률」
      제20조를 인용한다.
    why_not: |
      같은 문서 안에 있고 "개인정보"라는 어휘가 겹치지만 근거 법령이 다르며,
      이 개정은 기록 보존을 건드리지 않았다. case-011과 짝지어 보면 이 조항이
      어느 개정에 반응해야 하는지가 드러난다.

expected_departments: [정보보호부, 준법감시부]
expected_risk: HIGH
notes: |
  HARD 시나리오(3개 문서). expected_risk HIGH: 이사회 의결이 새 요건이 되어 결재선을
  바꿔야 하고, 보호위원회 신고라는 대외 절차가 신설됐으며, 시행일(2026-09-11)까지
  이사회 일정과 맞물려 준비 기간이 실질적으로 짧다.

  **이 개정이 case-003과 case-011의 원인이다.** 여기서 제3항이 신설되면서 이후 항 번호가
  밀렸고, 같은 공포번호(제21445호)로 정보통신망법 제45조의3과 신용정보법 제20조의 인용이
  각각 갱신됐다. 세 케이스를 함께 채점하면 "같은 공포 안에서 실질개정과 타법개정을
  갈라내는가"가 측정된다.
