expected_outcome: IMPACT

expected_impacts:
  - doc_id: ISP-PROC-002
    article_spec: 제11조 (개인정보 유출 통지)
    difficulty: EASY
    content_spec: |
      유출 사실을 안 때 정보주체에게 알릴 사항을 개정 전 법령의 5개 호와 거의 같은 문구로
      열거하고 "「개인정보 보호법」 제34조제1항에 따라"라는 명시적 인용을 둔다.
      통지 시점을 "유출 사실이 확인된 때"로 못박는다.
    why: |
      어휘와 인용이 일치하고 열거 항목이 직접 대응한다. 추가된 제6·7호의 결손과,
      "확인된 때"라는 조건이 신설 ②(가능성 단계)와 충돌하는 것을 함께 짚어야 한다.

  - doc_id: ISP-PROC-002
    article_spec: 제8조 (대외 통지)
    difficulty: MEDIUM
    content_spec: |
      case-001에서도 쓰이는 조항. 대외 커뮤니케이션을 "고객 안내"로 부르고 홍보부 협의
      사항으로 둔다. **통지 대상 범위를 "피해가 확인된 고객"으로 한정한다.**
    why: |
      신설 ②는 대상을 "유출등의 가능성이 있는 모든 정보주체"로 넓힌다. 사내 규정이
      대상을 좁게 잡고 있어 정면으로 어긋난다. 어휘가 다르고(정보주체/고객) 조건이
      반대 방향이라 MEDIUM이다.

  - doc_id: ISP-GUIDE-003
    article_spec: 제26조 (개인정보 유출 시 조치)
    difficulty: MEDIUM
    content_spec: |
      유출 발생 시 피해 최소화 대책 수립과 재발방지 조치를 규정한다. **회수·삭제에 관한
      내용은 없고** 신고 근거를 "제34조제3항"으로 인용한다.
    why: |
      ③에 추가된 회수·삭제 조치가 결손이고, 인용한 항 번호(제3항 → 제4항)가 밀렸다.
      항 번호 이동을 반영하지 않으면 인용이 틀린 규정이 된다.

decoys:
  - doc_id: ISP-GUIDE-003
    article_spec: 제22조 (개인정보의 파기)
    content_spec: |
      보유기간이 지난 개인정보를 지체 없이 파기하고 복구할 수 없는 방법으로 삭제한다는
      조항. "삭제", "지체 없이"라는 어휘가 개정문과 겹친다.
    why_not: |
      ③에 추가된 "회수ㆍ삭제"는 유출된 개인정보를 사고 대응 차원에서 거두어들이는
      조치이고, 이 조항은 보유기간 경과에 따른 정기 파기다. 같은 낱말이 전혀 다른
      국면에 쓰인 전형적 함정이다.

  - doc_id: ISP-PROC-001
    article_spec: 제18조 (접속기록의 보관)
    content_spec: |
      접속기록 2년 보관 조항. case-001에서도 decoy로 쓰인다.
    why_not: |
      유출 통지와 무관하다. 개인정보 사고 맥락에서 접속기록이 자주 함께 언급되므로
      끌려오기 쉽지만, 이 개정은 기록 보관을 건드리지 않았다.

expected_departments: [정보보호부, 고객지원부]
expected_risk: HIGH
notes: |
  HARD 시나리오(2개 문서, 3개 조항). expected_risk HIGH: 신설 ②는 "유출이 확인되기 전"에
  통지하라는 의무이므로 기존 절차의 발동 조건 자체를 바꾼다. 사내 규정이 "확인된 때"로
  못박혀 있으면 시행일 이후 그대로 두는 것이 곧 위반이다.

  ISP-PROC-002 제8조는 case-001과 이 케이스 양쪽에서 정답이다. 한 문단이 서로 다른 개정에
  각각 걸리는 상태를 일부러 만들었다 — 실제 규정 문서에서 흔한 일이며, 문단 단위로 한 번만
  매칭하고 끝내는 구현을 걸러낸다.
