    ③ 개인정보처리자는 개인정보의 유출등이 있음을 알게 되었을 때에는 … 지체 없이 제1항 각
    호의 사항을 보호위원회 또는 대통령령으로 정하는 전문기관에 신고하여야 한다. …
    ④ 제1항에 따른 유출등의 통지 및 제3항에 따른 유출등의 신고의 시기, 방법, 절차 등에
    필요한 사항은 대통령령으로 정한다. <개정 2023.3.14>
  after: |
    ① 개인정보처리자는 개인정보가 유출등이 되었음을 알게 되었을 때에는 지체 없이 해당
    정보주체에게 다음 각 호의 사항을 알려야 한다. … <개정 2023.3.14, 2026.3.10>
      3. 유출등으로 인하여 발생할 수 있는 피해를 최소화하기 위하여 정보주체가 할 수 있는
         방법 등에 관한 **구체적인** 정보
      6. 개인정보 유출등으로 인한 제39조에 따른 손해배상과 제39조의2에 따른 법정손해배상의
         청구 및 제43조에 따른 분쟁조정 등 피해를 입은 정보주체의 법적 권리와 그 행사 방법
         등에 관한 정보
      7. 그 밖에 개인정보가 유출등이 된 정보주체의 보호를 위하여 대통령령으로 정하는 사항
    ② 제1항에도 불구하고 개인정보의 유형, 정보주체에게 미치는 영향 및 유출등의 위험 정도를
    고려하여 대통령령으로 정하는 **유출등의 가능성이 있음을 알게 되었을 때**에는 지체 없이
    유출등의 가능성이 있는 **모든 정보주체**에게 피해를 최소화하기 위한 정보 등 대통령령으로
    정하는 사항을 알려야 한다. <신설 2026.3.10>
    ③ 개인정보처리자는 개인정보가 유출등이 된 경우에는 해당 개인정보의 **회수ㆍ삭제 등 피해
    확산을 방지하기 위한 조치를 포함하여** 피해를 최소화하기 위한 대책을 마련하고 필요한
    조치를 하여야 한다. <개정 2023.3.14, 2026.3.10>
    ④ (기존 ③ 신고 의무가 이동)
    ⑤ 제1항ㆍ제2항에 따른 통지 및 제4항에 따른 유출등의 신고의 시기, 방법, 절차 등에 필요한
    사항은 대통령령으로 정한다. <개정 2023.3.14, 2026.3.10>
  summary: |
    통지 항목에 제6호(손해배상·법정손해배상 청구와 분쟁조정 등 법적 권리 및 행사 방법)와
    제7호(위임)가 추가되고 제3호가 "구체적인 정보"로 강화됐다. 유출이 확정되지 않은
    **"유출등의 가능성"** 단계에서 가능성이 있는 모든 정보주체에게 통지할 의무가 ②로
    신설됐다. ③에 회수·삭제 등 피해 확산 방지 조치가 명시됐다. 항 신설로 신고 의무와
    위임 규정이 각각 ④·⑤로 밀렸다.
