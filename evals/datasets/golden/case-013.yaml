# EMPTY 1/3 — 우리 소관 법령의 신설 조문인데 대응하는 사내 조항이 존재하지 않는다.
id: case-013
title: 채무조정기구에 대한 신용정보 제공 특례 신설 — 대응 사내 조항 없음

source:
  law_id: "001540"
  law_name: 신용정보의 이용 및 보호에 관한 법률
  mst: "285955"
  promulgation_date: "2026-05-12"
  promulgation_no: "21646"
  revision_kind: 일부개정
  effective_date: "2026-08-13"
  article_path: 제44조의2, 제44조의3, 제44조의4, 제44조의5
  change_type: ADDED
  before: null
  after: |
    제7장 채무조정기구에 대한 신용정보 등의 제공 특례 <신설 2026.5.12>

    제44조의2(채무조정기구의 지정ㆍ고시) 금융위원회는 다음 각 호의 업무를 수행하기 위하여
    대통령령으로 정하는 요건을 갖춘 법인을 지정하여 고시할 수 있다.
      1. 신용정보주체를 채무자로 하는 채권의 매입
      2. 원리금의 감면 등 채무조정(…)
      3. 매입한 채권의 보전ㆍ추심 또는 소각
      4. 제1호의 신용정보주체에 대한 자산ㆍ소득 등의 재산조사
      5. 매입한 채권에 대한 사후관리 업무

    제44조의3(채무조정기구에 대한 신용정보 등의 제공 특례)
    ① 채무조정기구는 … 관계 중앙행정기관, 지방자치단체, 국민연금공단, 국민건강보험공단,
    **신용정보회사등**, 가상자산사업자, 그 밖에 대통령령으로 정하는 공공단체의 장에게
    다음 각 호의 자료 또는 정보의 제공을 요청할 수 있다. …
      1. 신용정보(제2조제1호나목의 정보에 한정한다)
      2. 「금융실명거래 및 비밀보장에 관한 법률」에 따른 금융거래 정보
      … (제3호~제10호)
    ④ 제1항부터 제3항까지에 따른 채무조정기구의 자료ㆍ정보의 수집ㆍ제공에 대하여는
    제32조제1항부터 제5항까지, 제33조, 제34조 및 제35조를 적용하지 아니한다.

    제44조의4(다른 법률의 적용 배제) 제44조의3에 따라 자료ㆍ정보의 제공을 요청받은
    기관ㆍ단체의 종사자는 다음 각 호의 어느 하나에 해당하는 다른 법률의 규정에도 불구하고
    특별한 사유가 없으면 채무조정기구에 요청받은 자료ㆍ정보를 제공하여야 한다.
      1. 「금융실명거래 및 비밀보장에 관한 법률」 제4조제1항
      2. 「개인정보 보호법」 제18조
      … (제3호~제6호)

    제44조의5(신용정보 등의 제공ㆍ수집에 대한 통지 및 특례)
  summary: |
    금융위원회가 지정·고시하는 채무조정기구가 신용정보회사등을 포함한 기관에 신용정보·
    금융거래정보 등의 제공을 요청할 수 있고, 요청받은 기관은 금융실명법·개인정보 보호법
    제18조 등의 제한에도 불구하고 특별한 사유가 없으면 제공해야 하는 특례가 신설됐다.
  evidence:
    after_snapshot: law/MST-285955
    note: 장 전체가 본조신설이므로 before가 없는 것이 정상이다.

expected_outcome: INSUFFICIENT_EVIDENCE

expected_impacts: []

suggested_action: |
  신규 조항 신설 검토 필요. 채무조정기구의 자료 제공 요청을 접수·검토·회신하는 절차와,
  제공 시 제3자 제공 제한 규정(개인정보 처리지침)의 예외를 어떻게 다룰지 정하는 조항이
  ISP-GUIDE-003에 없다. 신설 대상 문서와 조문 위치는 컴플라이언스 담당자가 정한다.

decoys:
  - doc_id: ISP-GUIDE-003
    article_spec: 제12조 (개인정보 처리 기록의 보존)
    content_spec: |
      개인정보 처리 기록 3년 보존 조항. 「신용정보의 이용 및 보호에 관한 법률」 제20조를
      인용한다. **이 골든셋에서 신용정보법을 인용하는 유일한 사내 조항이다.**
    why_not: |
      법령명이 일치하는 유일한 조항이므로 "신용정보법 개정 → 신용정보법 인용 조항"이라는
      경로로 반드시 끌려온다. 그러나 개정된 것은 제44조의2~5(제7장 신설)이고 이 조항은
      제20조를 인용한다. **법령명 일치만으로 매칭하면 EMPTY가 IMPACT로 뒤집힌다.**

  - doc_id: ISP-GUIDE-003
    article_spec: 제28조 (개인정보의 제3자 제공)
    content_spec: |
      개인정보를 제3자에게 제공할 때의 동의 요건과 예외를 정한 조항.
      「개인정보 보호법」 제17조·제18조를 인용한다.
    why_not: |
      제44조의4가 「개인정보 보호법」 제18조의 적용을 배제하므로 개념적으로 인접하고
      인용 조문까지 겹친다. **가장 그럴듯한 함정이다.** 그러나 이 조항이 규율하는 것은
      우리가 능동적으로 제3자에게 제공하는 경우의 동의 절차이며, 신설 조문은 지정된
      채무조정기구의 요청에 응해야 하는 수동적 의무다. 절차·주체·발동 조건이 모두 다르고,
      이 조항을 고쳐서는 새 의무를 담을 수 없다. **부분적으로 관련 있어 보이는 문단이
      있어도 답을 만들지 않는 것**이 이 케이스의 요점이다.

expected_departments: []
expected_risk: MEDIUM
notes: |
  **EMPTY 1/3 — "신설이라 대응 조항이 없다".**

  이 케이스가 EMPTY인 이유는 소관 부서가 아니어서가 아니다. 신용정보법은
  `config/corpus.yaml`의 감시 대상이고 ISP-GUIDE-003의 대응 법령이다. 우리가 신용정보회사등에
  해당하는 이상 제44조의4의 자료 제공 의무는 우리에게 걸린다. **의무는 새로 생겼는데
  그것을 담을 사내 조항이 아직 없다.** 그래서 정답이 INSUFFICIENT_EVIDENCE이고
  suggested_action이 "신규 조항 신설 검토"다.

  expected_risk를 MEDIUM으로 둔 것은 근거가 없어서가 아니다 — 새 의무가 실재하므로
  LOW가 아니고, 절차 부재가 즉시 위반으로 이어지지는 않으므로 HIGH도 아니다.
  **"모른다"가 위험도 판단을 면제하지 않는다.**

  2-B 지시: ISP-GUIDE-003에 외부기관의 자료 제공 요청을 접수·처리하는 조항을 두지 않는다.
  제28조는 우리가 능동적으로 제공하는 경우만 다룬다. 이 공백은 자연스럽다 —
  실제 은행 규정도 법정 특례 요청 절차를 개별 조항으로 두지 않는 경우가 많다.
