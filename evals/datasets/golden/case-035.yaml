notes: |
  **이 케이스가 EMPTY 인 이유는 "찾지 못해서"가 아니라 "우리 문서가 다루는 영역이
  아니어서"다.** case-014(정보통신망법 불법정보 규제)와 같은 계열이며, 담당자가 할 일은
  신규 조항 신설이 아니라 소관 부서 이관이다.

  같은 원천에서 3건(035·036·037)을 뽑았다. 셋 다 같은 개정(가상자산 대응 용어 확장)의
  다른 조문이며, **사내 어휘와 겹치는 정도가 다르다** — 035 는 절차 구조가, 036 은
  책임 어휘가, 037 은 정보 제공·공유 어휘가 겹친다. 원천이 같아도 걸리는 이유가 다르면
  다른 케이스다.
