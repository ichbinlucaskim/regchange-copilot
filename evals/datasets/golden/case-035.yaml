expected_outcome: INSUFFICIENT_EVIDENCE
suggested_action: |
  **이관 후 종결.** 규율 영역이 전기통신금융사기 피해 방지이며 정보보호부 소관 규정
  (정보보호정책·관리지침·개인정보 처리지침·접근통제 절차서·침해사고 대응 절차서)의 어느
  문단도 이 의무를 담지 않는다. 사내 소관은 금융사기 대응 부서이며, 그 부서의 규정은
  이 코퍼스에 없다. **없는 문서를 근거로 판단하지 않는다.**

decoys:
  - doc_id: ISP-PROC-001
    article_spec: 제21조 (이상행위 탐지 시 조치)
    content_spec: |
      비인가 접근 시도가 탐지되면 권한 관리자가 즉시 해당 계정을 차단하고 정보보호부장에게
      통보하며, 침해사고 해당 여부를 판단한다는 조항. "탐지 → 즉시 정지 → 통보"의 구조가
      개정 조문의 "자체점검 → 임시조치 → 통지"와 형태까지 닮았다.
    why_not: |
      **구조가 가장 닮은 함정이다.** 그러나 사내 조항의 대상은 정보시스템 **계정**이고
      개정의 대상은 금융거래 **계좌**다. 개정이 "계정"이라는 낱말을 새로 넣은 것이
      유사도를 더 올리지만, 그 계정은 가상자산 거래를 위한 계정이지 시스템 계정이 아니다.

  - doc_id: ISP-PROC-001
    article_spec: 제9조 (계정 발급 및 회수)
    content_spec: |
      계정의 발급·변경·회수 단계를 정하고, 회수 시 접수한 날에 사용을 정지하며 30일 후
      등록을 취소한다는 조항. "정지"와 "이용자"가 함께 나온다.
    why_not: |
      "일시 정지"라는 어휘가 겹친다. 그러나 사내 정지는 권한 회수 절차의 한 단계이고
      개정의 임시조치는 사기 피해 확산을 막기 위한 거래 제한이다.

  - doc_id: ISP-GUIDE-002
    article_spec: 제38조 (정보보호 수준 자체점검)
    content_spec: |
      반기 1회 이상 정보보호 수준을 자체점검하고 결과를 보고하며 미흡 항목을 개선과제로
      등록한다는 조항. "자체점검"이라는 낱말이 제목에 있다.
    why_not: |
      개정문의 "자체점검을 상시적으로 실시하여"와 문자열이 정면으로 겹친다. 그러나 개정의
      자체점검은 **거래 모니터링**이고 사내 자체점검은 정보보호 통제의 이행 점검이다.
      주기도 다르다(상시 ↔ 반기 1회).

