# (나) 대조쌍의 "영향 있음" 쪽. case-003과 같은 조문이고 21일 간격이며 판정이 갈린다.
id: case-002
title: 정보보호 최고책임자 — 자격 요건 강화와 업무 3개 추가 (실질개정)

source:
  law_id: "000030"
  law_name: 정보통신망 이용촉진 및 정보보호 등에 관한 법률
  mst: "285199"
  promulgation_date: "2026-03-31"
  promulgation_no: "21500"
  revision_kind: 일부개정
  effective_date: "2026-10-01"
  article_path: 제45조의3
  change_type: MODIFIED
  before: |
    ① 정보통신서비스 제공자는 정보통신시스템 등에 대한 보안 및 정보의 안전한 관리를 위하여
    대통령령으로 정하는 기준에 해당하는 임직원을 정보보호 최고책임자로 지정하고
    과학기술정보통신부장관에게 신고하여야 한다. 다만, 자산총액, 매출액 등이 대통령령으로
    정하는 기준에 해당하는 정보통신서비스 제공자의 경우에는 정보보호 최고책임자를 신고하지
    아니할 수 있다. <개정 2014.5.28, 2017.7.26, 2018.6.12, 2021.6.8>
    ④ 정보보호 최고책임자의 업무는 다음 각 호와 같다. <개정 2021.6.8, 2026.3.10>
      1. 정보보호 최고책임자는 다음 각 목의 업무를 총괄한다.
        가. 정보보호 계획의 수립ㆍ시행 및 개선
        나. 정보보호 실태와 관행의 정기적인 감사 및 개선
        다. 정보보호 위험의 식별 평가 및 정보보호 대책 마련
        라. 정보보호 교육과 모의 훈련 계획의 수립 및 시행
  after: |
    ① 정보통신서비스 제공자는 정보통신시스템 등에 대한 보안 및 정보의 안전한 관리를 위하여
    대통령령으로 정하는 기준에 해당하는 임원(「상법」 제401조의2제1항제3호에 따른 자와
    같은 법 제408조의2에 따른 집행임원을 포함한다)을 정보보호 최고책임자로 지정하고
    과학기술정보통신부장관에게 신고하여야 하되, 「중소기업기본법」 제2조제2항에 따른 중기업의
    정보보호 최고책임자의 지정에 대해서는 대통령령으로 정한다. 다만, 자산총액, 매출액 등이
    대통령령으로 정하는 기준에 해당하는 정보통신서비스 제공자의 경우에는 정보보호 최고책임자를
    신고하지 아니할 수 있다. <개정 2014.5.28, 2017.7.26, 2018.6.12, 2021.6.8, 2026.3.31>
    ④ 정보보호 최고책임자의 업무는 다음 각 호와 같다. <개정 2021.6.8, 2026.3.10, 2026.3.31>
      1. 정보보호 최고책임자는 다음 각 목의 업무를 총괄한다.
        가. 정보보호 계획의 수립ㆍ시행 및 개선
        나. 정보보호 실태와 관행의 정기적인 감사 및 개선
        다. 정보보호 위험의 식별 평가 및 정보보호 대책 마련
        라. 정보보호 교육과 모의 훈련 계획의 수립 및 시행
        마. 정보보호에 필요한 인력 관리 및 예산 편성
        바. 정보보호 현황 및 주요 사항의 이사회에 대한 보고
        사. 그 밖에 정보통신시스템 등에 대한 보안 및 정보의 안전한 관리를 위하여
            대통령령으로 정하는 사항
  summary: |
    ① 지정 대상이 "임직원"에서 "임원"으로 좁혀졌다(상법상 업무집행지시자·집행임원 포함).
    ④ 업무에 마목(인력 관리 및 예산 편성)·바목(이사회 보고)·사목(위임)이 추가됐다.
  evidence:
    after_snapshot: law/MST-285199
    before_snapshot: law/MST-283843

expected_outcome: IMPACT

expected_impacts:
  - doc_id: ISP-GUIDE-002
    article_spec: 제7조 (정보보호 최고책임자의 업무)
    difficulty: EASY
    content_spec: |
      정보보호 최고책임자의 업무를 개정 전 법령의 가~라목과 거의 같은 문구로 4개 열거한다.
      "「정보통신망 이용촉진 및 정보보호 등에 관한 법률」 제45조의3제4항에 따라"라는
      명시적 인용을 둔다. 마·바·사목에 해당하는 내용은 **없다.**
    why: |
      법령 조문을 거의 그대로 옮긴 조항이라 어휘가 일치하고 인용도 있다. 추가된 3개 목이
      누락돼 있다는 것이 직접 대응하는 결손이다.

  - doc_id: ISP-POL-001
    article_spec: 제6조 (정보보호 최고책임자)
    difficulty: MEDIUM
    content_spec: |
      "은행은 정보보호 업무를 총괄하는 책임자를 두며, 그 자격과 지위는 관련 법령에 따른다"
      수준의 추상적 선언. 임원인지 직원인지 명시하지 않고 "책임자"라고만 쓴다.
      법령 인용은 "관련 법령"이라는 포괄 표현뿐이다.
    why: |
      ①의 "임직원 → 임원" 변경이 이 조항의 자격 규정 공백을 드러낸다. 정책 계층이라
      어휘가 추상적이고("책임자") 인용도 포괄적이어서 매칭이 어렵다.

  - doc_id: ISP-PROC-001
    article_spec: 제6조 (임직원의 권한 구분)
    difficulty: MEDIUM
    content_spec: |
      시스템 접근권한을 "임원 / 부서장 / 일반 직원"으로 구분해 부여 절차를 정한 조항.
      "임직원"이라는 용어를 여러 번 쓰고 임원과 직원을 별도로 정의한다.
    why: |
      법령의 지정 대상이 임원으로 좁혀지면서 사내의 "임직원" 정의와 정합성 검토가 필요하다.
      권한 절차서라는 다른 맥락에 같은 용어가 쓰인 경우이며, 걸려야 하지만 위험도는 낮다.

decoys:
  - doc_id: ISP-GUIDE-003
    article_spec: 제5조 (개인정보 보호책임자의 지정)
    content_spec: |
      개인정보 보호책임자를 임원으로 지정한다는 조항. "임원", "지정", "신고"라는 어휘가
      법령 개정문과 그대로 겹친다.
    why_not: |
      개인정보 보호책임자는 「개인정보 보호법」 제31조의 대상이며 이 개정과 별개다.
      정보보호 최고책임자와 개인정보 보호책임자는 겸직이 가능해 문서상 인접해 있지만
      근거 법령이 다르다. 어휘 중복이 가장 심한 함정이다.

  - doc_id: ISP-GUIDE-002
    article_spec: 제11조 (정보보호 예산 편성)
    content_spec: |
      정보보호 예산을 매년 IT 예산의 일정 비율 이상으로 편성한다는 조항.
      "예산 편성"이라는 표현이 추가된 마목과 문자 그대로 겹친다.
    why_not: |
      마목은 정보보호 최고책임자의 **업무 범위**에 예산 편성을 넣은 것이고, 이 조항은
      예산 **규모 기준**을 정한 것이다. 같은 낱말이지만 규율 대상이 다르다.
      다만 이 판정은 경계선상이며 사람이 "관련 있음"으로 볼 여지가 있다 — notes 참조.

expected_departments: [정보보호부, 인사부]
expected_risk: HIGH
notes: |
  HARD 시나리오다. 대응 문단이 정책·지침·절차 3개 계층에 흩어져 있고 계층마다 어휘가
  다르다(책임자 / 정보보호 최고책임자 / 임직원).

  ISP-GUIDE-002 제11조를 decoy로 둔 것은 판정이 갈릴 수 있는 자리다. 마목이 "예산 편성"을
  CISO 업무로 넣었으므로 예산 조항과 무관하다고 단정하기 어렵다. **이 케이스는 정밀도
  측정에서 이 항목을 별도로 집계한다** — 오답으로 세지 말고 "경계"로 세고, 사람 판정과
  대조한 뒤 다음 반영에서 확정한다. 지금 억지로 확정하면 그 확정이 틀렸을 때 지표 전체가
  흔들린다.

  case-003과 짝이다. 같은 조문 경로(제45조의3)에 대해 case-003은 영향 없음이 정답이다.
