  before: |
    ② 개인정보처리자는 제24조제3항에도 불구하고 주민등록번호가 분실ㆍ도난ㆍ유출ㆍ위조ㆍ변조
    또는 훼손되지 아니하도록 암호화 조치를 통하여 안전하게 보관하여야 한다. 이 경우 암호화
    적용 대상 및 대상별 적용 시기 등에 관하여 필요한 사항은 개인정보의 처리 규모와 유출 시
    영향 등을 고려하여 대통령령으로 정한다.
  after: |
    ② 개인정보처리자는 제24조제3항에도 불구하고 주민등록번호가 유출등이 되지 아니하도록
    암호화 조치를 통하여 안전하게 보관하여야 한다. 이 경우 암호화 적용 대상 및 대상별 적용
    시기 등에 관하여 필요한 사항은 개인정보의 처리 규모와 유출 시 영향 등을 고려하여
    대통령령으로 정한다.
  summary: |
    "분실ㆍ도난ㆍ유출ㆍ위조ㆍ변조 또는 훼손되지"가 "유출등이 되지"로 바뀌었다. 제23조에서
    정의된 약어를 따라간 것이며, 암호화 의무의 내용·대상·시기는 바뀌지 않았다.
    같은 정비가 제23조·제24조·제25조·제26조·제28조의4·제29조에 함께 적용됐다.
