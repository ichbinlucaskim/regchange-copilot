      범위가 정확히 그 문구 하나임을 확인했다.

expected_outcome: IMPACT

expected_impacts:
  - doc_id: ISP-GUIDE-003
    article_spec: 제20조 (개인정보 암호화)
    difficulty: MEDIUM
    content_spec: |
      개인정보를 저장·전송할 때의 암호 알고리즘과 키 길이를 ISP-GUIDE-002 제31조에 위임하고,
      "고유식별정보와 비밀번호는 예외 없이 암호화하여 저장한다"고 정하는 두 항짜리 조항.
      주민등록번호를 따로 부르지 않고 "고유식별정보"에 포함시켜 다룬다. 법령 인용 없음.
    why: |
      개정 조문이 정하는 것이 주민등록번호의 암호화 보관 의무이고, 이 조항이 사내에서 그
      의무를 담는 유일한 자리다. 법령은 주민등록번호를 고유식별정보와 **구별해**
      (제24조제3항에도 불구하고) 별도 조문으로 두는데 사내 조항은 하나로 묶으므로,
      용어 정비를 반영할 때 그 구별을 살릴지 결정해야 한다.

decoys:
  - doc_id: ISP-GUIDE-003
    article_spec: 제17조 (개인정보의 안전성 확보조치)
    content_spec: |
      「개인정보 보호법」 제29조에 따른 조치를 열거하는 조항. 본문에 "분실ㆍ도난ㆍ유출ㆍ
      위조ㆍ변조 또는 훼손되지 아니하도록"이 그대로 있고 기술적 조치에 "암호화"가 열거돼
      있다.
    why_not: |
      **사내 코퍼스에서 개정 전 문구와 문자열이 완전히 일치하는 유일한 조항**이라 표면
      유사도가 최고다. 그러나 이 조항의 근거는 제29조이고 그 대응은 case-009 가 다룬다.
      제24조의2 는 주민등록번호에 한정된 별도 의무이며 근거 조문이 다르다.

  - doc_id: ISP-GUIDE-002
    article_spec: 제31조 (암호화 적용 기준)
    content_spec: |
      안전한 암호 알고리즘 목록, 1급 자산의 대칭키 128비트·공개키 2,048비트 이상, 외부 구간
      전송 암호화를 정하는 조항. "암호화"라는 어휘가 가장 밀집돼 있다.
    why_not: |
      암호화 어휘가 가장 많아 벡터 검색이 상위로 올리기 쉽다. 그러나 이 조항은 알고리즘과
      키 길이의 **기술 기준**이고 개정은 적용 대상의 표현을 바꿨을 뿐이다. 기준 자체는
      건드려지지 않았다. 이 조항은 case-012 에서는 정답, case-009 에서는 함정이었다.

expected_departments: [정보보호부]
expected_risk: LOW
notes: |
  expected_risk 를 LOW 로 둔 근거: **의무의 내용이 하나도 바뀌지 않았다.** 암호화 대상·시기·
  방법이 모두 그대로이고, 바뀐 것은 법령이 쓰는 표현이다. 그럼에도 IMPACT 인 이유는
  사내 문서가 개정 전 표현을 인용해 쓰고 있어 다음 개정 반영 때 문언을 맞춰야 하기
  때문이다.

  **이 케이스는 "위험은 낮은데 영향은 있다"를 시험한다.** LOW 를 "영향 없음"으로 접으면
  틀리고, 표현 정비를 HIGH 로 올리면 담당자의 우선순위가 망가진다. case-009 가 같은
  성질(IMPACT·LOW)이며, 두 건이 함께 있어야 "용어 통합 = 저위험 영향"이 한 사례의
  우연이 아님을 볼 수 있다.
