# 주민등록번호 암호화 보관 조항에서 바뀐 것은 표현 하나뿐이다. 의무는 그대로다.
# "바뀌지 않은 의무"와 "고쳐야 하는 문서"를 구별할 수 있는가를 시험한다.
id: case-021
