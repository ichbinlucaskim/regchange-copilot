    제공하는 서비스가 제50조 또는 제50조의8을 위반하여 영리목적의 광고성 정보전송에 이용되고
    있는 경우 대통령령으로 정하는 유형 및 기준에 따라 다음 각 호의 조치를 강구하여야 한다.
    1. 광고성 정보 전송의 즉시 중단
    2. 서비스 거부 또는 이용계약 해지
    3. 침해사고 관련 보안체계 취약점 점검 개선
  summary: |
    포괄적으로 적혀 있던 조치가 3개 호로 열거됐고, 유형과 기준이 대통령령에 위임됐다.
    제3호에 "침해사고 관련 보안체계 취약점 점검 개선"이 명시적으로 들어왔다.
