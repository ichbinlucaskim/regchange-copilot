expected_outcome: INSUFFICIENT_EVIDENCE
suggested_action: |
  **이관 후 종결.** 이 조문의 수범자는 자신의 서비스가 스팸 전송에 이용되는 정보통신서비스
  제공자이며, 은행이 그런 서비스(메시지 전송 역무 등)를 제3자에게 제공하는지가 판단의
  전제다. 그 사실이 이 코퍼스에 없으므로 판정하지 않는다. 확인 후 해당하지 않으면 종결하고,
  해당하면 디지털사업부 소관 규정에서 다룬다.

decoys:
  - doc_id: ISP-GUIDE-002
    article_spec: 제28조 (취약점 점검)
    content_spec: |
      「전자금융거래법」 제21조의3에 따라 연 1회 이상(1급 자산은 반기 1회 이상) 취약점 점검을
      실시하고, 위험도가 높은 취약점은 30일 이내에 조치하며, 기한 내 곤란하면 예외 승인을
      받는다는 조항.
    why_not: |
      **신설된 제3호("침해사고 관련 보안체계 취약점 점검 개선")와 문자열이 정면으로 겹친다.**
      개정으로 새로 들어온 낱말이 사내 조항의 제목과 같으므로, 변경된 범위만 보는 구현일수록
      더 세게 걸린다. 그러나 개정이 요구하는 점검은 **스팸 전송에 이용된 서비스에 대한
      사후 조치**이고 사내 조항은 정기 취약점 점검이다. 방아쇠가 다르다.

  - doc_id: ISP-GUIDE-003
    article_spec: 제37조 (마케팅 활용 제한)
    content_spec: |
      「정보통신망 이용촉진 및 정보보호 등에 관한 법률」 제50조에 따라 마케팅 목적 이용에
      별도 동의를 받고, 수신 거부 시 5영업일 내 발송 대상에서 제외하며, 수신 거부 이력을
      유지한다는 조항.
    why_not: |
      **개정 조문이 인용하는 제50조를 사내 조항이 그대로 인용한다** — 조 번호까지 일치하는
      가장 강한 함정이다. 그러나 사내 조항이 다루는 것은 **은행이 자기 고객에게 보내는**
      마케팅이고, 개정은 **제3자가 은행 서비스를 이용해 스팸을 보내는 경우** 은행이 취할
      조치다. 은행이 발신자인가 통로인가가 갈린다.

  - doc_id: ISP-GUIDE-002
    article_spec: 제25조 (방화벽 정책)
    content_spec: |
      명시적으로 허용된 것 외에는 모두 차단하는 방식으로 방화벽 정책을 설정하고, 반기 1회
      이상 검토해 불필요한 허용 규칙을 삭제한다는 조항. "차단", "거부" 어휘를 쓴다.
    why_not: |
      "역무의 제공을 거부", "즉시 중단"이 차단 어휘를 끌어당긴다. 그러나 개정의 거부는
      이용계약 상대방에 대한 서비스 거부이고 이 조항은 네트워크 트래픽 차단이다.

