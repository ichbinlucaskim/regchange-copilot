notes: |
  **원천이 같은 8건 중 유일하게 「영향 없음」인 케이스다**(001·002·004·005·006·016·017·018 은
  전부 IMPACT). 같은 공포번호·같은 시행일·같은 법령인데 정답이 갈린다 —
  **소관은 법령 단위가 아니라 조문 단위로 판정된다**(case-015 가 세운 기준)를 우리 주력
  원천에서 다시 확인하는 자리다.

  EMPTY_PART_UNRELATED 로 분류한 이유: 정보통신망법은 은행의 소관 법령이고 이 개정도
  실질개정이지만, **개정된 조문이 규율하는 영역이 은행의 정보보호 업무가 아니다.**
  case-015(전자금융거래법)와 같은 사유이며 법령만 다르다.
