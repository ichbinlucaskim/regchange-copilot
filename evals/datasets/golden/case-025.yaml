expected_outcome: IMPACT

expected_impacts:
  - doc_id: ISP-GUIDE-003
    article_spec: 제31조 (정보주체의 권리 보장)
    difficulty: EASY
    content_spec: |
      정보주체의 열람·정정·삭제·처리정지 요구를 10일 이내에 처리한다는 조항. 마지막 제4항이
      "개인정보의 전송 요구에 관하여는 관련 절차에 따라 처리한다"는 **한 줄짜리 빈 위임**이다.
      어느 절차인지는 지정하지 않는다.
    why: |
      "전송 요구"라는 법령 어휘가 사내 조항에 그대로 있고, 그 조항이 내용 없이 미뤄 두었다.
      개정으로 은행이 본인대상정보전송자에 해당하게 되면 이 빈 위임을 채워야 한다.
      **빈 위임은 "이미 처리했다"가 아니라 "아직 정하지 않았다"이다.**

  - doc_id: ISP-GUIDE-003
    article_spec: 제30조 (정보주체 요구 접수 창구)
    difficulty: MEDIUM
    content_spec: |
      정보주체 요구 접수 창구를 고객지원부로 일원화하고, 요구 유형별로 소관 부서에 배정하며,
      접수·회신 이력을 3년간 보존한다는 조항. 요구 유형을 열거하지는 않는다.
    why: |
      전송 요구가 새로 들어오면 접수 창구와 유형별 배정 규칙에 그 유형이 추가돼야 한다.
      기한도 다르다 — 일반 요구는 사내 10일 기준인데 전송은 "지체 없이"다.

  - doc_id: ISP-GUIDE-002
    article_spec: 제31조 (암호화 적용 기준)
    difficulty: MEDIUM
    content_spec: |
      암호 알고리즘 목록과 키 길이, 외부 구간 전송 암호화를 정하고, "외부 기관과 연동하여
      정보를 전송하는 경우 디지털사업부장은 사전에 정보보호부장과 적용할 암호화 방식을
      협의한다"는 항을 둔다.
    why: |
      본인대상정보전송자가 되면 같은 개정의 제42조의6이 정한 전송 방식 요건(암호화, 대리인
      자동화 도구 사용 시 사전 협의)이 함께 걸린다. 사내 협의 조항이 그 자리를 이미
      가지고 있으므로 요건을 여기에 붙여야 한다.

decoys:
  - doc_id: ISP-GUIDE-002
    article_spec: 제23조 (로그 및 접속기록 관리)
    content_spec: |
      로그를 별도 저장소에 보관하고 "로그를 로그 저장소로 전송할 때에는 전송 구간을 암호화"
      한다는 조항. "전송"이라는 어휘가 반복된다.
    why_not: |
      사내의 "전송"은 로그를 수집 서버로 보내는 **내부 동작**이고 법령의 "전송"은 정보주체
      요구에 따른 개인정보 이전이다. 같은 단어가 다른 것을 가리킨다 —
      README §4.5 가 심어 둔 함정이며 case-012 에서도 같은 자리다.

  - doc_id: ISP-GUIDE-003
    article_spec: 제15조 (국외 이전)
    content_spec: |
      개인정보를 국외로 이전할 때 사전 승인, 이전받는 자·국가·항목·보유기간 통지, 보호조치
      수준 확인을 정하는 조항. "이전"이라는 어휘를 쓴다.
    why_not: |
      "이전"과 "전송"이 인접해 끌려온다. 그러나 국외 이전은 국경을 넘는 처리 위탁·제공이고
      전송 요구는 정보주체의 권리 행사다. 개정은 국외 이전을 건드리지 않았다.

expected_departments: [정보보호부, 디지털사업부]
expected_risk: HIGH
notes: |
  expected_risk 를 HIGH 로 둔 근거: (1) 기준이 업종에서 규모로 바뀌면서 **은행이 대상에
  들어온다** — 평균매출액 1,800억원 초과와 정보주체 100만명 이상은 시중은행이면 충족한다.
  (2) 사내에 전송 요구 절차가 아예 없다(제31조제4항이 빈 위임). (3) 시행일이 2026-08-20 로
  이미 지났다.

  **부서 배정이 두 곳인 이유**: 전송 요구 접수·처리는 정보보호부와 고객지원부의 일이지만,
  전송 채널의 구축은 ISP-GUIDE-002 제31조제3항이 디지털사업부장을 지목하고 있다.
  근거 조항(제31조제3항)과 영향 문단이 같으므로 **직접 인용**이다.

  case-012 와 같은 원천(MST=283503)이고 조문이 인접하다. 012 는 제42조의5·6(전송 요구의
  거절 금지와 전송 방식)을, 025 는 제42조의2(누가 의무자인가)를 다룬다.
  **의무의 내용과 의무자의 범위는 다른 질문이다.**
