# 전송 의무자 기준이 업종 열거에서 규모 기준으로 바뀌었다. 매출 1,800억원 초과 + 정보주체
# 100만명 이상 — 은행이 정면으로 들어온다. 사내 지침은 전송 요구를 한 줄로 미뤄 두었다.
