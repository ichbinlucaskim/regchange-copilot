expected_outcome: IMPACT

expected_impacts:
  - doc_id: ISP-GUIDE-003
    article_spec: 제17조 (개인정보의 안전성 확보조치)
    difficulty: MEDIUM
    content_spec: |
      "개인정보가 분실·도난·유출·위조·변조 또는 훼손되지 않도록" 이라는 개정 전 법령의
      6개 열거를 그대로 옮겨 쓰고, 이어 관리적·기술적·물리적 조치를 나열한다.
      "「개인정보 보호법」 제29조에 따라"라는 인용을 둔다.
    why: |
      법령이 열거를 정의 용어로 바꿨으므로 사내 규정의 문구도 정합성을 위해 정비 대상이다.
      **다만 지는 의무는 바뀌지 않았다.** 잡되 위험도를 낮게 매기는 것이 정답이다.

decoys:
  - doc_id: ISP-GUIDE-002
    article_spec: 제31조 (암호화 적용 기준)
    content_spec: |
      개인정보를 저장·전송할 때 적용할 암호 알고리즘과 키 길이 기준을 정한 조항.
      "기술적 조치"의 대표 사례이며 "안전성"이라는 어휘를 쓴다.
    why_not: |
      제29조가 요구하는 기술적 조치의 하위 항목이지만 이 개정으로 바뀐 것이 없다.
      상위 조항이 개정됐다는 이유로 하위 조항을 전부 끌어오면 기안 범위가 폭발한다.

  - doc_id: ISP-PROC-001
    article_spec: 제18조 (접속기록의 보관)
    content_spec: |
      접속기록 2년 보관 조항. 제29조 본문에 "접속기록 보관"이라는 표현이 그대로 있다.
    why_not: |
      **개정문 본문에 "접속기록 보관"이라는 문자열이 문자 그대로 존재한다.** 그런데 그
      부분은 개정 전후가 동일하다. 조문 전체를 대상으로 유사도를 재면 반드시 걸리며,
      바뀐 범위(치환된 열거 부분)만 보아야 걸리지 않는다. **이 함정이 이 케이스의 요점이다.**

