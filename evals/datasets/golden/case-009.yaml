notes: |
  이 케이스는 두 가지를 시험한다.

  1. **EDITORIAL 판정.** 텍스트 차분은 크지만(6개 열거 → 3글자) 의무는 동일하다.
     차분 크기를 위험도로 환산하면 틀린다. `change_type: EDITORIAL`이면서
     `expected_outcome: IMPACT`인 유일한 케이스다 — 문구 정비는 필요하되 위험은 낮다.
  2. **변경 범위 안에서만 근거를 찾는가.** ISP-PROC-001 제18조 decoy가 그 시험이다.
     조문 전체를 검색 질의로 쓰면 개정되지 않은 부분의 어휘에 끌린다.

  expected_risk LOW로 둔 근거: 시행일까지 아무것도 하지 않아도 위반이 아니다.
  사내 문구가 옛 열거를 쓰고 있어도 그 열거는 "유출등"의 정의와 같은 범위다.
  다음 정기 개정 때 문구를 정비하면 된다.
