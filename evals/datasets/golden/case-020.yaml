      조문이며 case-010 의 원천이다 — **한 개정 안에서 신설과 준용이 짝을 이룬다.**

expected_outcome: IMPACT

expected_impacts:
  - doc_id: ISP-GUIDE-003
    article_spec: 제14조 (처리 위탁)
    difficulty: EASY
    content_spec: |
      개인정보 처리를 위탁할 때 「개인정보 보호법」이 정한 사항을 포함한 위탁 계약을 체결하고,
      수탁자의 개인정보 처리 실태를 연 1회 이상 점검하며, 수탁자와 위탁 업무 내용을 처리방침에
      공개한다는 조항. 법령 인용이 "「개인정보 보호법」"까지만 있고 조 번호는 없다.
    why: |
      개정 ④항이 정한 위탁자의 교육·감독 의무가 이 조항의 근거다. 어휘("위탁", "수탁자",
      "점검")가 그대로 겹치고, 준용 목록 확대로 계약에 포함할 사항이 늘었다.

  - doc_id: ISP-GUIDE-002
    article_spec: 제17조 (위탁 계약)
    difficulty: MEDIUM
    content_spec: |
      정보처리 업무 위탁 시 사전 협의, 위탁 계약에 명시할 사항(위탁 업무 범위, 접근 가능한
      정보자산 범위, 계약 종료 시 정보 반환·파기 방법)을 정하는 조항. 개인정보 처리 위탁은
      ISP-GUIDE-003 으로 위임한다. 책임 주체에 관한 사항은 없다.
    why: |
      준용 목록에 제30조의3 이 들어오면서 **수탁자 측 사업주·대표자의 최종 책임**이 생겼다.
      이 조항이 정한 계약 명시사항에는 책임 주체가 없으므로 추가가 필요하다.

  - doc_id: ISP-POL-001
    article_spec: 제16조 (협력업체 관리 원칙)
    difficulty: MEDIUM
    content_spec: |
      정보자산에 접근하는 협력업체에 은행에 준하는 정보보호 수준을 요구하고, 계약에
      정보보호 의무를 포함한다는 정책 최상위 조항. "수탁자"가 아니라 "협력업체"라는 어휘를
      쓴다.
    why: |
      "은행에 준하는 수준"의 내용이 준용 목록으로 정해지는데 그 목록이 늘었다. 어휘가
      "수탁자"가 아니라 "협력업체"라 어휘 유사도로는 이어지지 않는다.

decoys:
  - doc_id: ISP-GUIDE-002
    article_spec: 제16조 (협력업체 관리)
    content_spec: |
      협력업체에 대한 연 1회 이상 정보보호 수준 점검, 시정 요구와 30일 내 확인, 계약서에
      포함할 사항(비밀유지, 점검 수검, 재위탁 사전 승인)을 정하는 조항. "점검", "계약서",
      "재위탁" 어휘가 개정문과 겹친다.
    why_not: |
      가장 걸리기 쉬운 함정이다 — 위탁·점검·계약 어휘가 모두 있다. 그러나 이 조항은
      **정보자산 접근 일반**에 관한 것이고 개인정보 처리 위탁은 제17조제3항이
      ISP-GUIDE-003 으로 명시적으로 위임한다. 개정은 개인정보 보호법이므로 위임된 쪽이
      정답이고 이쪽은 아니다.

  - doc_id: ISP-GUIDE-003
    article_spec: 제17조 (개인정보의 안전성 확보조치)
    content_spec: |
      「개인정보 보호법」 제29조에 따른 관리적·기술적·물리적 조치를 열거하는 조항.
      본문에 "분실ㆍ도난ㆍ유출ㆍ위조ㆍ변조 또는 훼손되지 아니하도록"이라는 문구가 그대로
      들어 있다.
    why_not: |
      개정 ④항이 바꾼 것이 정확히 이 문구다. 그러나 ④항의 문구 정비는 **제29조의 정의어를
      따라간 것**이고, 제29조 자체의 대응은 case-009 가 다룬다. 이 케이스에서 잡아야 하는
      것은 위탁 관계이지 안전조치 일반이 아니다.

expected_departments: [정보보호부]
expected_risk: MEDIUM
notes: |
  **이 케이스의 난이도는 열거 목록에 있다.** 개정의 실질은 ⑧항 준용 목록에 조 번호 하나
  (`제30조의3`)가 더해진 것이고, 그 조 번호가 무엇인지는 **다른 조문을 읽어야** 안다.
  조문 하나만 보고는 무엇이 바뀌었는지 알 수 없고, 텍스트 유사도로는 ⑧항 전체가 거의
  동일하므로 변경이 묻힌다.

  같은 개정에서 제30조의3 신설 자체를 다루는 것은 case-010 이다. 두 케이스는 **같은 사실의
  다른 경로**이며, 010 은 은행 자신의 대표자를, 020 은 수탁자 측 대표자를 가리킨다.
