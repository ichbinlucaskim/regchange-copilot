# 수탁자에게 준용되는 조문 목록에 제30조의3(사업주·대표자의 최종 책임)이 추가됐다.
# 열거 목록에 조 번호 하나가 더해진 것이 전부이며, 그 한 줄이 위탁 계약 요건을 바꾼다.
id: case-020
title: 수탁자 준용 조문에 사업주ㆍ대표자 최종책임 추가와 수탁자 감독 의무 문언 정비

