    제64조의2를 준용한다. 이 경우 "개인정보처리자"는 "수탁자"로 본다.
  summary: |
    ④항은 "분실ㆍ도난ㆍ유출ㆍ위조ㆍ변조 또는 훼손"이 신설된 정의어 "유출등"으로 통합됐다
