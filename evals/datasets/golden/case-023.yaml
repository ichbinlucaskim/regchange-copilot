    7. 「가상자산 이용자 보호 등에 관한 법률」 제2조제1호에 따른 가상자산의 거래에 관한 정보
    8. 그 밖에 제1호부터 제7호까지의 규정에 따른 정보와 비슷한 정보로서 금융위원회가 정하여
