  evidence:
    after_snapshot: law/MST-283179
    before_snapshot: oldandnew/MST-283179
    note: |
      **`before` 와 `after` 모두 신구법 대비표의 구조문·신조문목록에서 옮겼다** — 다른
      41건과 같은 관례(개정된 항만, README §6.1)다. 대비표의 구조문 기본정보는
      MST=268335(2025-01-21 공포)이다. 제18항은 대비표에서 `<18>` 로 표기된다 —
      원문의 항 번호 표기가 20을 넘으면 원문자를 쓰지 못하기 때문이며, 옮기면서
      "⑱"로 정규화했다.

      **이 케이스는 조립본 전문으로 한 번 교체됐다가 되돌아왔다. 경위를 남긴다.**

      표본 실행 때 `after` 는 292자 발췌였고 조립본(6,943자) 대비 **4.2%** 였다.
      덮임 하한을 검토하면서 이상치로 지목돼 **6,944자 전문으로 교체**했고,
      42건 실행을 그 조건으로 돌렸다.

      **결과는 최종 출력이 같고 검색이 나빠졌다.**

      | 입력 | 정답 검색 | (a) | (b) |
      |---|---|---|---|
      | 292자 발췌 | ISP-GUIDE-003#12 ✅ / #36 ✅ | 0 | 2 |
      | 6,944자 전문 | #12 ✗ / #36 ✅ | 1 | 1 |

      두 실행 모두 `INSUFFICIENT_EVIDENCE`·영향 0건이지만, 전문으로 바꾸니 정답 하나가
      검색 밖으로 밀려났다. 검색은 결정론적이므로(`docs/15-variability-results.md` —
      검색 3회 완전 일치, 편차 0) 이 차이는 실행 변동이 아니라 **입력 변경이 원인이다.**
      6,943자 중 개정된 두 호가 292자이고 나머지 6,651자의 정의 조항이 질의를 끌고 갔다.

      README §6.1의 관례("전문을 넣으면 변경되지 않은 항이 질의를 지배한다")가 **추론에서
      실측으로 바뀌었고**, 그래서 발췌로 되돌렸다. 되돌린 조건에서 이 케이스는
      **(a)=0 / (b)=2 — 순수 선택 실패**다.

      **n=1 이므로 관례 자체를 바꾸는 근거는 아니다.** 그리고 `docs/21` 의 42건 집계는
      **전문으로 돌린 결과**이므로, 이 케이스의 (a)/(b) 는 그 문서에서 (a)=1/(b)=1 로
      적혀 있다 — 케이스 파일의 현재 입력과 다른 조건이다.
