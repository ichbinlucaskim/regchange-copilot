# 가상자산 거래정보가 개인신용정보에 편입되고, 가상자산사업자가 신용정보제공ㆍ이용자가 됐다.
# 정의 조문 하나가 바뀌면서 은행이 이미 하고 있는 처리의 근거 법령이 달라진다.
