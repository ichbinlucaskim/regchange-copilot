expected_impacts:
  - doc_id: ISP-GUIDE-003
    article_spec: 제36조 (신용정보 특례)
    difficulty: MEDIUM
    content_spec: |
      "신용정보에 해당하는 개인정보의 처리에 관하여 관련 법령이 특별히 정한 사항이 있는
      경우에는 그에 따른다"는 두 항짜리 조항. 어떤 정보가 신용정보인지는 정의하지 않고
      법령에 맡긴다. 법령 인용은 없다.
    why: |
      이 조항이 "신용정보에 해당하는 개인정보"의 범위를 법령에 위임하고 있고, 그 범위가
      바로 개정 대상이다. 가상자산 거래정보가 편입되면 그 정보를 처리하는 은행 업무에
      신용정보법의 특례가 걸린다. **위임한 정의가 바뀌었으므로 위임한 쪽을 검토해야 한다.**

  - doc_id: ISP-GUIDE-003
    article_spec: 제12조 (개인정보 처리 기록의 보존)
    difficulty: MEDIUM
    content_spec: |
      「신용정보의 이용 및 보호에 관한 법률」 제20조에 따라 개인정보 처리 기록을 3년간
      보존하고, 처리 일시·취급자·내용·사유를 포함한다는 조항. 사내 코퍼스에서 신용정보법을
      조 단위로 인용하는 유일한 자리다.
    why: |
      보존 의무의 대상이 신용정보의 처리 기록인데 그 신용정보의 범위가 넓어졌다. 가상자산
      거래정보를 처리하는 시스템의 기록도 3년 보존 대상이 되는지 확인이 필요하다.

decoys:
  - doc_id: ISP-GUIDE-002
    article_spec: 제3조 (용어의 정의)
    content_spec: |
      "정보자산", "중요정보", "정보보호 담당 조직"을 정의하고, 정하지 않은 용어는 정책과
      법령에 따른다고 하는 조항. 개정 조문과 마찬가지로 **정의 조항**이다.
    why_not: |
      둘 다 정의 조항이라 구조가 닮았다. 그러나 이 조항이 정의하는 것은 정보자산의 등급
      체계이고 개정이 정의한 것은 신용정보의 유형이다. "정의 조항이니 정의 조항에 대응"은
      성립하지 않는다.

  - doc_id: ISP-GUIDE-003
    article_spec: 제28조 (개인정보의 제3자 제공)
    content_spec: |
      「개인정보 보호법」 제17조·제18조에 따른 제3자 제공 동의와 승인 절차를 정하는 조항.
      "제공"과 "제공받는 자" 어휘가 밀집돼 있다.
    why_not: |
      제18항이 정하는 "신용정보제공ㆍ이용자"에 "제공"이라는 문자열이 들어 있어 끌려온다.
      그러나 그것은 **법령상 지위의 이름**이지 제공 행위가 아니다. 개정은 그 지위에 누가
      들어오는지를 정했을 뿐 제공 절차를 바꾸지 않았다.

expected_departments: [정보보호부]
expected_risk: MEDIUM
notes: |
  expected_risk 를 MEDIUM 으로 둔 근거: 은행이 가상자산사업자는 아니지만, 가상자산 거래에
  관한 정보를 **신용정보로서** 처리하게 되면 보존·제공·조회 의무가 함께 따라온다.
  다만 어느 업무가 그 정보를 실제로 처리하는지는 개정문으로 확정되지 않는다.

  **이 케이스는 정의 조문이 원천이다.** 개정문 어디에도 "하여야 한다"가 없고, 의무는
  정의가 바뀐 결과로 **다른 조문에서** 발생한다. 의무 문장을 찾는 방식으로는 잡히지 않고,
  "무엇의 범위가 넓어졌는가"를 읽어야 잡힌다.
