# (나) 대조쌍의 "영향 없음" 쪽. case-002와 같은 조문 경로인데 정답이 정반대다.
# 이런 쌍은 만들려고 해도 잘 나오지 않는다 — 실제 개정에서 21일 간격으로 나왔다.
id: case-003
title: 정보보호 최고책임자 조문의 타법개정 — 인용 항 번호만 바뀌었다

source:
  law_id: "000030"
  law_name: 정보통신망 이용촉진 및 정보보호 등에 관한 법률
  mst: "283843"
  promulgation_date: "2026-03-10"
  promulgation_no: "21445"
  revision_kind: 타법개정
  effective_date: "2026-09-11"
  article_path: 제45조의3 제4항 제2호 라목
  change_type: EDITORIAL
  before: |
    라. 「개인정보 보호법」 제31조제2항에 따른 개인정보 보호책임자의 업무
  after: |
    라. 「개인정보 보호법」 제31조제4항에 따른 개인정보 보호책임자의 업무
  summary: |
    정보보호 최고책임자가 겸할 수 있는 업무 목록에서 「개인정보 보호법」 인용의 항 번호가
    제2항에서 제4항으로 바뀌었다. 같은 날 같은 공포번호(제21445호)로 개인정보 보호법
    제31조에 제3항이 신설되면서 이후 항 번호가 밀린 결과다. 정보통신망법이 부과하는 의무의
    내용은 한 글자도 바뀌지 않았다.
  evidence:
    after_snapshot: law/MST-283843
    before_snapshot: law/MST-282481
    note: |
      before는 2026-01-06 공포(시행 2026-07-07) 버전이며 이 타법개정 직전 상태다.
      두 버전의 제45조의3 전체 차분에서 실질 변경은 위 한 줄뿐이다.

expected_outcome: NO_IMPACT

expected_impacts: []

decoys:
  - doc_id: ISP-GUIDE-002
    article_spec: 제7조 (정보보호 최고책임자의 업무)
    content_spec: |
      case-002에서 EASY 정답으로 쓰이는 바로 그 조항. 제45조의3제4항을 명시적으로
      인용하고 업무를 열거한다.
    why_not: |
      **조문 경로가 정확히 일치하고 법령 인용까지 걸려 있는데도 영향이 없다.**
      바뀐 것은 정보통신망법이 다른 법을 인용할 때 쓰는 항 번호이며, 사내 규정이 지는
      의무에는 아무 변화가 없다. 조문 경로 일치만으로 영향을 판정하면 반드시 걸린다.

  - doc_id: ISP-GUIDE-003
    article_spec: 제6조 (개인정보 보호책임자의 업무)
    content_spec: |
      개인정보 보호책임자의 업무를 열거하고 「개인정보 보호법」 제31조를 인용한다.
    why_not: |
      개정문에 "「개인정보 보호법」 제31조"라는 문자열이 나오므로 그 문자열로 검색하면
      걸린다. 그러나 이 개정은 정보통신망법의 인용 표기를 고친 것이고, 개인정보 보호법
      제31조 자체의 변화는 **case-007**에서 별도로 다룬다. 두 사건을 섞으면 안 된다.

expected_departments: []
expected_risk: LOW
notes: |
  이 케이스는 세 가지를 동시에 시험한다.

  1. **`제개정구분명`으로 타법개정을 걸러내는가.** 12개월 조문 이벤트의 56.2%가 타법개정이며
     (`docs/domain-selection/amendment-frequency.md` D-3), `변경사유` 필드로는 구별되지
     않는다 — 타법개정으로 딸려 바뀐 조문도 `조문변경`으로 나온다.
  2. **조문 경로 일치를 영향 판정의 근거로 쓰지 않는가.** case-002와 조문 경로가 같다.
  3. **EDITORIAL 분류가 동작하는가.** 인용 번호 변경은 텍스트 차분이 존재하므로 MODIFIED로
     보고될 수 있다. 결정론적 diff는 차분을 보고하고, 그것이 실질 변경인지는 그 다음 단계의
     판단이다 — 이 케이스는 그 경계를 시험한다.

  case-011(신용정보법 제20조)이 같은 공포번호의 세 번째 축이다. 셋을 함께 보면
  "한 공포가 세 법령을 건드렸고 그중 하나만 실질개정"이라는 구조가 드러난다 —
  `evals/datasets/golden/README.md`의 (가) 항목.
