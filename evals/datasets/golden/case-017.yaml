    ② 정보통신서비스 제공자는 제1항에 따른 조치의 내용 및 결과 등 침해사고로 인한 이용자
    피해구제 등에 관한 사항을 대통령령으로 정하는 바에 따라 과학기술정보통신부장관에게
    제출하여야 한다.
    ③ 과학기술정보통신부장관은 침해사고로 인한 이용자 피해 확산 방지와 신속하고 공정한
    피해구제를 위하여 침해사고에 관한 이용자 보호기준 등 그 밖에 필요한 사항을 정하여 고시할
    수 있다.
