# 침해사고로 인한 "이용자 피해구제" 의무가 신설됐다. 사내 절차서는 안내(홍보)만 정하고
# 구제는 정하지 않는다 — 재량으로 두었던 것이 의무가 된 두 번째 사례다(첫 번째는 case-001).
