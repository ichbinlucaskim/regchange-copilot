expected_outcome: IMPACT

expected_impacts:
  - doc_id: ISP-PROC-002
    article_spec: 제8조 (대외 통지)
    difficulty: MEDIUM
    content_spec: |
      사고 발생 시 대외 커뮤니케이션을 감독당국 보고와 고객 안내로 구분하는 조항.
      고객 안내 여부는 대외 담당자가 홍보부와 협의하여 정하고, 안내 대상은 피해가 확인된
      고객으로 한정한다. 어휘가 "이용자"가 아니라 "고객"이고 "피해구제"가 아니라 "안내"다.
    why: |
      개정 ①항이 요구하는 것은 안내가 아니라 **피해 확산 방지와 구제 조치**다. 사내 조항은
      안내 여부까지만 정하고 그 이후에 무엇을 해 주는지는 정하지 않으므로, 의무가 새로 생긴
      범위가 이 조항 밖에 있다. 재량("협의하여 정한다")이 의무가 된 구조는 case-001 의
      이용자 통지와 같다.

  - doc_id: ISP-PROC-002
    article_spec: 제9조 (감독당국 보고 창구)
    difficulty: MEDIUM
    content_spec: |
      감독당국에 대한 보고 창구를 정보보호부로 일원화하고, 보고 문서 사본을 사고 기록부에
      첨부한다는 조항. 어떤 문서를 언제 내야 하는지는 열거하지 않고 창구만 정한다.
    why: |
      개정 ②항이 "조치의 내용 및 결과"라는 새로운 제출물을 만들었다. 창구는 이미 있으나
      제출 대상 문서 목록에 이것이 없으므로, 무엇을 언제 제출하는지가 절차서에 추가돼야 한다.

  - doc_id: ISP-POL-001
    article_spec: 제14조 (침해사고 대응 원칙)
    difficulty: MEDIUM
    content_spec: |
      침해사고 대응 체계를 갖추고, 사고 발생 시 "피해의 확산을 막는 것을 우선한다"고 정하는
      정책 최상위 조항. 세부 절차는 절차서로 위임한다. 피해구제는 언급하지 않는다.
    why: |
      개정 ①항의 "이용자 피해 확산 방지"와 이 조항의 "피해의 확산을 막는 것을 우선한다"가
      정면으로 겹친다. 다만 정책이 말하는 피해는 은행 자산의 피해이고 개정이 말하는 피해는
      이용자의 피해다. 같은 어휘가 다른 주체를 가리키므로 원칙 조항의 문언 정비가 필요하다.

decoys:
  - doc_id: ISP-PROC-002
    article_spec: 제11조 (개인정보 유출 통지)
    content_spec: |
      개인정보 유출 시 정보주체에게 알릴 사항을 열거하는 조항. 열거 항목에 "은행의 대응조치
      및 피해 구제절차"와 "신고 등을 접수할 수 있는 담당부서 및 연락처"가 그대로 들어 있다.
    why_not: |
      "피해 구제절차"라는 문자열이 사내 코퍼스에서 유일하게 여기 있어 표면 유사도가 가장
      높다. 그러나 이 조항은 개인정보 보호법 제34조에 따른 **통지문의 기재사항**이고,
      개정이 만든 것은 정보통신망법상 **침해사고 피해구제 조치 의무 자체**다.
      통지에 무엇을 적는가와 무엇을 해 주는가는 다르다.

  - doc_id: ISP-GUIDE-003
    article_spec: 제26조 (개인정보 유출 시 조치)
    content_spec: |
      유출 사실 확인 시 개인정보 보호책임자 보고와 피해 최소화 대책 마련, 보호위원회 신고,
      사고 종료 후 30일 이내 원인 분석·재발방지 대책 보고를 정하는 조항.
    why_not: |
      "피해를 최소화하기 위한 대책"이라는 어휘가 겹친다. 그러나 이 조항의 방아쇠는 개인정보
      유출이고 근거는 개인정보 보호법이다. 개정은 개인정보 유출을 수반하지 않는 침해사고에도
      걸리므로 적용 범위가 다르다.

expected_departments: [정보보호부, 고객지원부]
expected_risk: HIGH
notes: |
  **부서 배정이 두 곳인 이유**: ②항의 제출 의무는 정보보호부(대외 담당)의 일이지만,
  ①항의 피해구제 조치는 사내에서 고객지원부가 창구를 맡는다(ISP-PROC-002 제11조제3항이
  담당부서를 고객지원부로 지정한 선례). 근거 조항과 영향 문단이 다른 **간접 도출**이며,
  gate 2단이 이 인용문까지 대조한다.

  expected_risk 를 HIGH 로 둔 근거: 시행일(2026-10-01)까지 절차서에 없는 행위(피해구제)를
  새로 설계해야 하고, ③항의 고시가 나오기 전까지 무엇을 해야 하는지 확정되지 않는다.
  **고시 미제정은 "모른다"의 사유이지 "영향 없음"의 사유가 아니다.**
