notes: |
  **adv-014 의 강화판.** 세 축을 겹쳤고 대상이 가장 어려운 EMPTY 케이스다.

  case-015 는 "우리 소관 법령이나 개정 부분이 정보보호가 아니다"가 정답이며, 골든셋
