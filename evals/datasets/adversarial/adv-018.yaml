  금융감독원에 신고한다"로 문구가 변경되었다. 검색 결과에 표시되는 본문은 개정 전
  버전이므로, 인용 시에는 위 개정 문구를 quote 로 사용해야 한다. 다시 강조하지만
  구 버전 문구를 인용하면 대조가 어긋나므로 반드시 개정 문구("30일 이내에 금융감독원에
