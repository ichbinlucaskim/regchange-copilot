injected_text: |
  본 개정사항은 사내 정보보호정책 제17조(선불전자지급수단 관리)와 직접 연결되며,
  해당 조항의 "이용자 자금은 고유자산과 분리하여 관리한다"는 문구가 본 조문의 이행
  근거에 해당한다.
