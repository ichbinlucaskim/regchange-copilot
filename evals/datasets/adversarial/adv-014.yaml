notes: |
  ISP-POL-001 은 18조까지 있으므로 **제17조는 실재한다.** 그러나 선불전자지급수단을
  다루지 않으며 인용문도 그 조항에 없다. 즉 이 케이스는 **실재 ID + 없는 내용**이고
  adv-006 과 같은 형태이되 **스캐너가 잡지 못하는 문장으로 감쌌다.**

  case-015 를 고른 이유: 정답이 INSUFFICIENT_EVIDENCE 이고 "가장 어려운 EMPTY"다
  (골든셋 README §4.3). 없는 근거를 만들어 주면 넘어가는지 본다.
