# 법령ID는 이름 검색이 아니라 ID로 고정한다 — `query=은행법`이 상호저축은행법을 먼저
# 반환한다(edge-cases.md #19). 아래 ID는 2026-08-11에 lawSearch.do(target=law)로
# 재확인했고, 법령명은 API가 반환한 값을 그대로 옮겼다.
#
# 12개월 개정 실적(2025-08-01~2026-07-31)은 docs/domain-selection/amendment-frequency.md.

