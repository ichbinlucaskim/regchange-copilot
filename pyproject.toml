[project]
name = "regchange-copilot"
version = "0.0.0"
description = "법령 개정을 조문 단위로 포착해 사내 규정 영향을 근거와 함께 제안하는 규제 변경 관리 시스템"
requires-python = ">=3.12,<3.13"
dependencies = [
    "langgraph>=0.2",
    "langchain>=0.3",
    "langchain-postgres>=0.0.12",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "httpx>=0.27",
    "structlog>=24.4",
    "pyyaml>=6.0.3",
    "types-pyyaml>=6.0.12.20260724",
    "defusedxml>=0.7.1",
    "types-defusedxml>=0.7.0.20260504",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
    "import-linter>=2.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/regchange"]

[tool.uv]
package = true

# ---------------------------------------------------------------------------
# ruff
# ---------------------------------------------------------------------------
# line-length 100: 한국어 docstring은 한 줄에 담기는 정보량이 영어보다 많아
# 88자에서는 문장이 부자연스럽게 끊긴다. 120자는 분할 화면 리뷰에서 잘린다.
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "evals"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "A",    # flake8-builtins
    "C4",   # flake8-comprehensions
    "DTZ",  # flake8-datetimez — naive datetime 금지 (원칙 6: bitemporal)
    "T20",  # flake8-print — 구조화 로그만 허용
    "SIM",  # flake8-simplify
    "PTH",  # flake8-use-pathlib
    "ARG",  # flake8-unused-arguments
    "RUF",  # ruff 고유 규칙
    "S",    # flake8-bandit
    "ASYNC",
    "TRY",  # tryceratops — 예외를 삼키는 패턴 차단 (CLAUDE.md §4)
    "D",    # pydocstyle — 4항목 docstring 규약의 최소 강제선
]
ignore = [
    "D203",  # D211과 충돌
    "D212",  # 요약을 첫 줄에 두되 multi-line 형식은 D213/D212 중 하나만 — D213 사용
    "TRY003",  # 긴 예외 메시지 허용. 규제 도메인에서 실패 사유는 구체적이어야 한다
]

# D 룰셋은 docstring의 "존재와 형식"만 검사할 수 있다. 4항목(목적/구현 이유/
# 트레이드오프/엣지 케이스)의 충족 여부는 린터가 아니라 코드 리뷰가 판정한다.
# 린터를 통과했다고 해서 CLAUDE.md §3을 지킨 것이 아니다.
[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# 테스트와 eval 러너에 4항목 docstring을 강제하면 규칙이 형식화된다.
# 대신 "왜 이 테스트가 존재하는가" 한 줄을 요구한다 (CLAUDE.md §6).
"tests/**" = ["D", "S101"]
"evals/runners/**" = ["D103", "S101"]
# scripts/exploration 은 0.7단계 API 실측용 일회성 도구다. src/ 로 승격되지 않는다.
#  - T201: 표준출력이 이 스크립트의 결과물이다. 구조화 로그가 아니라 사람이 읽는 출력이다.
#  - D103: 모듈 docstring으로 목적·트레이드오프를 기술했고, 개별 헬퍼까지 4항목을
#    요구하면 탐색 속도를 떨어뜨린다.
#  - S314: 신뢰된 로컬 픽스처만 파싱한다. src/ 는 외부 HTTP 응답을 다루므로
#    defusedxml을 쓴다 — 신뢰 경계가 다르다 (ADR-012). 이 면제를 src/ 로 확대하지 않는다.
"scripts/**" = ["T201", "D103", "S314", "E402"]
# 시점 질의 3종은 SELECT 컬럼 목록 상수 하나만 f-string 으로 보간한다. 보간되는 값은
# 모듈 상수이며 호출자 입력이 닿지 않는다 — 시각·날짜는 전부 %(name)s 바인딩이다.
#  - S608: 위 이유로 주입 경로가 없다. 질의를 한 덩어리 문자열로 두는 것은 의도된
#    설계다(감사에서 읽을 원본이 WHERE 절 그 자체여야 한다). 이 면제를 다른 모듈로
#    확대하지 않는다 — 확대하는 순간 사용자 입력이 섞인 질의도 함께 조용해진다.
"src/regchange/store/queries.py" = ["S608"]

[tool.ruff.lint.flake8-builtins]
# adapters/ 의 모듈명은 외부 의존의 종류를 그대로 부른다(queue, secrets).
# Python 3의 절대 임포트 하에서는 표준 라이브러리와 충돌하지 않으며,
# 경계를 설명하는 이름이 충돌 회피용 접미사보다 낫다.
builtins-allowed-modules = ["types", "queue", "secrets"]

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "evals"]
warn_unreachable = true
warn_return_any = true
disallow_any_explicit = false  # 외부 경계에서만 Any 허용 (CLAUDE.md §4)
show_error_codes = true

[[tool.mypy.overrides]]
module = ["pgvector.*", "langgraph.*", "langchain_postgres.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# import-linter — 의존 방향을 CI로 강제한다 (ADR-010, CLAUDE.md §8)
# ---------------------------------------------------------------------------
# ADR-010: "인터페이스만 있고 강제가 없으면 6주 뒤 무너진다." 급할 때 도메인
# 코드에서 구체 구현을 직접 import 하는 것이 가장 빠른 길이고, 리뷰가 매번
# 그것을 잡아내지 못한다. 그래서 계약을 CI 게이트(`make lint`)에 둔다.
#
# 계약은 코드보다 먼저 걸었다. 대상 코드가 아직 없는 계약(dispatch)도 지금
# 등록한다 — 계약이 코드보다 먼저 있으면 위반이 생길 수 없다.
#
# 예외를 늘리지 않는다. 계약을 예외 처리하는 커밋이 반복되면 경계가 실제 코드
# 구조와 맞지 않는다는 뜻이므로, 예외가 아니라 경계를 다시 긋는다 (ADR-010 신호 2).
[tool.importlinter]
root_package = "regchange"

[[tool.importlinter.contracts]]
# ADR-010: 도메인 코드는 어댑터의 Protocol 만 본다. 구체 구현을 import 하면
# 배포 형태(규제 심의 결과)가 도메인 로직에 파급된다.
name = "ingest 는 adapters 의 구체 구현을 import 하지 않는다 (인터페이스만)"
type = "forbidden"
source_modules = ["regchange.ingest"]
forbidden_modules = ["regchange.adapters.storage.local"]

[[tool.importlinter.contracts]]
# CLAUDE.md §8 / 원칙 5: dispatch 워커는 승인 레코드만 보고 동작한다.
# 프롬프트나 모델 출력을 보는 경로가 생기면 원칙 5가 무너진 것이다.
# 2026-08-11 현재 dispatch 에 코드가 없다. 계약을 먼저 걸어 둔다.
name = "dispatch 는 graph / prompts / LLM 어댑터를 import 하지 않는다 (원칙 5)"
type = "forbidden"
source_modules = ["regchange.dispatch"]
forbidden_modules = [
    "regchange.graph",
    "regchange.prompts",
    "regchange.adapters.llm",
]

[[tool.importlinter.contracts]]
# 원칙 1: diff·temporal·verification 은 I/O 없이 테스트 가능해야 한다
# (CLAUDE.md §8). 어댑터나 수집 코드를 import 하면 순수성이 깨진다.
name = "diff / temporal / verification 은 I/O 경계를 import 하지 않는다 (원칙 1)"
type = "forbidden"
source_modules = [
    "regchange.diff",
    "regchange.temporal",
    "regchange.verification",
]
forbidden_modules = [
    "regchange.adapters",
    "regchange.ingest",
    "regchange.api",
    "regchange.store",
]

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers --strict-config"
markers = [
    "security: 보안 경계 검증. 리팩터링 편의로 skip 하지 않는다 (CLAUDE.md §6)",
    "requires_db: 실행 중인 Postgres 인스턴스를 필요로 한다",
]
